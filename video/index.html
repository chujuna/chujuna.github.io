<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F7">
<script>try { document.documentElement.dataset.theme = localStorage.getItem('fv_theme') || 'light'; } catch (e) { document.documentElement.dataset.theme = 'light'; }</script>
<title>Video · 肥鱼小站</title>
<!-- Video.js 10（官方 CDN 片段，HLS 走 hls.js 引擎） -->
<script type="module" src="https://cdn.jsdelivr.net/npm/@videojs/cdn@10.5.0/video.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/@videojs/cdn@10.5.0/media/hlsjs-video.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #F5F5F7; --card: #FFFFFF; --text: #1D1D1F; --sub: #86868B;
    --line: rgba(0,0,0,.07); --accent: #1D1D1F; --red: #FA243C;
    --radius: 14px;
  }
  /* ===== 深色模式 ===== */
  :root[data-theme="dark"] {
    --bg: #000000; --card: #1C1C1E; --text: #F5F5F7; --sub: #98989F;
    --line: rgba(255,255,255,.13); --accent: #F5F5F7;
  }
  :root[data-theme="dark"] .topbar { background: rgba(0,0,0,.72); }
  :root[data-theme="dark"] .view-toggle { background: rgba(255,255,255,.1); }
  :root[data-theme="dark"] .view-toggle button.on { background: #48484A; color: var(--text); box-shadow: none; }
  :root[data-theme="dark"] .theme-btn { background: rgba(255,255,255,.1); }
  :root[data-theme="dark"] .chip.on { color: #000; }
  :root[data-theme="dark"] .poster { background: linear-gradient(150deg, #2C2C2E, #1C1C1E); }
  :root[data-theme="dark"] .poster .ph { color: #636366; }
  :root[data-theme="dark"] .searchbox { background: rgba(255,255,255,.11); }
  :root[data-theme="dark"] .searchbox:focus-within { background: var(--card); box-shadow: 0 1px 8px rgba(0,0,0,.5); }
  :root[data-theme="dark"] .clear-btn { background: rgba(255,255,255,.1); }
  :root[data-theme="dark"] .status .retry { color: #2997FF; }
  :root[data-theme="dark"] .spinner { border-color: rgba(255,255,255,.15); border-top-color: #E8E8ED; }
  :root[data-theme="dark"] .skel { background: linear-gradient(100deg, #1C1C1E 40%, #2C2C2E 50%, #1C1C1E 60%); background-size: 200% 100%; }
  /* 明暗切换：以按钮为中心圆形波浪扩散覆盖 */
  ::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
  ::view-transition-new(root) { animation: themeWave .6s ease-out; }
  @keyframes themeWave {
    from { clip-path: circle(0px at var(--rx, 50vw) var(--ry, 0px)); }
    to { clip-path: circle(var(--rr, 150vmax) at var(--rx, 50vw) var(--ry, 0px)); }
  }
  .theme-btn {
    width: 36px; height: 36px; border-radius: 50%; flex: none;
    display: grid; place-items: center; background: rgba(0,0,0,.05); color: var(--text);
  }
  .theme-btn svg { width: 17px; height: 17px; }
  .theme-btn .ic-sun { display: none; }
  :root[data-theme="dark"] .theme-btn .ic-sun { display: block; }
  :root[data-theme="dark"] .theme-btn .ic-moon { display: none; }
  html { background: var(--bg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased;
    padding-bottom: 60px;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  img { display: block; }

  /* ===== 顶栏 ===== */
  .topbar {
    position: sticky; top: 0; z-index: 40;
    backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
    background: rgba(245,245,247,.78);
    border-bottom: 1px solid var(--line);
  }
  .topbar-in {
    max-width: 1080px; margin: 0 auto; height: 56px; padding: 0 20px;
    display: flex; align-items: center; gap: 12px;
  }
  .topbar h1 { font-size: 20px; font-weight: 700; letter-spacing: .5px; cursor: pointer; }
  .topbar .spacer { flex: 1; }
  .view-toggle { display: flex; background: rgba(0,0,0,.05); border-radius: 9px; padding: 2px; }
  .view-toggle button {
    width: 34px; height: 26px; border-radius: 7px; display: grid; place-items: center; color: var(--sub);
  }
  .view-toggle button.on { background: #fff; color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .view-toggle svg { width: 16px; height: 16px; }

  /* ===== 布局 ===== */
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
  .chips {
    display: flex; gap: 8px; overflow-x: auto; padding: 16px 0 4px;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; padding: 7px 15px; border-radius: 999px; font-size: 14px;
    background: var(--card); color: var(--text); border: 1px solid var(--line);
    transition: all .18s;
  }
  .chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .chips.cats { padding-top: 8px; }
  .chips.cats .chip { background: transparent; border-color: transparent; color: var(--sub); padding: 6px 12px; }
  .chips.cats .chip.on { background: rgba(0,0,0,.06); color: var(--text); border-color: transparent; font-weight: 600; }

  /* ===== 卡片网格 ===== */
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px 12px; padding-top: 18px; }
  @media (min-width: 700px) { .grid { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 28px 18px; } }
  @media (min-width: 1024px) { .grid { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
  .vcard { cursor: pointer; min-width: 0; }
  .poster {
    position: relative; aspect-ratio: 3/4; border-radius: var(--radius); overflow: hidden;
    background: linear-gradient(150deg, #E8E8ED, #D9D9E0);
  }
  .poster img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .45s; }
  .poster img.ld { opacity: 1; }
  .poster .ph {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: #A1A1A6; font-size: 13px; padding: 10px; text-align: center;
  }
  /* 年代 + 更新状态：封面内左下角，各自一个背景层，上下排列（年代在上、更新在下） */
  .badge {
    position: absolute; left: 8px; bottom: 8px; max-width: calc(100% - 16px);
    display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
  }
  .badge span {
    background: rgba(0,0,0,.62); color: #fff; font-size: 11px; line-height: 1.25;
    padding: 4px 7px; border-radius: 6px; white-space: nowrap;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .grid.as-list .badge { display: none; }
  .vcard .nm { margin-top: 9px; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vcard .mt { margin-top: 3px; font-size: 12px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 年代 + 更新进度一行：放不下时自动换行（年代在上、更新在下） */
  .vcard .mt2 { margin-top: 3px; font-size: 12px; color: var(--sub); display: flex; flex-wrap: wrap; gap: 2px 8px; }
  .vcard .mt2 span { white-space: nowrap; }

  /* ===== 列表视图 ===== */
  .grid.as-list { grid-template-columns: 1fr; gap: 0; padding-top: 8px; }
  .grid.as-list .vcard {
    display: flex; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: center;
  }
  .grid.as-list .poster { width: 52px; flex: none; aspect-ratio: 3/4; border-radius: 9px; }
  .grid.as-list .nm { margin-top: 0; font-size: 15px; }
  .grid.as-list .cell { min-width: 0; }

  /* ===== 状态区 ===== */
  .status { padding: 34px 0 10px; text-align: center; color: var(--sub); font-size: 14px; }
  .status .retry { color: #0066CC; margin-left: 8px; }
  .spinner {
    width: 30px; height: 30px; margin: 0 auto 12px; border-radius: 50%;
    border: 3px solid rgba(0,0,0,.1); border-top-color: #55555A;
    animation: rot .8s linear infinite;
  }
  @keyframes rot { to { transform: rotate(360deg); } }
  .skel { border-radius: var(--radius); background: linear-gradient(100deg, #ECECF0 40%, #F5F5F8 50%, #ECECF0 60%); background-size: 200% 100%; animation: shim 1.2s infinite; }
  @keyframes shim { to { background-position: -200% 0; } }

  /* ===== 顶栏固定搜索框（聚焦时向右拉伸展开） ===== */
  .searchbox {
    flex: 0 1 124px; min-width: 0; height: 36px;
    display: flex; align-items: center; gap: 7px;
    background: rgba(0,0,0,.05); border-radius: 999px; padding: 0 12px;
    /* 展开/收起统一走 flex-basis + 同一条曲线，避免 Safari 下 flex 简写无动画 */
    transition: flex-basis .38s cubic-bezier(.32,.72,.28,1), background .38s cubic-bezier(.32,.72,.28,1), box-shadow .38s cubic-bezier(.32,.72,.28,1);
  }
  .searchbox:focus-within {
    flex-basis: min(340px, 60vw); background: #fff;
    box-shadow: 0 1px 8px rgba(0,0,0,.12);
  }
  .searchbox svg { width: 15px; height: 15px; color: var(--sub); flex: none; }
  .searchbox input {
    flex: 1; min-width: 0; border: none; outline: none; background: transparent;
    font: inherit; font-size: 16px; color: var(--text); /* 16px 起步，iOS 聚焦时才不会自动放大页面 */
  }
  .searchbox input::placeholder { color: var(--sub); }
  @media (min-width: 700px) { .searchbox { flex-basis: 200px; } }

  /* ===== 搜索结果条 ===== */
  .searchbar { display: none; }
  .searchbar.show { display: block; }
  .results-head {
    display: flex; align-items: center; gap: 10px; padding: 10px 0 0;
    color: var(--sub); font-size: 13px;
  }
  .results-head .spacer { flex: 1; }
  .clear-btn {
    flex: none; font-size: 13px; color: var(--text);
    background: rgba(0,0,0,.05); padding: 6px 13px; border-radius: 999px;
  }
  .chip .spd { font-size: 10px; font-weight: 400; opacity: .55; margin-left: 5px; }

  /* ===== 播放弹窗 ===== */
  .modal {
    position: fixed; inset: 0; z-index: 100; background: #000;
    transform: translateY(100%); transition: transform .38s cubic-bezier(.32,.72,.28,1);
    display: flex; flex-direction: column;
  }
  .modal.open { transform: none; }
  .pm-player { background: #000; flex: none; }
  .pm-player video-player, .pm-player video-skin { display: block; width: 100%; }
  /* 播放器直角，不要圆角 */
  .pm-player video-player, .pm-player video-skin, .pm-player hlsjs-video {
    border-radius: 0 !important; --media-border-radius: 0; --border-radius: 0;
  }
  /* 宽屏时限制播放器高度（最高约 62% 屏高），保证下方选集区始终够得着 */
  .pm-player video-skin { width: min(100%, 111vh) !important; margin-inline: auto; }
  .pm-body { flex: 1; overflow-y: auto; background: #0B0B0F; color: #F5F5F7; -webkit-overflow-scrolling: touch; }
  /* 内容区与播放器同宽同边缘（播放器宽为 min(100%, 111vh)），宽屏下不再小一块 */
  .pm-in { width: min(100%, 111vh); margin: 0 auto; padding: 20px 20px 110px; }
  .pm-head { display: flex; gap: 16px; align-items: flex-start; position: relative; }
  .pm-cover { width: 92px; flex: none; aspect-ratio: 3/4; border-radius: 10px; object-fit: cover; background: #1C1C21; }
  .pm-title { font-size: 21px; font-weight: 700; line-height: 1.3; }
  .pm-meta { margin-top: 7px; font-size: 13px; color: rgba(235,235,245,.55); line-height: 1.7; }
  /* 封面旁详情限高 = 封面高（92×4/3≈123px）：封面永不被文字拉高；溢出时末行尾显示「详情」 */
  .pm-side { position: relative; flex: 1; min-width: 0; max-height: 123px; overflow: hidden; }
  .pm-more { position: absolute; right: 0; bottom: 0; display: none; border: 0; cursor: pointer; padding: 2px 0 2px 30px; font-size: 13px; font-weight: 600; color: #2997FF; background: linear-gradient(90deg, rgba(11,11,15,0), #0B0B0F 30px); }
  .pm-side.has-more .pm-more { display: block; }
  /* 详情气泡：绝对定位浮层，打开不撑动页面 */
  /* 气泡用 fixed 定位挂在 body 上（JS 按视口上下空间决定开在上/下方）：不受弹窗滚动区裁剪 */
  .pm-tip { position: fixed; left: 16px; right: 16px; z-index: 118; overflow-y: auto; background: #1C1C1E; border: 1px solid rgba(255,255,255,.14); border-radius: 14px; padding: 14px 38px 14px 16px; box-shadow: 0 18px 44px rgba(0,0,0,.5); font-size: 13.5px; line-height: 1.9; color: rgba(235,235,245,.85); opacity: 0; transform: translateY(-4px); pointer-events: none; transition: opacity .18s, transform .18s; }
  .pm-tip.open { opacity: 1; transform: none; pointer-events: auto; }
  .pm-tip b { color: #F5F5F7; font-weight: 600; }
  .pm-tip .tip-x { position: absolute; top: 8px; right: 10px; width: 26px; height: 26px; border: 0; border-radius: 50%; background: rgba(255,255,255,.1); color: #F5F5F7; font-size: 15px; line-height: 1; cursor: pointer; }
  .pm-sec { margin-top: 24px; font-size: 15px; font-weight: 700; }
  .pm-desc { margin-top: 10px; font-size: 14px; line-height: 1.75; color: rgba(235,235,245,.75); }
  .src-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .src-tabs button {
    padding: 7px 15px; border-radius: 999px; font-size: 13px;
    background: rgba(255,255,255,.09); color: #F5F5F7;
  }
  .src-tabs button.on { background: #fff; color: #000; font-weight: 600; }
  .ep-ranges { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .ep-ranges button {
    padding: 6px 13px; border-radius: 999px; font-size: 12.5px;
    background: rgba(255,255,255,.09); color: #F5F5F7;
  }
  .ep-ranges button.on { background: #fff; color: #000; font-weight: 600; }
  .eps-box { position: relative; margin-top: 12px; }
  .eps-wrap { max-height: 228px; overflow-y: auto; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
  .eps-fade {
    position: absolute; left: 0; right: 0; bottom: 0; height: 46px; pointer-events: none;
    background: linear-gradient(to bottom, rgba(11,11,15,0), #0B0B0F);
    opacity: 0; transition: opacity .3s;
  }
  .eps-box.has-more .eps-fade { opacity: 1; }
  .eps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; }
  @media (min-width: 700px) { .eps { grid-template-columns: repeat(8, minmax(0, 1fr)); } }
  .eps button {
    padding: 10px 4px; border-radius: 9px; background: rgba(255,255,255,.07); color: #F5F5F7;
    font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .eps button.on { background: var(--red); color: #fff; font-weight: 600; }
  .pm-close {
    position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 110;
    height: 44px; padding: 0 24px; border-radius: 999px;
    background: var(--red); color: #fff; display: flex; align-items: center; gap: 8px;
    font-size: 15px; font-weight: 600; box-shadow: 0 8px 24px rgba(250,36,60,.45);
  }
  .pm-close:active { transform: translateX(-50%) scale(.97); }
  .pm-close svg { width: 15px; height: 15px; }
  .pm-loading { padding: 60px 0; text-align: center; color: rgba(235,235,245,.6); font-size: 14px; }
  .pm-loading .spinner { border-color: rgba(255,255,255,.18); border-top-color: #fff; }

  .toast {
    position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top)); transform: translate(-50%, -16px); z-index: 120;
    background: rgba(20,20,24,.88); color: #fff; font-size: 13.5px; padding: 10px 18px; border-radius: 999px;
    opacity: 0; pointer-events: none; transition: all .3s; max-width: 86vw; text-align: center;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  /* 静音自动播放的常驻提示：点任意处取消静音后消失 */
  .mute-hint {
    position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top)); transform: translate(-50%, -8px); z-index: 115;
    background: rgba(20,20,24,.82); color: #fff; font-size: 13px; padding: 9px 16px; border-radius: 999px;
    opacity: 0; pointer-events: none; transition: all .3s; white-space: nowrap;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .mute-hint.show { opacity: 1; transform: translate(-50%, 0); }
  body.locked { overflow: hidden; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <h1>Video</h1>
    <form class="searchbox" id="searchForm">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.8-3.8"/></svg>
      <input id="searchInput" type="search" placeholder="搜索片名…" autocomplete="off" enterkeyhint="search">
    </form>
    <div class="spacer"></div>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="切换明暗模式">
      <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13.6A8.5 8.5 0 1 1 10.4 4a7 7 0 0 0 9.6 9.6z"/></svg>
      <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <div class="view-toggle" role="group" aria-label="展示方式">
      <button id="vtCard" aria-label="卡片展示"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg></button>
      <button id="vtList" aria-label="列表展示"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/></svg></button>
    </div>
  </div>
</header>

<div class="wrap">
  <div id="browseBar">
    <div class="chips" id="sourceChips"></div>
  </div>
  <div class="searchbar" id="searchBar">
    <div class="chips" id="searchSourceChips" style="padding-top:14px"></div>
    <div class="results-head">
      <span id="searchMeta"></span>
      <div class="spacer"></div>
      <span id="searchCount"></span>
      <button class="clear-btn" id="clearSearch" type="button">清除搜索</button>
    </div>
  </div>
  <main class="grid" id="feed"></main>
  <div class="status" id="feedStatus"></div>
  <div id="feedSentinel"></div>
</div>

<!-- 播放弹窗 -->
<section class="modal" id="playerModal" aria-hidden="true">
  <button class="pm-close" id="pmClose" aria-label="关闭播放"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>关闭</button>
  <div class="pm-player">
    <video-player>
      <video-skin style="display: block; width: 100%; aspect-ratio: 16 / 9; --media-controls-before-start: visible;">
        <hlsjs-video id="hlsEl" playsinline autoplay muted></hlsjs-video>
      </video-skin>
    </video-player>
  </div>
  <div class="pm-body"><div class="pm-in" id="pmInfo"></div></div>
</section>

<div class="toast" id="toast"></div>
<div class="mute-hint" id="muteHint">点击任意处取消静音</div>

<script>
'use strict';
/* ============================================================
   数据源配置（苹果CMS10 Provide 接口，JSON 版）
   新增 / 修改数据源只改这里：name 显示名，api 为 JSON 接口地址
   （标准站为 …/provide/vod/at/json/，特殊站写完整地址）
   ============================================================ */
const SOURCES = [
  { name: '新浪',     api: 'https://api.xinlangapi.com/xinlangapi.php/provide/vod/at/json/' },
  { name: '优优',     api: 'https://api.yyzy-tv.vip/inc/api_mac10.php' },
  { name: '西瓜',     api: 'https://caiji.xgzyapi.com/api.php/provide/vod/at/json/' },
  { name: '天堂',     api: 'https://api.dyttcj.com/api.php/provide/vod/at/json/' },

/* 播放顺序（用户 2026-11-20 定）：一律先直连、失败再走中转，不按源预判。 */

const $ = s => document.querySelector(s);
const state = {

/* ---------- 工具 ---------- */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function https(u) { return u ? String(u).replace(/^http:\/\//i, 'https://') : ''; }
function fmtDate(t) { const m = String(t || '').match(/\d{4}-\d{2}-\d{2}/); return m ? m[0] : ''; }
function stripHtml(s) {

}
let toastTimer = 0;

function apiUrl(srcIdx, params) {
  const api = SOURCES[srcIdx].api;
  const qs = Object.entries(params).map(([k, v]) => k + '=' + encodeURIComponent(v)).join('&');
  return api + (api.includes('?') ? '&' : '?') + qs;

/* 跨域中转链：直连优先（源站日后开跨域可自动恢复），失败走自建 Netlify 中转 */
const PROXY_BASE = 'https://feiyu-proxy.netlify.app/api/proxy';
const viaProxy = u => PROXY_BASE + '?url=' + encodeURIComponent(u);
const PROXIES = [
  u => u,
  viaProxy,
];
async function fetchText(url, ms = 20000) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms);
  try {
    const r = await fetch(url, { signal: ctl.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.text();
  } finally { clearTimeout(t); }
}
/* 接口数据本地缓存 1 小时：重复切源 / 切分类 / 翻回已加载页不再重复请求 */
const CACHE_TTL = 60 * 60 * 1000;
const memCache = new Map();
function cacheGet(url) {
  const m = memCache.get(url);
  if (m && Date.now() - m.t < CACHE_TTL) return m.v;
  try {
    const raw = localStorage.getItem('fv_c_' + url);
    if (!raw) return null;
    const o = JSON.parse(raw);
    if (!o || Date.now() - o.t >= CACHE_TTL) { localStorage.removeItem('fv_c_' + url); return null; }
    memCache.set(url, { t: o.t, v: o.v });
    return o.v;
  } catch (e) { return null; }
}
function cacheSet(url, v) {
  memCache.set(url, { t: Date.now(), v });
  try {
    const s = JSON.stringify({ t: Date.now(), v });
    if (s.length < 500000) localStorage.setItem('fv_c_' + url, s);
  } catch (e) {
    /* 存储配额满：清掉旧缓存腾地方（内存缓存仍有效） */
    try { Object.keys(localStorage).filter(k => k.startsWith('fv_c_')).forEach(k => localStorage.removeItem(k)); } catch (e2) {}
  }
}
async function fetchJson(url, opts) {
  if (!opts || !opts.fresh) {
    const c = cacheGet(url);
    if (c) return c;
  }
  let lastErr = null;
  for (const wrap of PROXIES) {
    try {
      const j = JSON.parse(await fetchText(wrap(url)));
      cacheSet(url, j);
      return j;
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('fetch failed');
}
/* 把 m3u8 播放列表里的相对地址改成绝对地址（中转取回的列表才能正确定位分片） */
function absolutizePlaylist(text, baseUrl) {
  return text.split('\n').map(line => {
    const t = line.trim();
    if (!t) return line;
    if (t.startsWith('#')) {
      return line.replace(/URI="([^"]+)"/g, (m, u) => {
        try { return 'URI="' + new URL(u, baseUrl).href + '"'; } catch (e) { return m; }
      });
    }
    try { return new URL(t, baseUrl).href; } catch (e) { return line; }
  }).join('\n');
}
async function proxiedPlaylistUrl(url) {
  for (const wrap of PROXIES.slice(1)) {
    try {
      const t = await fetchText(wrap(url));
      if (t.includes('#EXTM3U')) {
        const blob = new Blob([absolutizePlaylist(t, url)], { type: 'application/vnd.apple.mpegurl' });
        return URL.createObjectURL(blob);
      }
    } catch (e) { /* 换下一个中转 */ }
  }
  throw new Error('playlist proxy failed');
}

/* ---------- 播放地址解析（只提取 m3u8） ---------- */
function parsePlay(vod) {
  const froms = String(vod.vod_play_from || '').split('$$$');
  const urls  = String(vod.vod_play_url  || '').split('$$$');
  const groups = [];
  urls.forEach((g, i) => {
    const eps = [];
    String(g || '').split('#').forEach(part => {
      const p = part.trim();
      if (!p) return;
      const di = p.indexOf('$');
      const name = di >= 0 ? p.slice(0, di) : '';
      const url  = di >= 0 ? p.slice(di + 1) : p;
      if (/\.m3u8($|\?)/i.test(url)) eps.push({ name: name || ('第' + (eps.length + 1) + '集'), url });
    });
    if (eps.length) groups.push({ from: (froms[i] || '播放源').trim(), episodes: eps });
  });
  return groups;
}
const hasM3u8 = vod => parsePlay(vod).length > 0;

/* ---------- 卡片 / 列表渲染 ---------- */
function itemHTML(v) {

    </div>

      ${state.view === 'list' && v.type_name ? `<div class="mt">${esc(v.type_name)}</div>` : ''}
    </div>
  </article>`;
}
function skeletonHTML(n) {
  return Array.from({ length: n }, () => '<div><div class="skel" style="aspect-ratio:3/4"></div><div class="skel" style="height:13px;margin-top:9px;border-radius:4px"></div></div>').join('');
}
function applyView() {

function bindCards(container) {

    if (el._bound) return;
    el._bound = true;
    el.addEventListener('click', () => {

/* ---------- 分类与首页信息流 ---------- */
/* 成人分类（伦理/色情等）一律不显示：分类芯片隐藏，其内容在首页与搜索里也过滤掉 */
const ADULT_RE = /伦理|色情|情色|成人|里番|福利|三级/;
function isAdultItem(v) {
  if (ADULT_RE.test(String(v.type_name || ''))) return true;
  if (v.type_id != null && state.blockedIds && state.blockedIds.has(+v.type_id)) return true;
  return false;
}
/* 首页只显示电影和电视剧：有 pid 的源按分类树找到一级分类判断；无 pid 的源按分类名判断 */
function isMovieOrTv(v) {
  const n = String(v.type_name || '');
  if (n === '纪录片') return false;
  if (state.catsHasPid && state.catMap && v.type_id != null && state.catMap.has(+v.type_id)) {
    let c = state.catMap.get(+v.type_id), guard = 0;
    while (c && c.type_pid != null && +c.type_pid !== 0 && guard++ < 5) c = state.catMap.get(+c.type_pid);
    const root = String((c && c.type_name) || '');
    if (/动漫|综艺/.test(root)) return false;
    return /电影|电视剧|连续剧/.test(root);
  }
  if (/动漫|综艺|纪录/.test(n)) return false;
  return /电影|电视剧|连续剧/.test(n) || /片$/.test(n) || /剧$/.test(n);
}
function renderChips() {
  $('#sourceChips').innerHTML = state.order.map(i => {
    const ms = state.speeds[i];
    const spd = ms == null ? '' : (ms > 0 ? `<span class="spd">${(ms / 1000).toFixed(1)}s</span>` : '<span class="spd">失败</span>');
    return `<button class="chip ${i === state.src ? 'on' : ''}" data-src="${i}">${esc(SOURCES[i].name)}${spd}</button>`;
  }).join('');
  $('#sourceChips').querySelectorAll('.chip').forEach(c =>
    c.addEventListener('click', () => { state.userPicked = true; switchSource(+c.dataset.src); }));
}
async function loadCats() {
  const src = state.src;
  try {
    const j = await fetchJson(apiUrl(src, { ac: 'list', pg: 1 }));
    if (src !== state.src) return;
    state.cats = Array.isArray(j.class) ? j.class : [];
  } catch (e) { if (src === state.src) state.cats = []; else return; }
  state.blockedIds = new Set(state.cats.filter(c => ADULT_RE.test(String(c.type_name || ''))).map(c => +c.type_id));
  state.catMap = new Map(state.cats.map(c => [+c.type_id, c]));
  state.catsHasPid = state.cats.some(c => c.type_pid != null && c.type_pid !== '');
  state.catsSrc = src;
  renderChips();
}
function statusHTML(kind, msg) {
  if (kind === 'loading') return '<div class="spinner"></div>加载中…';
  if (kind === 'error') return `加载失败，可能是该数据源暂时不可用或不允许跨域访问<button class="retry" onclick="window.__retryFeed&&window.__retryFeed()">重试</button>`;
  if (kind === 'end') return '— 已经到底了 —';
  if (kind === 'empty') return msg || '暂无数据';
  return '';
}
function resetFeed() {
  const f = state.feed;
  f.pg = 0; f.pages = 1; f.loading = false; f.done = false; f.token++;
  const feed = $('#feed');
  feed._items = [];
  feed.innerHTML = skeletonHTML(12);
  $('#feedStatus').innerHTML = '';
  loadFeedPage();
}
async function loadFeedPage() {
  const f = state.feed;
  if (f.loading || f.done) return;
  f.loading = true;
  const token = f.token, src = state.src, cat = state.cat, pg = f.pg + 1;
  const feed = $('#feed');
  let pendingNext = false, okLoad = false;
  if (pg > 1) $('#feedStatus').innerHTML = statusHTML('loading');
  try {
    const params = { ac: 'videolist', pg, pagesize: 24 };
    if (cat) params.t = cat;
    const j = await fetchJson(apiUrl(src, params));
    if (token !== f.token) return;
    /* 分类表必须是当前源的（切源瞬间可能还是上一个源的），没就绪先等它加载完再过滤 */
    if (state.catsSrc !== src) { await loadCats(); if (token !== f.token) return; }
    let list = (Array.isArray(j.list) ? j.list : []).filter(v => hasM3u8(v) && !isAdultItem(v) && isMovieOrTv(v));
    f.pg = pg;
    f.pages = +j.pagecount || pg;
    if (pg === 1) { feed.innerHTML = ''; feed._items = []; }
    /* 源站分页会重叠（更新流实时变动），按 vod_id 去重，避免同一部片出现两次 */
    const seenF = new Set((feed._items || []).map(x => String(x.vod_id)));
    list = list.filter(v => v.vod_id == null || !seenF.has(String(v.vod_id)));
    feed._items = (feed._items || []).concat(list);
    feed.insertAdjacentHTML('beforeend', list.map(itemHTML).join(''));
    bindCards(feed);
    if (!feed._items.length && pg >= f.pages) { $('#feedStatus').innerHTML = statusHTML('empty', '暂无电影或电视剧内容'); f.done = true; }
    else if (pg >= f.pages) { $('#feedStatus').innerHTML = statusHTML('end'); f.done = true; }
    else if (!list.length) { pendingNext = true; $('#feedStatus').innerHTML = statusHTML('loading'); }
    else $('#feedStatus').innerHTML = '';
    okLoad = true;
  } catch (e) {
    if (token !== f.token) return;
    if (pg === 1) feed.innerHTML = '';
    $('#feedStatus').innerHTML = statusHTML('error');
  } finally { f.loading = false; }
  if (pendingNext && token === f.token && !f.done) loadFeedPage();
  else if (okLoad && token === f.token && !f.done) fillIfNeeded();
}
/* 过滤后一页可能只剩几张卡片、页面高度没变，哨兵不会再次触发观察器——主动检查：哨兵还在视口附近就继续拉下一页 */
function fillIfNeeded() {
  const el = $('#feedSentinel');
  if (!el || typeof el.getBoundingClientRect !== 'function') return;
  const r = el.getBoundingClientRect();
  if (r.top < (window.innerHeight || 800) + 600) {
    if (state.mode === 'search') loadSearchPage();
    else loadFeedPage();
  }
}
window.__retryFeed = () => { $('#feedStatus').innerHTML = ''; state.feed.done = false; loadFeedPage(); };
async function switchSource(i) {
  if (state.mode === 'search') exitSearchUI();
  if (i === state.src && state.cats.length) { if (state.mode !== 'feed') { state.mode = 'feed'; resetFeed(); } return; }
  state.src = i; state.cat = 0; state.cats = [];
  state.catMap = new Map(); state.catsHasPid = false; state.catsSrc = -1; state.blockedIds = new Set();
  state.mode = 'feed';
  renderChips();
  resetFeed();
  await loadCats();
}
/* ---------- 源测速：最快的排第一，并自动切到最快的源 ---------- */
function updateOrder() {
  const idx = SOURCES.map((_, i) => i);
  const done = idx.filter(i => state.speeds[i] > 0).sort((a, b) => state.speeds[a] - state.speeds[b]);
  const pending = idx.filter(i => state.speeds[i] == null);
  const bad = idx.filter(i => state.speeds[i] === -1);
  state.order = [...done, ...pending, ...bad];
  renderChips();
}
async function speedTest() {
  await Promise.allSettled(SOURCES.map(async (_, i) => {
    const t0 = performance.now();
    try {
      await fetchJson(apiUrl(i, { ac: 'list', pg: 1 }), { fresh: true });
      state.speeds[i] = Math.max(1, Math.round(performance.now() - t0));
    } catch (e) { state.speeds[i] = -1; }
    updateOrder();
  }));
  updateOrder();
  const best = state.order.find(i => state.speeds[i] > 0);
  if (best != null && !state.userPicked && state.mode === 'feed' && best !== state.src) {
    switchSource(best);
  }
}

<script>
'use strict';

function searchStatusHTML(kind) {

window.__retrySearch = () => { state.search.done = false; loadSearchPage(); };

/* ---------- 播放弹窗 ---------- */
function openPlayer(item) {

const EP_PAGE = 30;   // 选集每 30 集一段：（1-30）（31-60）…
/* 分段表：末段只剩 ≤5 集时并入上一段，避免出现 (31-31) 这种孤零零的分组；能一段装下就不分段 */
function epRanges(total) {

  for (let s = 0; s < total; s += EP_PAGE) rs.push([s, Math.min(total, s + EP_PAGE) - 1]);
  if (rs.length > 1 && rs[rs.length - 1][1] - rs[rs.length - 1][0] + 1 <= 5) {

    rs[rs.length - 1][1] = last[1];

}
function renderModalInfo() {

  const pic = https(item.vod_pic);
  const meta = [
    item.vod_year, item.vod_area, item.type_name, item.vod_lang,
    item.vod_remarks, item.vod_time ? '更新 ' + fmtDate(item.vod_time) : '',
  ].filter(Boolean).join(' · ');
  const people = [
    item.vod_actor ? '主演：' + item.vod_actor : '',
    item.vod_director ? '导演：' + item.vod_director : '',
  ].filter(Boolean).join('　');
  const desc = stripHtml(item.vod_content || item.vod_blurb || '');
  const eps = groups[gi].episodes;
  const ranges = epRanges(eps.length);
  const curRange = Math.min(m.range || 0, ranges.length - 1);
  m.range = curRange;
  const start = ranges[curRange][0];
  const pageEps = eps.slice(start, ranges[curRange][1] + 1);
  $('#pmInfo').innerHTML = `
    ${groups.length > 1 ? `<div class="pm-sec" style="margin-top:4px">播放源</div>
    <div class="src-tabs">${groups.map((g, i) => `<button data-gi="${i}" class="${i === gi ? 'on' : ''}">${esc(g.from)}（${g.episodes.length}集）</button>`).join('')}</div>` : ''}
    <div class="pm-sec" ${groups.length > 1 ? '' : 'style="margin-top:4px"'}>${esc(item.vod_name || '')}</div>
    ${ranges.length > 1 ? `<div class="ep-ranges">${ranges.map((r, i) =>
      `<button data-range="${i}" class="${i === curRange ? 'on' : ''}">${r[0] + 1}-${r[1] + 1}</button>`).join('')}</div>` : ''}
    <div class="eps-box"><div class="eps-wrap"><div class="eps">${pageEps.map((e, k) => {
      const i = start + k;
      return `<button data-ep="${i}" class="${i === m.ep ? 'on' : ''}">${esc(e.name)}</button>`;
    }).join('')}</div></div><div class="eps-fade"></div></div>
    <div class="pm-head" style="margin-top:26px">
      ${pic ? `<img class="pm-cover" referrerpolicy="no-referrer" src="${esc(pic)}" alt="" onerror="this.remove()">` : ''}
      <div class="pm-side" id="pmSide">
        <div class="pm-side-in">
          <div class="pm-title">${esc(item.vod_name || '')}</div>
          <div class="pm-meta">${esc(meta)}${people ? '<br>' + esc(people) : ''}</div>
        </div>
        <button class="pm-more" id="pmMore" type="button">详情</button>
      </div>
    </div>
    ${desc ? `<div class="pm-sec">简介</div><p class="pm-desc">${esc(desc)}</p>` : ''}`;
  $('#pmInfo').querySelectorAll('.src-tabs button').forEach(b =>
    b.addEventListener('click', () => { state.modal.gi = +b.dataset.gi; state.modal.range = 0; renderModalInfo(); playEpisode(state.modal.gi, 0); }));
  $('#pmInfo').querySelectorAll('.ep-ranges button').forEach(b =>
    b.addEventListener('click', () => { state.modal.range = +b.dataset.range; renderModalInfo(); }));
  $('#pmInfo').querySelectorAll('.eps button').forEach(b =>
    b.addEventListener('click', () => playEpisode(state.modal.gi, +b.dataset.ep)));
  /* 封面旁详情溢出才显示「详情」；点它打开气泡（fixed 浮层挂 body，不撑页面、不被滚动区裁剪） */
  const side = $('#pmSide'), sideIn = side && side.querySelector('.pm-side-in');
  if (side && sideIn && sideIn.scrollHeight > side.clientHeight + 2) side.classList.add('has-more');
  const moreBtn = $('#pmMore');
  const oldTip = document.getElementById('pmTip'); if (oldTip) oldTip.remove();
  const tipRows = [
    ['地区', item.vod_area], ['年代', item.vod_year], ['类型', item.type_name],
    ['状态', item.vod_remarks], ['更新', String(item.vod_time || '').slice(0, 10)],
    ['导演', item.vod_director], ['主演', item.vod_actor],
  ].filter(r => r[1]);
  if (moreBtn && tipRows.length) {
    const tip = document.createElement('div');
    tip.className = 'pm-tip'; tip.id = 'pmTip';
    tip.innerHTML = '<button class="tip-x" type="button" aria-label="关闭">×</button>' +
      tipRows.map(r => `<div><b>${r[0]}：</b>${esc(r[1])}</div>`).join('');
    document.body.appendChild(tip);
    /* 智能定位（按整个视口算）：下方放得下就开在下方；下方不够且上方更宽敞就开在上方；都不够则限高内滚 */
    const placeTip = () => {
      const head = tip.closest('.pm-head') || document.querySelector('.pm-head');
      if (!head) return;
      const hr = head.getBoundingClientRect(), vh = window.innerHeight || 0;
      tip.style.left = hr.left + 'px'; tip.style.right = 'auto'; tip.style.width = hr.width + 'px';
      tip.style.top = ''; tip.style.bottom = ''; tip.style.maxHeight = '';
      const below = vh - hr.bottom - 12, above = hr.top - 12, h = tip.offsetHeight;
      if (h <= below) tip.style.top = (hr.bottom + 10) + 'px';
      else if (above > below) { tip.style.bottom = (vh - hr.top + 10) + 'px'; tip.style.maxHeight = Math.max(140, above) + 'px'; }
      else { tip.style.top = (hr.bottom + 10) + 'px'; tip.style.maxHeight = Math.max(140, below) + 'px'; }
    };
    const setTip = v => { if (v) placeTip(); tip.classList.toggle('open', v); };
    moreBtn.addEventListener('click', e => { e.stopPropagation(); setTip(!tip.classList.contains('open')); });
    const tx = tip.querySelector('.tip-x');
    if (tx) tx.addEventListener('click', () => setTip(false));
  }
  /* 选集区底部渐隐：还有更多集数没滚到底时显示 */
  const wrap = $('#pmInfo .eps-wrap');
  if (wrap) {
    const updFade = () => wrap.parentElement.classList.toggle('has-more',
      wrap.scrollHeight - wrap.scrollTop - wrap.clientHeight > 8);
    wrap.addEventListener('scroll', updFade, { passive: true });
    requestAnimationFrame(updFade);
  }
}
function playEpisode(gi, ei) {
  const m = state.modal;
  const ep = m.groups[gi] && m.groups[gi].episodes[ei];
  if (!ep) return;
  m.gi = gi; m.ep = ei;
  m.curUrl = ep.url; m.stage = 0;
  m.watch = (m.watch || 0) + 1;
  document.querySelectorAll('#pmInfo .eps button').forEach(b => b.classList.toggle('on', +b.dataset.ep === ei));
  const el = $('#hlsEl');
  /* 静音自动播放（浏览器必放行）；用户点任意处取消静音后，本次观看内不再静音 */
  try { el.muted = !m.unmuted; } catch (e) { /* 忽略 */ }
  $('#muteHint').classList.toggle('show', !m.unmuted);
  try { el.setAttribute('src', ep.url); } catch (e) { /* 播放器组件未就绪时忽略 */ }
  tryPlayEl(el);
  armAutoplay(m);
  document.querySelector('.pm-body').scrollTop = 0;
  armWatchdog(m);
  armStallWatch(m);
}
/* 卡顿自愈：界面显示在播、但时间一直停在 00:00 时，先补播+轻推播放头，还不行就重载当前地址（等同手动重试） */
function armStallWatch(m) {
  const w = m.watch;
  let ticks = 0, nudged = false, reloaded = false;
  const iv = setInterval(() => {
    if (state.modal !== m || m.watch !== w) { clearInterval(iv); return; }
    const el = $('#hlsEl');
    if (!el) { clearInterval(iv); return; }
    const ct = typeof el.currentTime === 'number' ? el.currentTime : 0;
    if (ct > 0.05) { clearInterval(iv); return; }
    if (++ticks < 2) return;                    // 先给约 2.4 秒缓冲
    if (!nudged) {                              // 第一次卡住：补一次播放，并把播放头轻推 0.05 秒
      nudged = true;
      tryPlayEl(el);
      try { el.currentTime = 0.05; } catch (e) { /* 忽略 */ }
      return;
    }
    if (!reloaded) {                            // 还卡着：重设当前级地址，强制重新拉流
      reloaded = true;
      if (m.stage < 2) {
        try { el.setAttribute('src', m.stage === 1 ? viaProxy(m.curUrl) : m.curUrl); } catch (e) { /* 忽略 */ }
      }
      tryPlayEl(el);
      armAutoplay(m);
      return;
    }
    clearInterval(iv);                          // 再不行交给 9 秒看门狗走兜底链
  }, 1200);
}
/* 自动播放：立即尝试一次；播放器组件/媒体未就绪时，等可播事件再补一次 */
function tryPlayEl(el) {
  try {
    if (el && typeof el.play === 'function') {
      const p = el.play();
      if (p && p.catch) p.catch(() => {});
    }
  } catch (e) { /* 忽略 */ }
}
function armAutoplay(m) {
  const w = m.watch;
  const el = $('#hlsEl');
  if (!el || typeof el.addEventListener !== 'function') return;
  const onReady = () => {
    if (state.modal !== m || m.watch !== w) return;
    const el2 = $('#hlsEl');
    if (el2 && el2.paused !== false) tryPlayEl(el2);
  };
  el.addEventListener('loadedmetadata', onReady, { once: true });
  el.addEventListener('canplay', onReady, { once: true });
}
/* 看门狗：9 秒后仍无任何播放进度，自动进入下一级播放兜底 */
function armWatchdog(m) {
  const w = m.watch;
  setTimeout(() => {
    if (state.modal !== m || m.watch !== w) return;
    const el2 = $('#hlsEl');
    const rs = typeof el2.readyState === 'number' ? el2.readyState : 4;
    const ct = typeof el2.currentTime === 'number' ? el2.currentTime : 1;
    if (rs < 2 && ct === 0) fallbackPlay();
  }, 9000);
}
/* 播放兜底链：第 1 级把播放地址改走自建中转（中转会改写列表与分片），第 2 级本地 blob 列表 */
async function fallbackPlay() {
  const m = state.modal;
  if (!m || !m.item || !m.curUrl || m.stage >= 2) return;
  m.stage++;
  m.watch++;
  const el = $('#hlsEl');
  if (m.stage === 1) {
    toast('直连播放失败，正在尝试中转播放…');
    try { el.setAttribute('src', viaProxy(m.curUrl)); } catch (e) { /* 忽略，继续下一级 */ }
    tryPlayEl(el);
    armAutoplay(m);
    armWatchdog(m);
    armStallWatch(m);
    return;
  }
  try {
    const bu = await proxiedPlaylistUrl(m.curUrl);
    if (state.modal !== m) return;
    el.setAttribute('src', bu);
    tryPlayEl(el);
    armAutoplay(m);
    armStallWatch(m);
  } catch (e) { toast('中转播放也失败了，换个源或集数试试'); }
}
function closePlayer() {
  const tipEl = document.getElementById('pmTip'); if (tipEl) tipEl.remove();
  const el = $('#hlsEl');
  try {
    if (typeof el.pause === 'function') el.pause();
    el.removeAttribute('src');
    if (typeof el.load === 'function') el.load();
  } catch (e) {}
  $('#playerModal').classList.remove('open');
  $('#playerModal').setAttribute('aria-hidden', 'true');
  document.body.classList.remove('locked');
  $('#muteHint').classList.remove('show');
  state.modal = { item: null, groups: [], gi: 0, ep: -1 };
}

/* ---------- 明暗切换（以按钮为中心波浪扩散） ---------- */
function syncThemeMeta() {
  const dark = document.documentElement.dataset.theme === 'dark';
  const mc = document.querySelector('meta[name="theme-color"]');
  if (mc) mc.setAttribute('content', dark ? '#000000' : '#F5F5F7');
}
function toggleTheme() {
  const root = document.documentElement;
  const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
  const apply = () => {
    root.dataset.theme = next;
    try { localStorage.setItem('fv_theme', next); } catch (e) { /* 忽略 */ }
    syncThemeMeta();
  };
  const btn = $('#themeBtn');
  if (document.startViewTransition && btn && btn.getBoundingClientRect) {
    const r = btn.getBoundingClientRect();
    const x = r.left + r.width / 2, y = r.top + r.height / 2;
    const rad = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
    root.style.setProperty('--rx', x + 'px');
    root.style.setProperty('--ry', y + 'px');
    root.style.setProperty('--rr', rad + 'px');
    document.startViewTransition(apply);
  } else apply();
}

/* ---------- 初始化 ---------- */
function init() {
  document.querySelector('.topbar h1').addEventListener('click', () => location.reload());
  $('#themeBtn').addEventListener('click', toggleTheme);
  syncThemeMeta();
  /* 点详情气泡与「详情」按钮之外任意处关闭气泡；弹窗内容滚动时也关闭（fixed 气泡不跟随滚动） */
  document.addEventListener('pointerdown', e => {
    const tip = $('#pmTip');
    if (tip && tip.classList.contains('open') && !(e.target.closest && (e.target.closest('#pmTip') || e.target.closest('#pmMore')))) tip.classList.remove('open');
  });
  const pmBody = document.querySelector('.pm-body');
  if (pmBody) pmBody.addEventListener('scroll', () => {
    const tip = $('#pmTip');
    if (tip && tip.classList.contains('open')) tip.classList.remove('open');
  }, { passive: true });
  /* 静音自动播放：点任意处取消静音（捕获阶段，先于开弹窗的那次点击不会误触——提示在开播后才出现） */
  document.addEventListener('pointerdown', () => {
    const hint = $('#muteHint');
    if (!hint || !hint.classList.contains('show')) return;
    const el = $('#hlsEl');
    try { el.muted = false; el.volume = 1; } catch (e) { /* 忽略 */ }
    if (state.modal) state.modal.unmuted = true;
    hint.classList.remove('show');
  }, true);
  applyView();
  $('#vtCard').addEventListener('click', () => setView('card'));
  $('#vtList').addEventListener('click', () => setView('list'));
  renderChips();
  resetFeed();
  loadCats();

  const feedObs = new IntersectionObserver(en => {
    if (!en[0].isIntersecting) return;
    if (state.mode === 'search') loadSearchPage();
    else loadFeedPage();
  }, { rootMargin: '600px' });
  feedObs.observe($('#feedSentinel'));

  $('#searchForm').addEventListener('submit', e => { e.preventDefault(); runSearch(); $('#searchInput').blur(); });
  $('#clearSearch').addEventListener('click', clearSearch);
  renderSearchChips();
  $('#pmClose').addEventListener('click', closePlayer);
  $('#hlsEl').addEventListener('error', () => { setTimeout(fallbackPlay, 800); });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if ($('#playerModal').classList.contains('open')) closePlayer();
    else if (state.mode === 'search') clearSearch();
  });
  speedTest();
}
document.addEventListener('DOMContentLoaded', init);
</script>
