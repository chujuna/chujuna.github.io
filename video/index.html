<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F7">
<title>影视 · 肥鱼小站</title>
<!-- Video.js 10（官方 CDN 片段，HLS 走 hls.js 引擎） -->
<script type="module" src="https://cdn.jsdelivr.net/npm/@videojs/cdn@10.5.0/video.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/@videojs/cdn@10.5.0/media/hlsjs-video.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #F5F5F7; --card: #FFFFFF; --text: #1D1D1F; --sub: #86868B;
    --line: rgba(0,0,0,.07); --accent: #1D1D1F; --red: #FA243C;
    --radius: 14px;
  }
  html { background: var(--bg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased;
    padding-bottom: 110px;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  img { display: block; }

  /* ===== 顶栏 ===== */
  .topbar {
    position: sticky; top: 0; z-index: 40;
    backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
    background: rgba(245,245,247,.78);
    border-bottom: 1px solid var(--line);
  }
  .topbar-in {
    max-width: 1080px; margin: 0 auto; height: 56px; padding: 0 20px;
    display: flex; align-items: center; gap: 12px;
  }
  .topbar h1 { font-size: 20px; font-weight: 700; letter-spacing: .5px; }
  .topbar .spacer { flex: 1; }
  .view-toggle { display: flex; background: rgba(0,0,0,.05); border-radius: 9px; padding: 2px; }
  .view-toggle button {
    width: 34px; height: 26px; border-radius: 7px; display: grid; place-items: center; color: var(--sub);
  }
  .view-toggle button.on { background: #fff; color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .view-toggle svg { width: 16px; height: 16px; }

  /* ===== 布局 ===== */
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
  .chips {
    display: flex; gap: 8px; overflow-x: auto; padding: 16px 0 4px;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; padding: 7px 15px; border-radius: 999px; font-size: 14px;
    background: #fff; color: var(--text); border: 1px solid var(--line);
    transition: all .18s;
  }
  .chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .chips.cats { padding-top: 8px; }
  .chips.cats .chip { background: transparent; border-color: transparent; color: var(--sub); padding: 6px 12px; }
  .chips.cats .chip.on { background: rgba(0,0,0,.06); color: var(--text); border-color: transparent; font-weight: 600; }

  /* ===== 卡片网格 ===== */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px 14px; padding-top: 18px; }
  @media (min-width: 700px) { .grid { grid-template-columns: repeat(5, 1fr); gap: 28px 18px; } }
  @media (min-width: 1024px) { .grid { grid-template-columns: repeat(6, 1fr); } }
  .vcard { cursor: pointer; }
  .poster {
    position: relative; aspect-ratio: 3/4; border-radius: var(--radius); overflow: hidden;
    background: linear-gradient(150deg, #E8E8ED, #D9D9E0);
  }
  .poster img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .45s; }
  .poster img.ld { opacity: 1; }
  .poster .ph {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: #A1A1A6; font-size: 13px; padding: 10px; text-align: center;
  }
  .badge {
    position: absolute; left: 8px; bottom: 8px; max-width: calc(100% - 16px);
    background: rgba(0,0,0,.62); color: #fff; font-size: 11px; line-height: 1;
    padding: 5px 8px; border-radius: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .vcard .nm { margin-top: 9px; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vcard .mt { margin-top: 3px; font-size: 12px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ===== 列表视图 ===== */
  .grid.as-list { grid-template-columns: 1fr; gap: 0; padding-top: 8px; }
  .grid.as-list .vcard {
    display: flex; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: center;
  }
  .grid.as-list .poster { width: 52px; flex: none; aspect-ratio: 3/4; border-radius: 9px; }
  .grid.as-list .badge { display: none; }
  .grid.as-list .nm { margin-top: 0; font-size: 15px; }
  .grid.as-list .cell { min-width: 0; }

  /* ===== 状态区 ===== */
  .status { padding: 34px 0 10px; text-align: center; color: var(--sub); font-size: 14px; }
  .status .retry { color: #0066CC; margin-left: 8px; }
  .spinner {
    width: 30px; height: 30px; margin: 0 auto 12px; border-radius: 50%;
    border: 3px solid rgba(0,0,0,.1); border-top-color: #55555A;
    animation: rot .8s linear infinite;
  }
  @keyframes rot { to { transform: rotate(360deg); } }
  .skel { border-radius: var(--radius); background: linear-gradient(100deg, #ECECF0 40%, #F5F5F8 50%, #ECECF0 60%); background-size: 200% 100%; animation: shim 1.2s infinite; }
  @keyframes shim { to { background-position: -200% 0; } }

  /* ===== 悬浮搜索按钮 ===== */
  .fab {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 90;
    width: 58px; height: 58px; border-radius: 50%;
    background: rgba(255,255,255,.6);
    backdrop-filter: blur(22px) saturate(180%); -webkit-backdrop-filter: blur(22px) saturate(180%);
    border: 1px solid rgba(255,255,255,.7);
    box-shadow: 0 10px 34px rgba(0,0,0,.22), 0 2px 8px rgba(0,0,0,.12);
    display: grid; place-items: center; color: var(--text);
    transition: background .25s, color .25s, transform .15s;
  }
  .fab:active { transform: translateX(-50%) scale(.93); }
  .fab svg { width: 25px; height: 25px; transition: transform .3s; }
  .fab.closing { background: rgba(30,30,34,.72); color: #fff; border-color: rgba(255,255,255,.25); }
  .fab.closing svg { transform: rotate(90deg); }

  /* ===== 搜索遮罩 ===== */
  .overlay {
    position: fixed; inset: 0; z-index: 80;
    background: rgba(12,12,16,.55);
    backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%);
    opacity: 0; pointer-events: none; transition: opacity .3s;
    display: flex; flex-direction: column;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .search-panel {
    max-width: 1080px; width: 100%; margin: 0 auto; padding: 18px 20px 0;
    transform: translateY(-14px); transition: transform .3s;
    display: flex; flex-direction: column; min-height: 0; flex: 1;
  }
  .overlay.open .search-panel { transform: none; }
  .search-form { display: flex; gap: 10px; }
  .search-box {
    flex: 1; display: flex; align-items: center; gap: 9px;
    background: rgba(255,255,255,.96); border-radius: 14px; padding: 0 16px; height: 50px;
  }
  .search-box svg { width: 19px; height: 19px; color: #86868B; flex: none; }
  .search-box input {
    flex: 1; border: none; outline: none; font: inherit; font-size: 16px; background: transparent; color: var(--text);
    min-width: 0;
  }
  .search-go {
    height: 50px; padding: 0 22px; border-radius: 14px; background: #fff; color: var(--text);
    font-size: 15px; font-weight: 600;
  }
  .overlay .chips { padding-top: 14px; }
  .overlay .chip { background: rgba(255,255,255,.14); color: #fff; border-color: rgba(255,255,255,.18); }
  .overlay .chip.on { background: #fff; color: var(--text); border-color: #fff; }
  .results-head {
    display: flex; align-items: center; gap: 10px; padding: 14px 0 2px; color: rgba(255,255,255,.85);
    font-size: 13px;
  }
  .results-head .spacer { flex: 1; }
  .results-scroll { overflow-y: auto; flex: 1; min-height: 0; padding-bottom: 120px; -webkit-overflow-scrolling: touch; }
  .overlay .grid { padding-top: 12px; }
  .overlay .vcard .nm { color: #fff; }
  .overlay .vcard .mt { color: rgba(255,255,255,.55); }
  .overlay .grid.as-list .vcard { border-bottom-color: rgba(255,255,255,.12); }
  .overlay .status { color: rgba(255,255,255,.65); }
  .overlay .spinner { border-color: rgba(255,255,255,.2); border-top-color: #fff; }
  .overlay .skel { background: linear-gradient(100deg, rgba(255,255,255,.08) 40%, rgba(255,255,255,.16) 50%, rgba(255,255,255,.08) 60%); background-size: 200% 100%; }
  .hint { color: rgba(255,255,255,.5); font-size: 13px; text-align: center; padding: 40px 0; }

  /* ===== 播放弹窗 ===== */
  .modal {
    position: fixed; inset: 0; z-index: 100; background: #000;
    transform: translateY(100%); transition: transform .38s cubic-bezier(.32,.72,.28,1);
    display: flex; flex-direction: column;
  }
  .modal.open { transform: none; }
  .pm-player { background: #000; flex: none; }
  .pm-player video-player, .pm-player video-skin { display: block; width: 100%; }
  .pm-body { flex: 1; overflow-y: auto; background: #0B0B0F; color: #F5F5F7; -webkit-overflow-scrolling: touch; }
  .pm-in { max-width: 860px; margin: 0 auto; padding: 20px 20px 60px; }
  .pm-head { display: flex; gap: 16px; }
  .pm-cover { width: 92px; flex: none; aspect-ratio: 3/4; border-radius: 10px; object-fit: cover; background: #1C1C21; }
  .pm-title { font-size: 21px; font-weight: 700; line-height: 1.3; }
  .pm-meta { margin-top: 7px; font-size: 13px; color: rgba(235,235,245,.55); line-height: 1.7; }
  .pm-sec { margin-top: 24px; font-size: 15px; font-weight: 700; }
  .pm-desc { margin-top: 10px; font-size: 14px; line-height: 1.75; color: rgba(235,235,245,.75); }
  .src-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .src-tabs button {
    padding: 7px 15px; border-radius: 999px; font-size: 13px;
    background: rgba(255,255,255,.09); color: #F5F5F7;
  }
  .src-tabs button.on { background: #fff; color: #000; font-weight: 600; }
  .eps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; margin-top: 12px; }
  @media (min-width: 700px) { .eps { grid-template-columns: repeat(8, 1fr); } }
  .eps button {
    padding: 10px 4px; border-radius: 9px; background: rgba(255,255,255,.07); color: #F5F5F7;
    font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .eps button.on { background: var(--red); color: #fff; font-weight: 600; }
  .pm-close {
    position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 14px; z-index: 5;
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(40,40,46,.66); color: #fff; display: grid; place-items: center;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .pm-close svg { width: 16px; height: 16px; }
  .pm-loading { padding: 60px 0; text-align: center; color: rgba(235,235,245,.6); font-size: 14px; }
  .pm-loading .spinner { border-color: rgba(255,255,255,.18); border-top-color: #fff; }

  .toast {
    position: fixed; left: 50%; bottom: 100px; transform: translate(-50%, 16px); z-index: 120;
    background: rgba(20,20,24,.88); color: #fff; font-size: 13.5px; padding: 10px 18px; border-radius: 999px;
    opacity: 0; pointer-events: none; transition: all .3s; max-width: 86vw; text-align: center;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  body.locked { overflow: hidden; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <h1>影视</h1>
    <div class="spacer"></div>
    <div class="view-toggle" role="group" aria-label="展示方式">
      <button id="vtCard" aria-label="卡片展示"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg></button>
      <button id="vtList" aria-label="列表展示"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/></svg></button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="chips" id="sourceChips"></div>
  <div class="chips cats" id="catChips"></div>
  <main class="grid" id="feed"></main>
  <div class="status" id="feedStatus"></div>
  <div id="feedSentinel"></div>
</div>

<!-- 搜索遮罩 -->
<section class="overlay" id="searchOverlay" aria-hidden="true">
  <div class="search-panel">
    <form class="search-form" id="searchForm">
      <label class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.8-3.8"/></svg>
        <input id="searchInput" type="search" placeholder="搜索片名…" autocomplete="off" enterkeyhint="search">
      </label>
      <button class="search-go" type="submit">搜索</button>
    </form>
    <div class="chips" id="searchSourceChips"></div>
    <div class="results-head"><span id="searchMeta"></span><div class="spacer"></div><span id="searchCount"></span></div>
    <div class="results-scroll" id="searchScroll">
      <div class="grid" id="searchResults"></div>
      <div class="status" id="searchStatus"></div>
      <div id="searchSentinel"></div>
    </div>
  </div>
</section>

<!-- 悬浮搜索 / 关闭按钮 -->
<button class="fab" id="fab" aria-label="搜索">
  <svg id="fabIconSearch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.8-3.8"/></svg>
  <svg id="fabIconClose" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="display:none"><path d="M5 5l14 14M19 5L5 19"/></svg>
</button>

<!-- 播放弹窗 -->
<section class="modal" id="playerModal" aria-hidden="true">
  <button class="pm-close" id="pmClose" aria-label="关闭播放"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
  <div class="pm-player">
    <video-player>
      <video-skin style="display: block; width: 100%; aspect-ratio: 16 / 9; --media-controls-before-start: visible;">
        <hlsjs-video id="hlsEl" playsinline></hlsjs-video>
      </video-skin>
    </video-player>
  </div>
  <div class="pm-body"><div class="pm-in" id="pmInfo"></div></div>
</section>

<div class="toast" id="toast"></div>

<script>
'use strict';
/* ============================================================
   数据源配置（苹果CMS10 Provide 接口，JSON 版）
   新增 / 修改数据源只改这里：name 显示名，api 为 JSON 接口地址
   （标准站为 …/provide/vod/at/json/，特殊站写完整地址）
   ============================================================ */
const SOURCES = [
  { name: '新浪',     api: 'https://api.xinlangapi.com/xinlangapi.php/provide/vod/at/json/' },
  { name: '优优',     api: 'https://api.yyzy-tv.vip/inc/api_mac10.php' },
  { name: '西瓜',     api: 'https://caiji.xgzyapi.com/api.php/provide/vod/at/json/' },
  { name: '电影天堂', api: 'https://api.dyttcj.com/api.php/provide/vod/at/json/' },
  { name: '魔都',     api: 'https://www.mdzyapi.com/api.php/provide/vod/at/json/' },
];

const $ = s => document.querySelector(s);
const state = {
  src: 0,                 // 当前数据源下标
  cat: 0,                 // 当前分类 id，0=全部
  cats: [],               // 当前源的分类
  view: localStorage.getItem('fv_view') || 'card',
  feed:   { pg: 0, pages: 1, loading: false, done: false, token: 0 },
  search: { kw: '', pg: 0, pages: 1, loading: false, done: false, token: 0, src: 0 },
  modal:  { item: null, groups: [], gi: 0, ep: -1 },
};

/* ---------- 工具 ---------- */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function https(u) { return u ? String(u).replace(/^http:\/\//i, 'https://') : ''; }
function fmtDate(t) { const m = String(t || '').match(/\d{4}-\d{2}-\d{2}/); return m ? m[0] : ''; }
function stripHtml(s) {
  const d = document.createElement('div');
  d.innerHTML = String(s || '');
  return (d.textContent || '').replace(/\s+/g, ' ').trim();
}
let toastTimer = 0;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}
function apiUrl(srcIdx, params) {
  const api = SOURCES[srcIdx].api;
  const qs = Object.entries(params).map(([k, v]) => k + '=' + encodeURIComponent(v)).join('&');
  return api + (api.includes('?') ? '&' : '?') + qs;
}
async function fetchJson(url, ms = 14000) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms);
  try {
    const r = await fetch(url, { signal: ctl.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}

/* ---------- 播放地址解析（只提取 m3u8） ---------- */
function parsePlay(vod) {
  const froms = String(vod.vod_play_from || '').split('$$$');
  const urls  = String(vod.vod_play_url  || '').split('$$$');
  const groups = [];
  urls.forEach((g, i) => {
    const eps = [];
    String(g || '').split('#').forEach(part => {
      const p = part.trim();
      if (!p) return;
      const di = p.indexOf('$');
      const name = di >= 0 ? p.slice(0, di) : '';
      const url  = di >= 0 ? p.slice(di + 1) : p;
      if (/\.m3u8($|\?)/i.test(url)) eps.push({ name: name || ('第' + (eps.length + 1) + '集'), url });
    });
    if (eps.length) groups.push({ from: (froms[i] || '播放源').trim(), episodes: eps });
  });
  return groups;
}
const hasM3u8 = vod => parsePlay(vod).length > 0;

/* ---------- 卡片 / 列表渲染 ---------- */
function itemHTML(v) {
  const pic = https(v.vod_pic);
  const date = fmtDate(v.vod_time);
  const meta = [v.vod_year, v.vod_area, date].filter(Boolean).join(' · ');
  return `<article class="vcard" data-id="${v.vod_id}">
    <div class="poster">${pic ? `<img loading="lazy" referrerpolicy="no-referrer" src="${esc(pic)}" alt="" onload="this.classList.add('ld')" onerror="this.remove()">` : ''}
      <div class="ph">${esc(v.vod_name || '')}</div>
      ${v.vod_remarks ? `<span class="badge">${esc(v.vod_remarks)}</span>` : ''}
    </div>
    <div class="cell">
      <div class="nm">${esc(v.vod_name || '')}</div>
      <div class="mt">${esc(meta || v.type_name || '')}</div>
      ${state.view === 'list' ? `<div class="mt">${esc([v.type_name, v.vod_remarks].filter(Boolean).join(' · '))}</div>` : ''}
    </div>
  </article>`;
}
function skeletonHTML(n) {
  return Array.from({ length: n }, () => '<div><div class="skel" style="aspect-ratio:3/4"></div><div class="skel" style="height:13px;margin-top:9px;border-radius:4px"></div></div>').join('');
}
function applyView() {
  document.querySelectorAll('.grid').forEach(g => g.classList.toggle('as-list', state.view === 'list'));
  $('#vtCard').classList.toggle('on', state.view === 'card');
  $('#vtList').classList.toggle('on', state.view === 'list');
}
function setView(v) {
  state.view = v;
  localStorage.setItem('fv_view', v);
  applyView();
  // 列表视图多一行信息，重渲染已有结果
  document.querySelectorAll('.grid').forEach(g => {
    const items = g._items || [];
    g.innerHTML = items.map(itemHTML).join('');
    bindCards(g);
  });
}
function bindCards(container) {
  container.querySelectorAll('.vcard').forEach(el => {
    if (el._bound) return;
    el._bound = true;
    el.addEventListener('click', () => {
      const item = (container._items || []).find(x => String(x.vod_id) === el.dataset.id);
      if (item) openPlayer(item);
    });
  });
}

/* ---------- 分类与首页信息流 ---------- */
function renderChips() {
  $('#sourceChips').innerHTML = SOURCES.map((s, i) =>
    `<button class="chip ${i === state.src ? 'on' : ''}" data-src="${i}">${esc(s.name)}</button>`).join('');
  $('#sourceChips').querySelectorAll('.chip').forEach(c =>
    c.addEventListener('click', () => switchSource(+c.dataset.src)));
  const tops = state.cats.filter(c => !c.type_pid || +c.type_pid === 0);
  const list = [{ type_id: 0, type_name: '全部' }, ...tops];
  $('#catChips').innerHTML = list.map(c =>
    `<button class="chip ${+c.type_id === state.cat ? 'on' : ''}" data-cat="${c.type_id}">${esc(c.type_name)}</button>`).join('');
  $('#catChips').querySelectorAll('.chip').forEach(c =>
    c.addEventListener('click', () => { state.cat = +c.dataset.cat; renderChips(); resetFeed(); }));
}
async function loadCats() {
  try {
    const j = await fetchJson(apiUrl(state.src, { ac: 'list', pg: 1 }));
    state.cats = Array.isArray(j.class) ? j.class : [];
  } catch (e) { state.cats = []; }
  renderChips();
}
function statusHTML(kind, msg) {
  if (kind === 'loading') return '<div class="spinner"></div>加载中…';
  if (kind === 'error') return `加载失败，可能是该数据源暂时不可用或不允许跨域访问<button class="retry" onclick="window.__retryFeed&&window.__retryFeed()">重试</button>`;
  if (kind === 'end') return '— 已经到底了 —';
  if (kind === 'empty') return msg || '暂无数据';
  return '';
}
function resetFeed() {
  const f = state.feed;
  f.pg = 0; f.pages = 1; f.loading = false; f.done = false; f.token++;
  const feed = $('#feed');
  feed._items = [];
  feed.innerHTML = skeletonHTML(12);
  $('#feedStatus').innerHTML = '';
  loadFeedPage();
}
async function loadFeedPage() {
  const f = state.feed;
  if (f.loading || f.done) return;
  f.loading = true;
  const token = f.token, src = state.src, cat = state.cat, pg = f.pg + 1;
  const feed = $('#feed');
  if (pg > 1) $('#feedStatus').innerHTML = statusHTML('loading');
  try {
    const params = { ac: 'videolist', pg, pagesize: 24 };
    if (cat) params.t = cat;
    const j = await fetchJson(apiUrl(src, params));
    if (token !== f.token) return;
    const list = (Array.isArray(j.list) ? j.list : []).filter(hasM3u8);
    f.pg = pg;
    f.pages = +j.pagecount || pg;
    if (pg === 1) feed.innerHTML = '';
    feed._items = (feed._items || []).concat(list);
    feed.insertAdjacentHTML('beforeend', list.map(itemHTML).join(''));
    bindCards(feed);
    if (!feed._items.length) { $('#feedStatus').innerHTML = statusHTML('empty', '该分类下暂无带 m3u8 播放源的内容'); f.done = true; }
    else if (pg >= f.pages) { $('#feedStatus').innerHTML = statusHTML('end'); f.done = true; }
    else $('#feedStatus').innerHTML = '';
  } catch (e) {
    if (token !== f.token) return;
    if (pg === 1) feed.innerHTML = '';
    $('#feedStatus').innerHTML = statusHTML('error');
  } finally { f.loading = false; }
}
window.__retryFeed = () => { $('#feedStatus').innerHTML = ''; state.feed.done = false; loadFeedPage(); };
async function switchSource(i) {
  if (i === state.src && state.cats.length) return;
  state.src = i; state.cat = 0; state.cats = [];
  renderChips();
  resetFeed();
  await loadCats();
}
</script>

<script>
'use strict';
/* ---------- 搜索 ---------- */
function renderSearchChips() {
  $('#searchSourceChips').innerHTML = SOURCES.map((s, i) =>
    `<button type="button" class="chip ${i === state.search.src ? 'on' : ''}" data-ssrc="${i}">${esc(s.name)}</button>`).join('');
  $('#searchSourceChips').querySelectorAll('.chip').forEach(c =>
    c.addEventListener('click', () => {
      const i = +c.dataset.ssrc;
      if (i === state.search.src) return;
      state.search.src = i;
      renderSearchChips();
      if (state.search.kw) runSearch();   // 已有关键词时，切源即按新源重新搜索
    }));
}
function openSearch() {
  $('#searchOverlay').classList.add('open');
  $('#searchOverlay').setAttribute('aria-hidden', 'false');
  const fab = $('#fab');
  fab.classList.add('closing');
  fab.setAttribute('aria-label', '关闭搜索');
  $('#fabIconSearch').style.display = 'none';
  $('#fabIconClose').style.display = '';
  document.body.classList.add('locked');
  renderSearchChips();
  setTimeout(() => $('#searchInput').focus(), 320);
}
function closeSearch() {
  $('#searchOverlay').classList.remove('open');
  $('#searchOverlay').setAttribute('aria-hidden', 'true');
  const fab = $('#fab');
  fab.classList.remove('closing');
  fab.setAttribute('aria-label', '搜索');
  $('#fabIconSearch').style.display = '';
  $('#fabIconClose').style.display = 'none';
  document.body.classList.remove('locked');
}
function searchStatusHTML(kind) {
  if (kind === 'loading') return '<div class="spinner"></div>正在搜索…';
  if (kind === 'error') return `搜索失败，可能是该数据源暂时不可用<button class="retry" style="color:#7CC4FF" onclick="window.__retrySearch&&window.__retrySearch()">重试</button>`;
  if (kind === 'end') return '— 已经到底了 —';
  if (kind === 'empty') return '没有找到带 m3u8 播放源的结果，换个关键词或切换数据源试试';
  return '';
}
function runSearch() {
  const kw = $('#searchInput').value.trim();
  if (!kw) { toast('请输入片名'); return; }
  const s = state.search;
  s.kw = kw; s.pg = 0; s.pages = 1; s.loading = false; s.done = false; s.token++;
  const box = $('#searchResults');
  box._items = [];
  box.innerHTML = skeletonHTML(9);
  $('#searchMeta').textContent = `在「${SOURCES[s.src].name}」中搜索「${kw}」`;
  $('#searchCount').textContent = '';
  $('#searchStatus').innerHTML = '';
  $('#searchScroll').scrollTop = 0;
  loadSearchPage();
}
async function loadSearchPage() {
  const s = state.search;
  if (s.loading || s.done || !s.kw) return;
  s.loading = true;
  const token = s.token, src = s.src, pg = s.pg + 1;
  const box = $('#searchResults');
  if (pg > 1) $('#searchStatus').innerHTML = searchStatusHTML('loading');
  try {
    const j = await fetchJson(apiUrl(src, { ac: 'videolist', wd: s.kw, pg, pagesize: 24 }));
    if (token !== s.token) return;
    const list = (Array.isArray(j.list) ? j.list : []).filter(hasM3u8);
    s.pg = pg;
    s.pages = +j.pagecount || pg;
    if (pg === 1) box.innerHTML = '';
    box._items = (box._items || []).concat(list);
    box.insertAdjacentHTML('beforeend', list.map(itemHTML).join(''));
    bindCards(box);
    $('#searchCount').textContent = box._items.length ? `已加载 ${box._items.length} 条` : '';
    if (!box._items.length) { $('#searchStatus').innerHTML = searchStatusHTML('empty'); s.done = true; }
    else if (pg >= s.pages) { $('#searchStatus').innerHTML = searchStatusHTML('end'); s.done = true; }
    else $('#searchStatus').innerHTML = '';
  } catch (e) {
    if (token !== s.token) return;
    if (pg === 1) box.innerHTML = '';
    $('#searchStatus').innerHTML = searchStatusHTML('error');
  } finally { s.loading = false; }
}
window.__retrySearch = () => { state.search.done = false; loadSearchPage(); };

/* ---------- 播放弹窗 ---------- */
function openPlayer(item) {
  const groups = parsePlay(item);
  if (!groups.length) { toast('该片没有 m3u8 播放源'); return; }
  state.modal = { item, groups, gi: 0, ep: -1 };
  renderModalInfo();
  $('#playerModal').classList.add('open');
  $('#playerModal').setAttribute('aria-hidden', 'false');
  document.body.classList.add('locked');
  playEpisode(0, 0);
}
function renderModalInfo() {
  const { item, groups, gi } = state.modal;
  const pic = https(item.vod_pic);
  const meta = [
    item.vod_year, item.vod_area, item.type_name, item.vod_lang,
    item.vod_remarks, item.vod_time ? '更新 ' + fmtDate(item.vod_time) : '',
  ].filter(Boolean).join(' · ');
  const people = [
    item.vod_actor ? '主演：' + item.vod_actor : '',
    item.vod_director ? '导演：' + item.vod_director : '',
  ].filter(Boolean).join('　');
  const desc = stripHtml(item.vod_content || item.vod_blurb || '');
  $('#pmInfo').innerHTML = `
    <div class="pm-head">
      ${pic ? `<img class="pm-cover" referrerpolicy="no-referrer" src="${esc(pic)}" alt="" onerror="this.remove()">` : ''}
      <div style="min-width:0">
        <div class="pm-title">${esc(item.vod_name || '')}</div>
        <div class="pm-meta">${esc(meta)}${people ? '<br>' + esc(people) : ''}</div>
      </div>
    </div>
    ${groups.length > 1 ? `<div class="pm-sec">播放源</div>
    <div class="src-tabs">${groups.map((g, i) => `<button data-gi="${i}" class="${i === gi ? 'on' : ''}">${esc(g.from)}（${g.episodes.length}集）</button>`).join('')}</div>` : ''}
    <div class="pm-sec">选集 · ${esc(groups[gi].from)}</div>
    <div class="eps">${groups[gi].episodes.map((e, i) => `<button data-ep="${i}">${esc(e.name)}</button>`).join('')}</div>
    ${desc ? `<div class="pm-sec">简介</div><p class="pm-desc">${esc(desc)}</p>` : ''}`;
  $('#pmInfo').querySelectorAll('.src-tabs button').forEach(b =>
    b.addEventListener('click', () => { state.modal.gi = +b.dataset.gi; renderModalInfo(); playEpisode(state.modal.gi, 0); }));
  $('#pmInfo').querySelectorAll('.eps button').forEach(b =>
    b.addEventListener('click', () => playEpisode(state.modal.gi, +b.dataset.ep)));
}
function playEpisode(gi, ei) {
  const m = state.modal;
  const ep = m.groups[gi] && m.groups[gi].episodes[ei];
  if (!ep) return;
  m.gi = gi; m.ep = ei;
  document.querySelectorAll('#pmInfo .eps button').forEach((b, i) => b.classList.toggle('on', i === ei));
  const el = $('#hlsEl');
  try {
    el.setAttribute('src', ep.url);
    if (typeof el.play === 'function') {
      const p = el.play();
      if (p && p.catch) p.catch(() => {});
    }
  } catch (e) { /* 播放器组件未就绪时忽略，用户可点播放器自带按钮 */ }
  document.querySelector('.pm-body').scrollTop = 0;
}
function closePlayer() {
  const el = $('#hlsEl');
  try {
    if (typeof el.pause === 'function') el.pause();
    el.removeAttribute('src');
    if (typeof el.load === 'function') el.load();
  } catch (e) {}
  $('#playerModal').classList.remove('open');
  $('#playerModal').setAttribute('aria-hidden', 'true');
  document.body.classList.remove('locked');
  state.modal = { item: null, groups: [], gi: 0, ep: -1 };
}

/* ---------- 初始化 ---------- */
function init() {
  applyView();
  $('#vtCard').addEventListener('click', () => setView('card'));
  $('#vtList').addEventListener('click', () => setView('list'));
  renderChips();
  resetFeed();
  loadCats();

  const feedObs = new IntersectionObserver(en => {
    if (en[0].isIntersecting) loadFeedPage();
  }, { rootMargin: '600px' });
  feedObs.observe($('#feedSentinel'));

  const searchObs = new IntersectionObserver(en => {
    if (en[0].isIntersecting) loadSearchPage();
  }, { root: $('#searchScroll'), rootMargin: '400px' });
  searchObs.observe($('#searchSentinel'));

  $('#fab').addEventListener('click', () => {
    $('#searchOverlay').classList.contains('open') ? closeSearch() : openSearch();
  });
  $('#searchForm').addEventListener('submit', e => { e.preventDefault(); runSearch(); });
  renderSearchChips();
  $('#pmClose').addEventListener('click', closePlayer);
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if ($('#playerModal').classList.contains('open')) closePlayer();
    else if ($('#searchOverlay').classList.contains('open')) closeSearch();
  });
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
