    CODESEL.clear(); toast('已清空'); renderAdminCodes();
  });
  tools.append(gen, imp, exp, delSel, clearAll); card.appendChild(tools);
  const chips = h('div','chips');
  [['all','全部'],['unused','未使用'],['used','已使用'],['void','已作废']].forEach(([v,t])=>{
    const c = h('button','chip'+(CODEF===v?' on':''), t);
    c.onclick=()=>{ CODEF=v; renderAdminCodes(); };
    chips.appendChild(c);
  });
  card.appendChild(chips);
  const listBox = h('div'); listBox.style.marginTop='8px'; card.appendChild(listBox);
  wrap.appendChild(card); wrap.appendChild(copyrightEl());
  let q = sb.from('auth_codes').select('*').order('created_at',{ascending:false}).limit(500);
  if(CODEF!=='all') q = q.eq('status', CODEF);
  const { data, error } = await q;
  if(error){ listBox.appendChild(h('div','empty-note', errText(error))); return; }
  if(!data || !data.length) listBox.appendChild(h('div','empty-note','没有授权码'));
  (data||[]).forEach(c=>{
    const r = h('div','row-line');
    const chk = h('input'); chk.type='checkbox'; chk.checked = CODESEL.has(c.id);
    chk.onchange=()=>{ chk.checked ? CODESEL.add(c.id) : CODESEL.delete(c.id); };
    const g = h('div','grow');
    const stText = c.status==='used' ? '已使用' : c.status==='void' ? '已作废' : '未使用';
    const sub = c.status==='used' ? ('使用者 ID '+(c.used_by_user_no==null?'':c.used_by_user_no)+' · '+fmtDate(c.used_at)) : ('生成于 '+fmtDate(c.created_at));
    g.append(h('div','t1', c.code), h('div','t2', stText+' · '+sub));
    const cp = h('button','pill-btn gray','复制');
    cp.onclick=()=>{ if(navigator.clipboard) navigator.clipboard.writeText(c.code).then(()=>toast('已复制')); };
    r.append(chk, g, cp); listBox.appendChild(r);
  });
  CODESEL.forEach(id=>{ if(!(data||[]).some(c=>c.id===id)) CODESEL.delete(id); });
}
function openGenCodes(){
  const card = h('div','confirm-card');
  card.appendChild(h('h3',null,'批量生成授权码'));
  const opts = h('div','gift-opts'); let count = 10;
  [5,10,50,100].forEach(v=>{
    const b = h('button','gift-opt'+(v===10?' on':''), String(v));
    b.onclick=()=>{ count=v; custom.value=''; opts.querySelectorAll('.gift-opt').forEach(x=>x.classList.remove('on')); b.classList.add('on'); };
    opts.appendChild(b);
  });
  card.appendChild(opts);
  const f = h('div','field'); const custom = h('input'); custom.type='number'; custom.min='1'; custom.max='1000'; custom.placeholder='或输入自定义数量（最多 1000）';
  custom.oninput=()=>{ if(custom.value) opts.querySelectorAll('.gift-opt').forEach(x=>x.classList.remove('on')); };
  f.appendChild(custom); card.appendChild(f);
  const btns = h('div','confirm-btns');
  const ca = h('button',null,'取消'); ca.onclick=closeModal;
  const ok = h('button','primary','生成');
  ok.onclick = async ()=>{
    const n = custom.value ? Number(custom.value) : count;
    if(!n || n<1 || n>1000){ toast('数量要在 1–1000 之间'); return; }
    closeModal();
    const { error } = await sb.rpc('admin_gen_codes',{ p_count: Math.floor(n) });
    if(error){ toast(errText(error)); return; }
    toast('已生成 '+Math.floor(n)+' 条'); renderAdminCodes();
  };
  btns.append(ca, ok); card.appendChild(btns); openModal(card);
}
function openImportCodes(){
  const card = h('div','confirm-card');
  card.appendChild(h('h3',null,'批量导入授权码'));
  card.appendChild(h('p',null,'粘贴授权码，一行一条，重复的会自动跳过。'));
  const f = h('div','field'); f.style.marginTop='10px';
  const ta = h('textarea'); ta.rows=6; ta.placeholder='PP-XXXXXX-XXXXXX'; f.appendChild(ta); card.appendChild(f);
  const btns = h('div','confirm-btns');
  const ca = h('button',null,'取消'); ca.onclick=closeModal;
  const ok = h('button','primary','导入');
  ok.onclick = async ()=>{
    const codes = ta.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    if(!codes.length){ toast('先粘贴授权码'); return; }
    closeModal();
    const { data, error } = await sb.rpc('admin_import_codes',{ p_codes: codes });
    if(error){ toast(errText(error)); return; }
    toast('导入完成'+(data!=null ? '：'+JSON.stringify(data) : '')); renderAdminCodes();
  };
  btns.append(ca, ok); card.appendChild(btns); openModal(card);
}
async function exportCodes(){
  let rows;
  if(CODESEL.size){
    const { data } = await sb.from('auth_codes').select('code').in('id', [...CODESEL]);
    rows = data||[];
  } else {
    let q = sb.from('auth_codes').select('code').order('created_at',{ascending:false}).limit(2000);
    if(CODEF!=='all') q = q.eq('status', CODEF);
    const { data } = await q; rows = data||[];
  }
  if(!rows.length){ toast('没有可导出的授权码'); return; }
  const blob = new Blob([rows.map(r=>r.code).join('\n')], { type:'text/plain;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download='授权码.txt';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
/* ---------- 系统设置（5 张独立卡片） ---------- */
function setGroup(title, desc){
  const g = h('div','set-group');
  const head = h('div','set-group-head'); head.append(h('div','gt',title), h('div','gd',desc));
  const card = h('div','card'); g.append(head, card);
  return { g, card };
}
function setRow(card, label, control){
  const r = h('div','row-line');
  const l = h('span'); l.textContent=label; l.style.fontSize='14px';
  const box = h('span'); box.style.marginLeft='auto'; box.appendChild(control);
  r.append(l, box); card.appendChild(r); return r;
}
function numInput(val, w){ const i=h('input'); i.type='number'; i.value=val; i.style.cssText='width:'+(w||84)+'px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;text-align:right'; return i; }
function switchEl(checked){ const sw=h('label','switch'); const i=h('input'); i.type='checkbox'; i.checked=!!checked; const tr=h('span','tr'); sw.append(i,tr); return { sw, input:i }; }
async function renderAdminSettings(){
  S.view='admin'; showPage('admin');
  const wrap = $('pageWrap'); wrap.innerHTML='';
  wrap.appendChild(backLink('返回后台', renderAdminHome));
  await loadSettings(); const s = S.settings||{};
  const save = async (patch, msg)=>{
    const { error } = await sb.rpc('admin_save_settings',{ p: patch });
    if(error){ toast(errText(error)); return; }
    Object.assign(S.settings, patch); toast(msg||'已保存'); setWorldTarget();
  };
  const saveBtn = (fn)=>{ const b=h('button','big-btn','保存'); b.style.marginTop='10px'; b.onclick=fn; return b; };
  /* 1 积分规则 */
  { const { g, card } = setGroup('积分规则','签到与注册的积分奖励');
    const ci = numInput(setGet('checkin_points',2)); setRow(card,'签到奖励（积分/天）', ci);
    const ni = numInput(setGet('newbie_points',5)); setRow(card,'注册赠送（积分）', ni);
    const dl = numInput(setGet('daily_limit',20)); setRow(card,'每日发布上限（个）', dl);
    card.appendChild(saveBtn(()=>save({ checkin_points:Number(ci.value)||0, newbie_points:Number(ni.value)||0, daily_limit:Number(dl.value)||0 }, '积分规则已保存')));
    wrap.appendChild(g); }
  /* 2 世界与治理 */
  { const { g, card } = setGroup('世界与治理','世界泡泡数量与举报规则');
    const ww = numInput(setGet('world_count_wide',60)); setRow(card,'世界泡泡数量 · 宽屏', ww);
    const wn = numInput(setGet('world_count_narrow',30)); setRow(card,'世界泡泡数量 · 窄屏', wn);
    const th = numInput(setGet('report_hide_threshold',3)); setRow(card,'举报自动隐藏阈值（次）', th);
    const ad = numInput(setGet('archive_days',30)); setRow(card,'普通泡泡归档天数', ad);
    card.appendChild(saveBtn(()=>save({ world_count_wide:Number(ww.value)||60, world_count_narrow:Number(wn.value)||30, report_hide_threshold:Number(th.value)||3, archive_days:Number(ad.value)||30 }, '世界设置已保存')));
    wrap.appendChild(g); }
  /* 3 邮箱验证 + 发件账号 */
  { const { g, card } = setGroup('邮箱验证','注册邮箱验证与发件账号');
    const sw = switchEl(setGet('email_verify_required', true)); setRow(card,'开启邮箱验证', sw.sw);
    const group = h('div'); group.style.marginTop='6px';
    const mkField = (label, val, ph, type)=>{
      const f=h('div','field'); f.appendChild(h('label',null,label));
      const i=h('input'); i.type=type||'text'; i.value=val||''; i.placeholder=ph||''; f.appendChild(i); group.appendChild(f); return i;
    };
    const senderEmail = mkField('发件邮箱', s.sender_email, 'noreply@example.com','email');
    const senderName = mkField('发件人名称', s.sender_name, '泡泡世界');
    const smtpHost = mkField('SMTP 服务器', s.smtp_host, 'smtp.example.com');
    const smtpPort = mkField('SMTP 端口', s.smtp_port, '465','number');
    const secF = h('div','field'); secF.appendChild(h('label',null,'加密方式'));
    const smtpSecure = h('select'); [['ssl','SSL'],['starttls','STARTTLS'],['none','无']].forEach(([v,t])=>{ const o=h('option',null,t); o.value=v; if((s.smtp_secure||'ssl')===v) o.selected=true; smtpSecure.appendChild(o); });
    smtpSecure.onchange=()=>{ smtpPort.value = smtpSecure.value==='ssl' ? '465' : smtpSecure.value==='starttls' ? '587' : '25'; };
    secF.appendChild(smtpSecure); group.appendChild(secF);
    const smtpUser = mkField('登录账号', s.smtp_user, '发件邮箱账号');
    const smtpPass = mkField('密码 / 授权码', '', '保存后不回显；QQ/163/Gmail 填授权码','password');
    const sync = ()=>{ group.style.display = sw.input.checked ? '' : 'none'; };
    sw.input.onchange = sync; sync();
    card.append(group);
    const test = h('button','ghost-btn','发送测试邮件'); test.style.marginTop='4px';
    test.onclick=()=>{
      if(!senderEmail.value.trim() || !smtpHost.value.trim() || !smtpUser.value.trim()){ toast('先把发件邮箱、SMTP 服务器、登录账号填齐'); return; }
      toast('配置已记录；实际发信需在 Supabase 后台同步同一套 SMTP 后发送测试');
    };
    card.appendChild(test);
    card.appendChild(saveBtn(()=>{
      const patch = { email_verify_required: sw.input.checked, sender_email:senderEmail.value.trim(), sender_name:senderName.value.trim(), smtp_host:smtpHost.value.trim(), smtp_port:Number(smtpPort.value)||465, smtp_secure:smtpSecure.value, smtp_user:smtpUser.value.trim() };
      if(smtpPass.value) patch.smtp_pass = smtpPass.value;
      save(patch, '邮箱设置已保存（请去 Supabase 后台同步 SMTP）');
    }));
    wrap.appendChild(g); }
  /* 4 媒体存储 */
  { const { g, card } = setGroup('媒体存储','图片与音频上传');
    const sw = switchEl(setGet('media_upload_enabled', true)); setRow(card,'允许上传图片 / 音频', sw.sw);
    const ro = h('div','field'); ro.appendChild(h('label',null,'上传代理地址（只读）'));
    const i = h('input'); i.value = MEDIA_API; i.readOnly = true; ro.appendChild(i); card.appendChild(ro);
    card.appendChild(saveBtn(()=>save({ media_upload_enabled: sw.input.checked }, '媒体设置已保存')));
    wrap.appendChild(g); }
  /* 5 公告弹窗 */
  { const { g, card } = setGroup('公告弹窗','进入世界时首次弹出');
    const sw = switchEl(setGet('notice_enabled', false)); setRow(card,'开启公告', sw.sw);
    const tf = h('div','field'); tf.appendChild(h('label',null,'标题'));
    const ti = h('input'); ti.value = s.notice_title||''; tf.appendChild(ti); card.appendChild(tf);
    const bf = h('div','field'); bf.appendChild(h('label',null,'内容'));
    const bi = h('textarea'); bi.value = s.notice_body||''; bf.appendChild(bi); card.appendChild(bf);
    const iv = numInput(setGet('notice_interval_hours',24)); setRow(card,'重复弹出间隔（小时）', iv);
    const prev = h('button','ghost-btn','预览公告'); prev.style.marginTop='6px';
    prev.onclick=()=>showNotice({ title:ti.value, body:bi.value }, true);
    card.appendChild(prev);
    card.appendChild(saveBtn(()=>save({ notice_enabled: sw.input.checked, notice_title: ti.value, notice_body: bi.value, notice_interval_hours: Number(iv.value)||24, notice_version: (Number(s.notice_version)||0)+1 }, '公告已保存')));
    wrap.appendChild(g); }
  wrap.appendChild(copyrightEl());
}
</script>
<script>
/* ================= 顶栏与导航接线 ================= */
setIcon($('filterBtn'), 'filter');
$('refreshBtn').innerHTML = icon('wind','lg');
$('tabWorld').innerHTML = icon('globe') + '<span>世界</span>';
$('tabPub').innerHTML = icon('plus','lg');
$('tabMine').innerHTML = icon('user') + '<span>我的</span>';
$('tabWorld').onclick = ()=>{ showWorld(); };
$('tabMine').onclick = ()=>{ renderMine(); };
$('tabPub').onclick = openPublish;
$('refreshBtn').onclick = ()=>{ blipSounds(); swapBatch(); };
$('pointsCap').onclick = ()=>{ if(S.user) renderCheckin(); };
(function buildFilter(){
  const menu = $('filterMenu');
  [['all','全部'],['text','文字'],['image','图片'],['audio','音频'],['video','视频']].forEach(([f,t])=>{
    const b = h('button', f==='all'?'on':''); b.dataset.f=f;
    b.innerHTML = icon(f==='all'?'globe':TYPE_META[f].ico,'sm'); b.appendChild(document.createTextNode(t));
    b.onclick = e=>{ e.stopPropagation(); menu.hidden=true; applyFilter(f); };
    menu.appendChild(b);
  });
  $('filterBtn').onclick = e=>{ e.stopPropagation(); menu.hidden = !menu.hidden; };
  document.addEventListener('click', e=>{ if(!menu.hidden && !menu.contains(e.target)) menu.hidden=true; });
})();
/* 禁双击 / 捏合缩放 */
document.addEventListener('gesturestart', e=>e.preventDefault());
let lastTouchEnd = 0;
document.addEventListener('touchend', e=>{ const now=Date.now(); if(now-lastTouchEnd<=300) e.preventDefault(); lastTouchEnd=now; }, { passive:false });
document.addEventListener('wheel', e=>{ if(e.ctrlKey) e.preventDefault(); }, { passive:false });

/* ================= 公告（已看记录带内容签名） ================= */
function showNotice(n, isPreview){
  const card = h('div','notice-card');
  const ico = h('div','a-ico'); ico.innerHTML = icon('megaphone');
  card.append(ico, h('h3',null, n.title||'公告'), h('p',null, n.body||''));
  const btn = h('button','big-btn','知道了');
  btn.onclick = ()=>{
    closeModal();
    if(!isPreview){
      const sig = hashStr((n.title||'')+'|'+(n.body||''));
      try{ localStorage.setItem('paopao_notice_seen', JSON.stringify({ sig, at: Date.now() })); }catch(e){}
    }
  };
  card.appendChild(btn); openModal(card);
}
function maybeShowNotice(){
  const s = S.settings||{};
  if(!s.notice_enabled || !s.notice_body) return;
  const sig = hashStr((s.notice_title||'')+'|'+(s.notice_body||''));
  let seen = null;
  try{ seen = JSON.parse(localStorage.getItem('paopao_notice_seen')||'null'); }catch(e){}
  const intervalMs = (Number(s.notice_interval_hours)||24)*3600*1000;
  if(seen && seen.sig===sig && (Date.now()-seen.at) < intervalMs) return;
  showNotice({ title:s.notice_title, body:s.notice_body }, false);
}

/* ================= 开屏与启动 ================= */
(function bootBubbles(){
  const box = $('bootStage');
  const cols = ['#38BDF8','#34D399','#FB923C','#A78BFA','#F472B6'];
  for(let i=0;i<5;i++){
    const b = h('div','boot-bub'); const d = 22+Math.random()*30;
    b.style.cssText = 'width:'+d+'px;height:'+d+'px;left:'+(8+i*19+Math.random()*6)+'%;background:linear-gradient(135deg,'+cols[i]+','+cols[i]+'CC);animation-duration:'+(3.4+Math.random()*2.2)+'s;animation-delay:'+(i*0.45)+'s';
    box.appendChild(b);
  }
})();
let bootHidden = false;
function hideBoot(){
  if(bootHidden) return; bootHidden = true;
  const b = $('boot'); b.classList.add('gone');
  setTimeout(()=>{ b.remove(); maybeShowNotice(); }, 550);
}
setTimeout(hideBoot, 3200);
async function deepLink(){
  const id = new URLSearchParams(location.search).get('b');
  if(!id) return;
  const { data } = await sb.from('bubbles').select('*').eq('id', id).single();
  if(!data || data.deleted_at || data.status!=='visible'){ toast('这个泡泡已不可见'); return; }
  await authorsFor([data]);
  S.poolById.set(data.id, data);
  openExpand(data, 'link');
}
async function init(){
  setWorldTarget();
  const { data } = await sb.auth.getSession();
  S.user = data && data.session ? data.session.user : null;
  await loadSettings();
  setWorldTarget();
  await Promise.all([loadProfile(), loadMyMarks(), loadPool()]);
  showWorld();
  topUp();
  deepLink();
  sb.auth.onAuthStateChange(async (evt, session)=>{
    S.user = session ? session.user : null;
    if(evt==='SIGNED_IN'){ await Promise.all([loadProfile(), loadMyMarks()]); }
    if(evt==='SIGNED_OUT'){ S.profile=null; S.myReactions.clear(); S.myFavorites.clear(); updatePointsCap(); }
  });
  addEventListener('resize', ()=>{ setWorldTarget(); });
}
init().catch(e=>{ toast(errText(e)); hideBoot(); });
</script>
