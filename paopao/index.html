<!DOCTYPE html>
<html lang="zh-CN" class="booting">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>泡泡世界</title>
<style>
:root{
  --bg:#F5F5F7; --card:#FFFFFF; --card2:#FBFBFD;
  --ink:#1D1D1F; --ink2:#6E6E73; --ink3:#86868B;
  --line:rgba(0,0,0,.08); --line2:rgba(0,0,0,.05);
  --accent:#FA243C; --blue:#0071E3; --green:#248A3D; --orange:#B25000; --purple:#8944AB;
  --glass:rgba(255,255,255,.88); --glass-brd:rgba(255,255,255,.65);
  --capsule:rgba(28,28,30,.78); --capsule-ink:#F5F5F7;
  --shadow:0 8px 30px rgba(0,0,0,.08); --shadow-lg:0 24px 60px rgba(0,0,0,.18);
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --card:#1C1C1E; --card2:#242426;
    --ink:#F5F5F7; --ink2:#A1A1A6; --ink3:#6E6E73;
    --line:rgba(255,255,255,.12); --line2:rgba(255,255,255,.07);
    --glass:rgba(28,28,30,.88); --glass-brd:rgba(255,255,255,.14);
    --capsule:rgba(44,44,46,.80);
    --shadow:0 8px 30px rgba(0,0,0,.4); --shadow-lg:0 24px 60px rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation}
html,body{margin:0;padding:0}
/* 顶部留白：内容与顶部小胶囊之间的间隔，要和胶囊离屏幕上沿的距离一样大。
   胶囊上沿距屏幕 = 10px + 安全区，胶囊高约 46px，故内容起点 = 10+46+10 再加两份安全区；
   .wrap 自带 10px 上内边距，扣掉后正文 padding-top 取 56px + 两份安全区 */
body{font-family:var(--font); background:var(--bg); color:var(--ink); font-size:15px; line-height:1.55; padding-top:calc(56px + env(safe-area-inset-top) + env(safe-area-inset-top)); padding-bottom:168px}
/* 发布面板打开期间锁住页面本体滚动：否则从面板内容区下滑会链式滚到页面、右缘冒出滚动条 */
html.lock,body.lock{overflow:hidden}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
input,select,textarea{font-family:inherit; font-size:16px; color:var(--ink)}
a{color:var(--blue); text-decoration:none}
svg{display:block}

/* ---------- 顶部栏：品牌与积分小胶囊移到顶部，筛选图标按钮在积分右侧 ---------- */
.topbar{position:fixed; top:calc(10px + env(safe-area-inset-top)); left:0; right:0; z-index:70;
  display:flex; flex-direction:column; pointer-events:none; padding:0 14px}
.top-inner{width:100%; max-width:1080px; margin:0 auto; display:flex; flex-direction:column}
.top-row{display:flex; align-items:center; justify-content:space-between; gap:10px}
.top-row>*{pointer-events:auto}
.top-right{display:flex; align-items:center; gap:8px}
.brand{display:flex; align-items:center; gap:9px; min-height:44px; padding:6px 16px 6px 8px; border-radius:999px; text-align:left;
  background:var(--glass); backdrop-filter:blur(10px) saturate(160%); -webkit-backdrop-filter:blur(10px) saturate(160%);
  border:1px solid var(--glass-brd); box-shadow:var(--shadow)}
.brand-mark{width:34px; height:34px; border-radius:50%; flex:none;
  background:radial-gradient(circle at 32% 30%, rgba(255,255,255,.95), rgba(255,255,255,.25) 42%, transparent 60%),
  linear-gradient(135deg,#7DD3FC,#C4B5FD 55%,#F9A8D4);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.7), 0 4px 12px rgba(140,120,255,.35)}
.brand h1{font-size:16px; font-weight:700; letter-spacing:.02em; margin:0}
.brand small{display:block; font-size:11px; color:var(--ink3); font-weight:500; letter-spacing:.14em}
.points-pill{display:flex; align-items:center; gap:7px; background:var(--card); border:1px solid var(--line);
  border-radius:999px; padding:7px 14px 7px 10px; font-weight:700; font-size:15px; box-shadow:0 2px 10px rgba(0,0,0,.05); min-height:38px}
.points-pill .dot{width:20px; height:20px; border-radius:50%; background:linear-gradient(135deg,#FFD60A,#FF9F0A); display:grid; place-items:center; font-size:11px; color:#fff; font-weight:800}
.points-pill small{font-weight:500; color:var(--ink2); font-size:12px}

/* ---------- 通用 ---------- */
.wrap{max-width:1080px; margin:0 auto; padding:10px 20px 0}
.view{display:none}
.view.active{display:block}
.card{background:var(--card); border-radius:var(--r-lg); box-shadow:var(--shadow); border:1px solid var(--line2)}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border-radius:999px; font-weight:600; font-size:14px; padding:10px 20px; min-height:42px; transition:transform .15s, opacity .15s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--ink); color:var(--bg)}
@media (prefers-color-scheme: dark){ .btn-primary{background:#F5F5F7; color:#000} }
.btn-blue{background:var(--blue); color:#fff}
.btn-ghost{background:var(--card); border:1px solid var(--line); color:var(--ink)}
.btn-danger{background:var(--accent); color:#fff}
.btn[disabled]{opacity:.45; pointer-events:none}
.chip{display:inline-flex; align-items:center; gap:5px; padding:8px 15px; border-radius:999px; background:var(--card); border:1px solid var(--line); font-size:13px; font-weight:600; color:var(--ink2); min-height:36px; white-space:nowrap}
.chip.on{background:var(--ink); color:var(--bg); border-color:transparent}
@media (prefers-color-scheme: dark){ .chip.on{background:#F5F5F7; color:#000} }
.tag{display:inline-flex; align-items:center; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:700}
.toast{position:fixed; top:18px; left:50%; transform:translate(-50%,-16px); z-index:200; background:rgba(28,28,30,.92); color:#fff;
  padding:11px 20px; border-radius:999px; font-size:14px; font-weight:600; opacity:0; pointer-events:none; transition:.3s; max-width:88vw; text-align:center;
  backdrop-filter:blur(12px); box-shadow:var(--shadow-lg)}
.toast.show{opacity:1; transform:translate(-50%,0)}
.sample-note{max-width:1080px; margin:0 auto; padding:0 20px}
.sample-note div{margin-top:14px; font-size:12px; color:var(--ink3); text-align:center}

/* ---------- 加载动画：每次打开先盖住整页，等世界首帧渲染完成再揭开 ---------- */
.app-loader{position:fixed; inset:0; z-index:400; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px; overflow:hidden;
  transition:opacity .45s ease, visibility .45s;
  /* 加载层自成合成层并与底层隔离：contain 把它的布局/绘制关在自己盒子里，
     底层预加载怎么重排重绘都不会让这一层失效重绘；淡出走 opacity 合成，不占主线程 */
  transform:translateZ(0); will-change:opacity; contain:layout paint}
.app-loader.done{opacity:0; visibility:hidden; pointer-events:none}
.app-loader .ld-stage{position:relative; width:150px; height:96px}
.app-loader .ld-b{position:absolute; bottom:0; border-radius:50%;
  /* 每颗加载泡泡单独提层：ldRise 只动 transform/opacity，提层后动画完全由合成器驱动，
     主线程被底层预加载占满时也不会掉帧；阴影与渐变只在建层时绘制一次，之后逐帧零重绘 */
  will-change:transform,opacity; backface-visibility:hidden;
  background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.92), rgba(56,189,248,.88) 55%, rgba(2,132,199,.90));
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55), inset 4px 5px 10px rgba(255,255,255,.32), 0 6px 16px rgba(90,90,160,.22);
  animation:ldRise 1.5s ease-in-out infinite}
.app-loader .ld-b:nth-child(1){left:6px; width:44px; height:44px; animation-delay:0s}
.app-loader .ld-b:nth-child(2){left:44px; width:64px; height:64px; animation-delay:.22s;
  background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.92), rgba(167,139,250,.88) 55%, rgba(124,58,237,.90))}
.app-loader .ld-b:nth-child(3){left:102px; width:36px; height:36px; animation-delay:.44s;
  background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.92), rgba(52,211,153,.88) 55%, rgba(5,150,105,.90))}
.app-loader .ld-b:nth-child(4){left:26px; width:22px; height:22px; animation-delay:.66s;
  background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.92), rgba(251,146,60,.90) 55%, rgba(234,88,12,.92))}
.app-loader .ld-b:nth-child(5){left:96px; width:18px; height:18px; animation-delay:.88s}
@keyframes ldRise{0%{transform:translateY(10px) scale(.92); opacity:.35}45%{opacity:1}100%{transform:translateY(-26px) scale(1); opacity:.9}}
.app-loader .ld-txt{font-size:15px; font-weight:600; color:var(--ink2); letter-spacing:.06em}
/* 开屏隔离（本轮）：加载层在场期间底层整体退出绘制/合成——世界舞台、顶栏、底部胶囊、
   换一批钮全部 visibility:hidden。它们本来就被不透明的加载层盖住、用户看不见，
   却在以 60fps 全速预加载渲染：几十颗泡泡逐帧合成、悬浮层的 backdrop-filter 逐帧重算模糊，
   把主线程与合成器占满，加载动画就这么被拖卡。visibility:hidden 后浏览器整棵子树
   不绘制、不合成、不算模糊，加载动画独占渲染预算；它不影响布局尺寸，
   spawn / tick 读的舞台宽高照常可用，物理照常预跑（纯数学，无绘制成本）。
   揭开加载层的同一帧移除 booting（见 hideAppLoader），世界在 450ms 淡出下显形，无闪烁 */
html.booting .wrap, html.booting .topbar, html.booting .capsule, html.booting .shuffle-fab{visibility:hidden}

/* ---------- 世界（全屏） ---------- */
.world-head{position:relative; z-index:30; display:flex; align-items:flex-end; justify-content:space-between; gap:14px; flex-wrap:wrap; margin:6px 2px 12px; pointer-events:none}
.world-head>*{pointer-events:auto}
.world-head .wh-txt{background:var(--glass); backdrop-filter:blur(10px) saturate(160%); -webkit-backdrop-filter:blur(10px) saturate(160%); border:1px solid var(--glass-brd); border-radius:18px; padding:10px 16px; box-shadow:var(--shadow)}
.world-head h2{font-size:26px; font-weight:800; letter-spacing:-.01em; margin:0}
.world-head p{margin:3px 0 0; color:var(--ink2); font-size:13px}
.world-tools{display:flex; gap:8px; overflow-x:auto; padding:6px; scrollbar-width:none; background:var(--glass); backdrop-filter:blur(10px) saturate(160%); -webkit-backdrop-filter:blur(10px) saturate(160%); border:1px solid var(--glass-brd); border-radius:999px; box-shadow:var(--shadow)}
.world-tools::-webkit-scrollbar{display:none}
/* ---------- 筛选：积分右侧的图标按钮，点开后以胶囊面板按列对齐向下展开 ---------- */
.filter-toggle{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; flex:none; color:var(--ink);
  background:var(--glass); backdrop-filter:blur(10px) saturate(160%); -webkit-backdrop-filter:blur(10px) saturate(160%);
  border:1px solid var(--glass-brd); box-shadow:var(--shadow); transition:background .2s, color .2s}
.filter-toggle.open{background:var(--ink); color:var(--bg); border-color:transparent}
@media (prefers-color-scheme: dark){ .filter-toggle.open{background:#F5F5F7; color:#000} }
.filter-drawer{display:none; justify-content:flex-end; margin-top:8px}
.filter-drawer.open{display:flex; pointer-events:auto}
.filter-panel{background:var(--glass); backdrop-filter:blur(12px) saturate(160%); -webkit-backdrop-filter:blur(12px) saturate(160%);
  border:1px solid var(--glass-brd); border-radius:24px; box-shadow:var(--shadow-lg); padding:8px; min-width:176px;
  animation:dropDown .22s cubic-bezier(.2,1,.3,1)}
@keyframes dropDown{from{opacity:0; transform:translateY(-6px)}to{opacity:1; transform:translateY(0)}}
.filter-panel .world-tools{flex-direction:column; align-items:stretch; gap:4px; padding:0; margin:0;
  background:none; border:none; border-radius:0; box-shadow:none; backdrop-filter:none; -webkit-backdrop-filter:none; overflow:visible}
.filter-panel .chip{width:100%; justify-content:flex-start; background:transparent; border-color:transparent; border-radius:14px; padding:9px 14px}
.filter-panel .chip.on{background:var(--ink); color:var(--bg)}
@media (prefers-color-scheme: dark){ .filter-panel .chip.on{background:#F5F5F7; color:#000} }
/* ---------- 换一批：独立图标按钮，底部胶囊上方居中 ---------- */
.shuffle-fab{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(92px + env(safe-area-inset-bottom)); z-index:75;
  width:46px; height:46px; border-radius:50%; display:grid; place-items:center; color:var(--ink);
  background:var(--glass); backdrop-filter:blur(10px) saturate(160%); -webkit-backdrop-filter:blur(10px) saturate(160%);
  border:1px solid var(--glass-brd); box-shadow:var(--shadow)}
.shuffle-fab:active{transform:translateX(-50%) scale(.93)}
.shuffle-fab svg{transform:rotate(-90deg)}
.world-stage{position:fixed; inset:0; z-index:0; isolation:isolate; overflow:hidden; touch-action:none;
  background:
    radial-gradient(560px 300px at 12% 8%, rgba(125,211,252,.20), transparent 65%),
    radial-gradient(520px 320px at 88% 22%, rgba(196,181,253,.20), transparent 65%),
    radial-gradient(480px 300px at 55% 95%, rgba(249,168,212,.16), transparent 65%),
    var(--bg)}
/* 性能：泡泡不再挂 backdrop-filter——60 个带实时背景模糊的元素逐帧漂移是打开卡顿的主因；
   泡面底色本身接近不透明，去掉模糊后观感几乎不变，但每帧只需合成位移、不再重算背景。
   第二轮减负（本轮）：卡顿不在泡泡的圆形，而在「绘制」——
   1）浮在泡泡场之上的悬浮层（顶栏品牌/筛选钮、换一批钮、底部胶囊）原本挂 18–30px 的
      backdrop-filter，泡泡在它们背后每动一帧，浏览器就要把那几块区域的背景重新模糊一遍，
      这是手机端最经典的掉帧源；已把这些层的底色提实、模糊半径砍到 10–12px（见各规则）。
   2）泡泡自身：高光伪元素原用 filter:blur 逐颗挂滤镜，会拖慢整颗泡泡的图层合成，
      改用径向渐变画柔边高光，零滤镜；四层 box-shadow 精简为三层、外阴影收小一号 */
.bubble{position:absolute; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  padding:4%; cursor:grab; user-select:none; -webkit-user-select:none; will-change:transform; touch-action:none;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55), inset 6px 8px 14px rgba(255,255,255,.32), 0 6px 16px rgba(90,90,160,.13);
  transition:opacity .6s}
.bubble.dragging{cursor:grabbing; transition:none; filter:brightness(1.08)}
.bubble::before{content:""; position:absolute; top:9%; left:14%; width:32%; height:22%; border-radius:50%;
  background:radial-gradient(closest-side, rgba(255,255,255,.85), rgba(255,255,255,0)); transform:rotate(-24deg); pointer-events:none}
.bubble *{pointer-events:none}
.bubble .b-name{font-weight:700; font-size:11px; color:rgba(29,29,31,.62); line-height:1.25; margin-top:3px; width:100%; max-width:100%; flex:none; padding:0 1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
@media (prefers-color-scheme: dark){ .bubble .b-name{color:rgba(255,255,255,.78)} }
.bubble .b-flags{position:absolute; bottom:8%; left:50%; transform:translateX(-50%); display:flex; gap:4px; align-items:center; justify-content:center; white-space:nowrap}
.bubble .b-perm{font-size:9px; font-weight:800; letter-spacing:.08em; color:rgba(146,64,14,.88); background:rgba(255,190,60,.24); padding:2px 7px; border-radius:999px; white-space:nowrap}
.bubble .b-admin{font-size:9px; font-weight:800; letter-spacing:.08em; color:rgba(190,18,40,.88); background:rgba(250,36,60,.14); padding:2px 7px; border-radius:999px; white-space:nowrap}
@media (prefers-color-scheme: dark){ .bubble .b-perm{color:rgba(253,224,171,.92); background:rgba(255,190,60,.20)} .bubble .b-admin{color:rgba(255,180,190,.92); background:rgba(250,36,60,.22)} }
.bubble.mine{box-shadow:inset 0 0 0 2px var(--blue), inset 6px 8px 14px rgba(255,255,255,.25), 0 6px 16px rgba(0,113,227,.20)}
.bubble.fresh{animation:freshPulse 1.2s ease 2}
@keyframes freshPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
/* 呼吸明暗：仅管理员泡泡（偏金）与永久泡泡（偏彩），约 3 秒一明一暗、幅度柔和；普通泡泡无此效果 */
/* 呼吸只动 filter 的明暗（合成层可缓存），光晕 box-shadow 改为静态值挂在基础规则上——
   逐帧动画 box-shadow 会强制整颗泡泡每帧重绘，是持续掉帧的来源之一 */
.bubble.is-admin{
  background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.96), rgba(254,240,180,.74) 52%, rgba(250,190,40,.68));
  box-shadow:inset 0 0 0 1.5px rgba(255,215,90,.55), inset 6px 8px 14px rgba(255,255,255,.32), 0 6px 16px rgba(190,140,10,.15), 0 0 18px 3px rgba(255,190,40,.22);
  animation:breatheAdmin 3s ease-in-out infinite}
.bubble.is-perm{
  background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.96), rgba(221,200,254,.74) 48%, rgba(147,180,253,.70) 78%, rgba(249,168,212,.68));
  box-shadow:inset 0 0 0 1.5px rgba(196,160,255,.5), inset 6px 8px 14px rgba(255,255,255,.32), 0 6px 16px rgba(130,100,220,.14), 0 0 18px 3px rgba(167,139,250,.20);
  animation:breathePerm 3s ease-in-out infinite}
@keyframes breatheAdmin{
  0%,100%{filter:brightness(.97) saturate(1)}
  50%{filter:brightness(1.10) saturate(1.12)}
}
@keyframes breathePerm{
  0%,100%{filter:brightness(.97) saturate(1)}
  50%{filter:brightness(1.10) saturate(1.14)}
}
.bubble.is-admin.dragging,.bubble.is-perm.dragging{animation-play-state:paused}
.bubble.leaving{opacity:0}
/* 查看后关闭的爆点：原泡泡快速胀大变淡消失，同时在原位置炸开一圈水滴与扩散光圈（见脚本 burstBubble） */
.bubble.popping{pointer-events:none}
.burst-fx{position:absolute; width:0; height:0; z-index:96; pointer-events:none}
.burst-ring{position:absolute; left:0; top:0; width:12px; height:12px; margin:-6px 0 0 -6px; border-radius:50%;
  border:2px solid rgba(255,255,255,.92); box-shadow:0 0 0 1.5px rgba(125,180,255,.35), inset 0 0 6px rgba(255,255,255,.6);
  animation:burstRing .44s ease-out forwards}
@keyframes burstRing{from{transform:scale(1); opacity:.95}to{transform:scale(var(--rs,8)); opacity:0}}
.burst-dot{position:absolute; left:0; top:0; border-radius:50%;
  background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.95), var(--c,rgba(186,230,253,.85)) 62%, rgba(255,255,255,.25));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.55), 0 1px 5px rgba(90,90,160,.20);
  animation:burstFly .5s cubic-bezier(.15,.8,.3,1) forwards}
@keyframes burstFly{0%{transform:translate(0,0) scale(1); opacity:1}65%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.3); opacity:0}}
.bubble .b-ico{opacity:.45; flex:none; line-height:0}
/* 泡面不透明度：为性能去掉 backdrop-filter 后，填充曾抬到 .84–.90，用户反馈太重、太实。
   本轮按反馈下调到 .66–.74：仍明显比最早的 .5 半透明厚实（不会发飘看穿），
   又透出一点底色、回到轻盈的泡泡感；毛玻璃感继续由高光 + 内阴影承担，不加回实时模糊 */
.tint-text{background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.95), rgba(186,230,253,.72) 55%, rgba(125,211,252,.66))}
.tint-image{background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.95), rgba(187,247,208,.72) 55%, rgba(110,231,183,.66))}
.tint-audio{background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.95), rgba(254,215,170,.74) 55%, rgba(253,186,116,.67))}
.tint-video{background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.95), rgba(221,214,254,.74) 55%, rgba(196,181,253,.68))}

/* ---------- 展开层 ---------- */
.overlay{position:fixed; inset:0; z-index:120; background:rgba(20,20,25,.38); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  display:none; align-items:center; justify-content:center; padding:18px}
.overlay.show{display:flex}
/* 公告弹窗专用：遮罩只做轻微压暗、不糊背景——泡泡场在弹窗后面依然清晰可辨，
   不再出现「打开只见一层模糊、以为泡泡没了」的观感；点遮罩空白处也能关（见脚本 closeAnnounce） */
#announceOverlay{background:rgba(20,20,25,.26); backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px); cursor:pointer}
#announceOverlay .announce-card{cursor:default}
.expand-card{width:min(92vw,520px); max-height:86vh; overflow-y:auto; background:var(--card); border-radius:26px; box-shadow:var(--shadow-lg);
  padding:26px 24px 22px; animation:pop .32s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.55); opacity:0}to{transform:scale(1); opacity:1}}
.expand-meta{display:flex; align-items:center; gap:10px; margin-bottom:14px}
.avatar{width:42px; height:42px; border-radius:50%; flex:none; display:grid; place-items:center; color:#fff; font-weight:800; font-size:17px}
.expand-meta .who{flex:1; min-width:0}
.expand-meta .who b{display:block; font-size:15px}
.expand-meta .who small{color:var(--ink3); font-size:12px}
.expand-meta .who .who-id{display:block; color:var(--ink3); font-size:12px; line-height:1.4; margin-top:1px}
.expand-meta .who .who-time{display:block; color:var(--ink3); font-size:12px; line-height:1.4}
/* 展开卡右列：发布时间与「N 积分 · 类型」标签上下成一列、整体右对齐 */
.expand-meta .meta-right{display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex:none; text-align:right}
.expand-meta .meta-right .who-time{color:var(--ink3); font-size:12px; line-height:1.4}
.expand-body{font-size:17px; line-height:1.7; word-break:break-word}
.expand-img{width:100%; height:250px; border-radius:18px; margin-bottom:14px; display:grid; place-items:center; color:rgba(255,255,255,.92);
  background:linear-gradient(135deg,#38BDF8,#818CF8 55%,#E879F9); position:relative; overflow:hidden}
.expand-img::after{content:"示例图片 · 正式版显示链接原图"; position:absolute; bottom:10px; right:12px; font-size:11px; background:rgba(0,0,0,.35); padding:3px 9px; border-radius:999px}
.expand-photo{width:100%; display:block; border-radius:14px; margin-bottom:12px; background:rgba(120,120,128,.12)}
.expand-video{width:100%; aspect-ratio:16/9; background:#000; border-radius:18px; margin-bottom:14px; display:block; object-fit:contain}
/* Video.js 10 容器：与原生视频同尺寸同圆角；播放器是 Web 组件
   <video-player><video-skin>…</video-skin></video-player>，由远程模块脚本注册后在容器内升级渲染，
   皮肤强调色对齐全站蓝色（--media-accent-color 是 v10 皮肤的官方主题变量） */
.expand-player{position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:18px; margin-bottom:14px; overflow:hidden}
.expand-player video-player{display:block; width:100%; height:100%}
.expand-player video-skin{display:block; width:100%; height:100%; --media-accent-color:#0071E3; --media-border-radius:0px}
.expand-player video-skin video,.expand-player video-skin hls-video,.expand-player video-skin hlsjs-video{display:block; width:100%; height:100%; background:#000}
.expand-player .hls-tag{position:absolute; top:10px; left:10px; z-index:5; font-size:10px; font-weight:800; letter-spacing:.06em; color:#fff; background:rgba(250,36,60,.85); padding:2px 8px; border-radius:999px; pointer-events:none}
.media-file-line{font-size:11px; color:var(--ink3); margin-top:8px; word-break:break-all}
/* 发布媒体区精简成一行：上传按钮与链接输入同行，已选文件时整行换成文件信息行（同高），
   校验提示默认不占位，媒体模式下说明框压到单行高——四种类型的发布窗总高度保持一致 */
.media-row{display:flex; gap:8px; align-items:center}
.media-row #mediaInput{flex:1; min-width:0; height:46px; padding:0 14px}
.media-row #upPick{flex:none; height:46px; min-height:46px; padding:0 16px; border-radius:12px; white-space:nowrap}
.up-info{display:flex; align-items:center; gap:10px; height:46px; border:1px dashed var(--line); border-radius:12px; padding:0 8px 0 10px; background:rgba(120,120,128,.05)}
.up-info img{width:30px; height:30px; object-fit:cover; border-radius:8px; flex:none}
.up-info .tx{flex:1; min-width:0}
.up-info .tx b{display:block; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.up-info .tx small{display:block; color:var(--ink3); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#mediaHint{display:none; margin-top:6px}
#mediaHint.show{display:block}
.audio-box{padding:6px 0 2px}
.audio-box .expand-body{margin-bottom:12px}
/* 语音条（微信语音消息式）：浅色圆角长条，左侧圆形播放/暂停钮，声波弧线播放时依次亮起，
   右侧是剩余秒数倒计时；播放进度为条内一层填充从左向右推进——填充用与音频泡泡同色系的
   亮橙渐变（#FDBA74 → #FB923C，取自 .tint-audio 的蜜桃橙），不再用发暗的深灰黑盖住条面；
   填充之上的内容用一层深字副本按同一进度裁切盖住（clip-path 与填充共用 --p），
   深字压在亮橙上、也压在未播的浅色段上，都看得清。
   点按条身切换播放/暂停，按住拖动快进/快退（指针接线见脚本 openExpand 的语音条部分） */
.voice-bar{--p:0%; position:relative; height:54px; border-radius:999px; overflow:hidden; cursor:pointer;
  background:rgba(255,159,10,.20); border:1px solid rgba(255,159,10,.42); touch-action:none; user-select:none; -webkit-user-select:none}
.voice-bar .vb-fill{position:absolute; left:0; top:0; bottom:0; width:var(--p); pointer-events:none;
  background:linear-gradient(90deg,#FDBA74,#FB923C); box-shadow:inset 0 1px 0 rgba(255,255,255,.45), 2px 0 10px rgba(251,146,60,.45)}
.voice-bar .vb-row{position:absolute; inset:0; display:flex; align-items:center; gap:10px; padding:0 18px 0 60px; color:#9A3412; pointer-events:none}
.voice-bar .vb-top{color:var(--ink); clip-path:inset(0 calc(100% - var(--p)) 0 0); -webkit-clip-path:inset(0 calc(100% - var(--p)) 0 0)}
.voice-bar .vb-sp{flex:1}
.voice-bar .vb-time{font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; color:#7C2D12}
.voice-bar .vb-top .vb-time{color:var(--ink)}
.voice-bar .vb-btn{position:absolute; left:9px; top:50%; transform:translateY(-50%); z-index:3; width:38px; height:38px; border-radius:50%;
  display:grid; place-items:center; background:linear-gradient(135deg,#FDBA74,#F97316); box-shadow:0 3px 10px rgba(249,115,22,.40); color:#fff; pointer-events:none}
.voice-bar .vb-btn .ico-pause{display:none}
.voice-bar.is-playing .vb-btn .ico-pause{display:block}
.voice-bar.is-playing .vb-btn .ico-play{display:none}
.voice-bar.is-playing .vw1{animation:vwB 1.1s ease-in-out infinite}
.voice-bar.is-playing .vw2{animation:vwB 1.1s ease-in-out infinite .27s}
@keyframes vwB{0%,100%{opacity:.25}50%{opacity:1}}
.vb-hint{display:flex; justify-content:space-between; gap:10px; font-size:11px; color:var(--ink3); margin-top:7px}
.video-box{width:100%; aspect-ratio:16/9; border-radius:18px; background:#000; display:grid; place-items:center; color:#fff; position:relative; overflow:hidden; margin-bottom:14px}
.video-box .v-play{width:64px; height:64px; border-radius:50%; background:rgba(255,255,255,.22); backdrop-filter:blur(6px); display:grid; place-items:center}
.video-box small{position:absolute; bottom:10px; left:12px; font-size:11px; background:rgba(0,0,0,.45); padding:3px 9px; border-radius:999px}
.expand-actions{display:flex; gap:10px; margin-top:18px}
.expand-actions .btn{flex:1}
.btn-fav{border:1px solid var(--line); background:var(--card2); color:var(--ink2)}
.btn-fav.on{background:rgba(255,159,10,.14); border-color:rgba(255,159,10,.45); color:var(--orange)}
.btn-fav.on svg{fill:currentColor}
.hist-time{white-space:nowrap; font-size:11px; color:var(--ink3)}

/* ---------- 底部胶囊 ---------- */
.capsule{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(14px + env(safe-area-inset-bottom)); z-index:80;
  display:flex; align-items:stretch; gap:2px; padding:6px; border-radius:999px;
  background:var(--capsule); backdrop-filter:blur(12px) saturate(160%); -webkit-backdrop-filter:blur(12px) saturate(160%);
  border:1px solid rgba(255,255,255,.22);
  box-shadow:0 14px 34px rgba(0,0,0,.20); color:var(--capsule-ink)}
.cap-item{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; min-width:86px; min-height:52px;
  padding:7px 16px; border-radius:999px; font-size:11px; font-weight:600; color:rgba(245,245,247,.62); position:relative}
.cap-item.on{background:rgba(255,255,255,.17); color:#fff}
.cap-item.mid{min-width:76px}
.cap-item:active{transform:scale(.96)}

/* ---------- 发布弹窗 ---------- */
/* 背景遮罩：暗色与模糊都挂在 .in 状态上并一起过渡——关闭弹窗的瞬间遮罩立刻开始淡出+去模糊，
   和面板下滑同步完成，不再等面板藏好后才把模糊硬切掉 */
.sheet-wrap{position:fixed; inset:0; z-index:130; background:rgba(20,20,25,0); backdrop-filter:blur(0px); -webkit-backdrop-filter:blur(0px);
  display:none; transition:background .32s ease, backdrop-filter .32s ease, -webkit-backdrop-filter .32s ease}
.sheet-wrap.show{display:block}
.sheet-wrap.in{background:rgba(20,20,25,.38); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px)}
.sheet-wrap.closing{background:rgba(20,20,25,0); backdrop-filter:blur(0px); -webkit-backdrop-filter:blur(0px)}
.sheet{position:absolute; left:50%; bottom:0; width:min(100%,640px); max-height:92vh; overflow-y:auto; overscroll-behavior:contain;
  background:var(--glass); backdrop-filter:blur(28px) saturate(180%); -webkit-backdrop-filter:blur(28px) saturate(180%);
  border-radius:28px 28px 0 0; border-top:1px solid var(--glass-brd); padding:4px 20px calc(16px + env(safe-area-inset-bottom));
  transform:translate(-50%,105%); transition:transform .36s cubic-bezier(.2,1,.3,1); will-change:transform}
.sheet-wrap.in .sheet{transform:translate(-50%,0)}
.sheet.dragging{transition:none}
/* 横杠热区放宽到整行宽：以前只有居中 96px，手指稍偏就落到内容区、拖拽失效变成滚页面 */
.grab-zone{width:100%; padding:9px 0 5px; cursor:grab; touch-action:none}
.grab-zone:active{cursor:grabbing}
.grab{width:40px; height:5px; border-radius:3px; background:var(--ink3); opacity:.5; margin:0 auto}
.sheet h3{font-size:21px; font-weight:800; margin:0 0 10px}
.seg{display:flex; background:rgba(120,120,128,.14); border-radius:12px; padding:3px; gap:2px; margin-bottom:12px}
.seg button{flex:1; min-height:38px; border-radius:9px; font-size:14px; font-weight:600; color:var(--ink2); display:flex; align-items:center; justify-content:center; gap:5px}
.seg button.on{background:var(--card); color:var(--ink); box-shadow:0 2px 8px rgba(0,0,0,.12)}
.field{margin-bottom:10px}
.field label{display:flex; justify-content:space-between; font-size:13px; font-weight:700; margin-bottom:7px}
.field label .cnt{color:var(--ink3); font-weight:500}
.field textarea,.field input[type=text],.field select{width:100%; border:1px solid var(--line); background:var(--card); border-radius:12px; padding:12px 14px; outline:none}
.field textarea{resize:vertical; min-height:56px; line-height:1.6}
/* 发布窗高度对齐：文字模式输入框补足媒体区占掉的高度，媒体模式说明框压到单行高，
   切换类型时窗口总高度不变；发布框禁用手动拉伸，避免高度被拖乱 */
#contentInput{resize:none; height:98px; min-height:98px}
/* 媒体模式说明框 = 严格单行：总高 46px（与媒体行同高）、上下内边距各 10px、行高 24px（16px×1.5），
   内容区 = 46 − 10×2 − 边框 2 = 24px，恰好容纳一行——提示文字上下间距一致、垂直居中；
   旧值 44px 高 + 12px 内边距 + 行高 1.6（25.6px）时内容区只剩 18px，一行字塞不下、上下被裁。
   white-space:nowrap 保证提示与输入都只占一行，窄屏下不折成第二行被框切掉 */
.sheet.media-mode #contentInput{height:46px; min-height:46px; padding:10px 14px; line-height:1.5; white-space:nowrap}
.field textarea:focus,.field input:focus,.field select:focus{border-color:var(--blue)}
.field .hint{font-size:12px; color:var(--ink3); margin-top:6px}
.cost-row{display:flex; gap:8px}
.cost-opt{flex:1; border:1.5px solid var(--line); background:var(--card); border-radius:14px; padding:8px 4px 6px; text-align:center; min-height:56px}
.cost-opt .n{font-size:17px; font-weight:800}
.cost-opt .s{margin:5px auto 3px; border-radius:50%; background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.95), rgba(125,211,252,.55) 60%, rgba(125,211,252,.4)); box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}
.cost-opt small{font-size:10px; color:var(--ink3); font-weight:600}
.cost-opt.on{border-color:var(--blue); background:rgba(0,113,227,.06)}
.cost-opt.off{opacity:.38}
.sheet-actions{display:flex; gap:10px}
.sheet-actions .btn{flex:1; min-height:48px; font-size:15px}

/* ---------- 我的 ---------- */
[hidden]{display:none !important}
.profile-mini{width:100%; display:flex; align-items:center; gap:12px; padding:16px 18px; text-align:left; margin-bottom:14px}
.profile-mini .avatar{width:48px; height:48px; font-size:20px}
.profile-mini .pm-tx{flex:1; min-width:0}
.profile-mini .pm-tx b{display:block; font-size:16px}
.profile-mini .pm-tx small{color:var(--ink3); font-size:12px}
.menu-card{overflow:hidden}
.menu-row{width:100%; display:flex; align-items:center; gap:12px; padding:15px 18px; text-align:left; border-bottom:1px solid var(--line2); min-height:62px}
.menu-row:last-child{border-bottom:none}
.menu-row:active{background:var(--card2)}
.menu-row .m-ico{width:38px; height:38px; border-radius:12px; background:var(--card2); border:1px solid var(--line2); display:grid; place-items:center; flex:none; color:var(--ink2)}
.menu-row .m-tx{flex:1; min-width:0}
.menu-row .m-tx b{display:block; font-size:15px}
.menu-row .m-tx small{color:var(--ink3); font-size:12px}
.menu-row .m-val{font-size:13px; font-weight:700; color:var(--ink2); white-space:nowrap}
.menu-row .m-arrow{color:var(--ink3); flex:none}
.mine-panel .sec-title{margin-top:4px}
.profile-card{padding:24px}
.profile-top{display:flex; align-items:center; gap:14px}
.profile-top .avatar{width:58px; height:58px; font-size:23px}
.profile-top h3{margin:0; font-size:19px; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.profile-top .profile-id{font-size:12px; font-weight:500; color:var(--ink3); letter-spacing:.02em; white-space:nowrap}
.profile-top p{margin:2px 0 0; color:var(--ink2); font-size:13px}
.kv{display:flex; justify-content:space-between; padding:10px 0; border-top:1px solid var(--line2); font-size:13px}
.kv span{color:var(--ink2)} .kv b{font-weight:600}
.points-card{padding:24px; text-align:center}
.points-card .big{font-size:46px; font-weight:800; letter-spacing:-.02em; line-height:1.1; margin-bottom:14px}
.points-card .lbl{color:var(--ink2); font-size:13px; margin-bottom:14px}
.checkin-note{font-size:12px; color:var(--ink3); margin-top:10px}
.sec-title{font-size:19px; font-weight:800; margin:26px 2px 12px; display:flex; justify-content:space-between; align-items:baseline}
.sec-title small{font-size:12px; color:var(--ink3); font-weight:500}
.log-list,.my-list{background:var(--card); border-radius:var(--r-lg); box-shadow:var(--shadow); border:1px solid var(--line2); overflow:hidden}
.log-row{display:flex; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line2); font-size:14px}
.log-row:last-child{border-bottom:none}
.log-row .amt{margin-left:auto; font-weight:800}
.amt.plus{color:var(--green)} .amt.minus{color:var(--accent)}
.log-row small{display:block; color:var(--ink3); font-size:12px}
.my-row{display:flex; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line2)}
.my-row:last-child{border-bottom:none}
.mini-b{width:44px; height:44px; border-radius:50%; flex:none; display:grid; place-items:center; box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55), 0 4px 10px rgba(90,90,160,.15)}
.my-row .info{flex:1; min-width:0}
.my-row .info b{display:block; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.my-row .info small{display:block; color:var(--ink3); font-size:12px; line-height:1.5}
.icon-btn{width:38px; height:38px; border-radius:50%; display:grid; place-items:center; background:var(--card2); border:1px solid var(--line2); flex:none}
.auth-card{padding:28px 24px; max-width:460px; margin:0 auto}
.auth-card h3{font-size:23px; font-weight:800; margin:0 0 6px}
.auth-card p{color:var(--ink2); font-size:13px; margin:0 0 18px}
.verify-note{display:flex; gap:8px; background:rgba(0,113,227,.07); border-radius:12px; padding:10px 13px; font-size:12px; color:var(--ink2); margin-top:14px; line-height:1.5}

/* ---------- 管理员 ---------- */
.stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px}
@media (max-width:760px){ .stat-grid{grid-template-columns:repeat(2,1fr)} }
.stat{background:var(--card); border-radius:var(--r-md); box-shadow:var(--shadow); border:1px solid var(--line2); padding:16px}
.stat .n{font-size:26px; font-weight:800}
.stat .t{font-size:12px; color:var(--ink2); margin-top:2px}
.filter-bar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px}
.filter-bar select,.filter-bar input{border:1px solid var(--line); background:var(--card); border-radius:10px; padding:9px 12px; min-height:38px}
.filter-bar input{flex:1; min-width:150px}
.table-card{background:var(--card); border-radius:var(--r-lg); box-shadow:var(--shadow); border:1px solid var(--line2); overflow:hidden}
.trow{display:flex; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line2); font-size:13px}
.trow:last-child{border-bottom:none}
.trow .main{flex:1; min-width:0}
.trow .main b{display:block; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.trow .main small{color:var(--ink3); font-size:12px}
.trow .ops{display:flex; gap:6px; flex:none}
.mini-btn{padding:7px 13px; border-radius:999px; font-size:12px; font-weight:700; background:var(--card2); border:1px solid var(--line); min-height:34px}
.mini-btn.red{color:var(--accent)}
.mini-btn.blue{color:var(--blue)}
.switch{position:relative; width:50px; height:30px; flex:none}
.switch input{opacity:0; width:100%; height:100%; position:absolute; margin:0; cursor:pointer}
.switch i{position:absolute; inset:0; border-radius:999px; background:rgba(120,120,128,.32); transition:.2s; pointer-events:none}
.switch i::after{content:""; position:absolute; top:2px; left:2px; width:26px; height:26px; border-radius:50%; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.25); transition:.2s}
.switch input:checked + i{background:#34C759}
.switch input:checked + i::after{transform:translateX(20px)}
.set-row{display:flex; align-items:center; gap:14px; padding:16px 20px; border-bottom:1px solid var(--line2)}
.set-row:last-child{border-bottom:none}
.set-row .tx{flex:1} .set-row .tx b{display:block; font-size:14px} .set-row .tx small{color:var(--ink3); font-size:12px; line-height:1.5}
.set-row input[type=number]{width:76px; border:1px solid var(--line); border-radius:10px; padding:8px 10px; text-align:center; background:var(--card)}
/* 系统设置分组：每类设置独立成卡，组与组之间留空，不再全部挤在一个大卡片里 */
.settings-stack{display:flex; flex-direction:column; gap:18px}
.set-group{overflow:hidden}
.set-group-head{padding:16px 20px 13px; border-bottom:1px solid var(--line2); background:var(--card2)}
.set-group-head h4{margin:0; font-size:15px; font-weight:800; letter-spacing:.01em}
.set-group-head p{margin:3px 0 0; font-size:12px; color:var(--ink3); line-height:1.5}
.set-group .set-row{padding:18px 20px}
.set-group .mail-group{border-top:1px solid var(--line2); border-bottom:none}
.set-group .mail-group .mg-head{padding-top:16px}
/* 管理员后台与「我的」同一套参数：列表行只放一行摘要（不再把统计和按钮全塞进行里），点进行才看详情与操作 */
.trow.clickable{cursor:pointer}
.trow.clickable:active{background:var(--card2)}
.trow .chev{color:var(--ink3); flex:none}
.detail-head{display:flex; gap:14px; align-items:flex-start; padding:20px 20px 6px}
.detail-head .info{flex:1; min-width:0}
.detail-head .info b{display:block; font-size:16px; line-height:1.5; word-break:break-word}
.detail-head .info small{color:var(--ink3); font-size:12px}
.detail-kv{padding:2px 20px 6px}
.detail-actions{display:flex; gap:10px; padding:14px 20px 20px; flex-wrap:wrap}
.detail-actions .btn{flex:1; min-width:96px}

/* ---------- 确认弹窗 ---------- */
.confirm-card{width:min(88vw,380px); background:var(--card); border-radius:22px; box-shadow:var(--shadow-lg); padding:24px; text-align:center; animation:pop .25s ease}
.confirm-card h4{margin:0 0 8px; font-size:17px}
.confirm-card p{margin:0 0 18px; color:var(--ink2); font-size:14px; line-height:1.6}
.confirm-card .row{display:flex; gap:10px}
.confirm-card .row .btn{flex:1}

/* ---------- 赠送积分弹窗 ---------- */
.gift-amounts{display:flex; gap:8px; margin-bottom:12px}
.gift-opt{flex:1; border:1.5px solid var(--line); background:var(--card); border-radius:12px; min-height:48px; font-size:16px; font-weight:800; color:var(--ink)}
.gift-opt.on{border-color:var(--blue); background:rgba(0,113,227,.06); color:var(--blue)}
.gift-custom{width:100%; border:1px solid var(--line); background:var(--card); border-radius:12px; padding:12px 14px; outline:none; text-align:center; font-size:15px; margin-bottom:18px; color:var(--ink)}
.gift-custom:focus{border-color:var(--blue)}
.back-link{display:inline-flex; align-items:center; gap:5px; font-weight:600; font-size:14px; color:var(--blue); min-height:40px; padding:4px 8px 4px 0}
/* 统一参数：所有二级页顶部的返回按钮（「我的」详情页、管理员后台首页与各详情页共用同一套）。
   按钮上方的间隔走全站统一值——正文起点由 body 的 padding-top 决定，与顶部小胶囊之间留约 10px；
   这里只压低按钮自身高度，绝不能再用负 margin 上移，否则会吃掉那段间隔、让按钮被胶囊压住 */
.mine-panel .back-link,.admin-panel .back-link,.admin-home-back{margin-top:0; min-height:34px; padding-top:0; padding-bottom:2px}
.admin-panel .sec-title{margin-top:4px}
.admin-entry{width:100%; display:flex; align-items:center; gap:12px; padding:18px 20px; text-align:left}
.admin-entry b{font-size:15px; display:block}
.admin-entry small{color:var(--ink3); font-size:12px}
@media (max-width:640px){
  .world-tools{flex-wrap:nowrap; overflow-x:auto}
  .world-head h2{font-size:22px}
  .cap-item{min-width:74px; padding:7px 12px}
  .brand small{display:none}
  .brand{padding:6px 12px 6px 7px; gap:7px}
  .brand h1{font-size:15px}
  .brand-mark{width:30px; height:30px}
  .points-pill{padding:7px 11px 7px 8px}
  .topbar{padding:0 10px}
}
/* 世界全屏布局：舞台铺满视口 */
#view-world.active{display:block; min-height:calc(100dvh - 240px)}
/* 公告弹窗 */
.announce-card{width:min(88vw,400px); background:var(--card); border-radius:24px; box-shadow:var(--shadow-lg); padding:28px 24px 22px; text-align:center; animation:annIn .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes annIn{from{transform:scale(.9)}to{transform:scale(1)}}
.announce-card .a-ico{width:52px; height:52px; margin:0 auto 12px; border-radius:50%; display:grid; place-items:center; color:#0369A1; background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.95), rgba(186,230,253,.6) 55%, rgba(125,211,252,.55)); box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6)}
@media (prefers-color-scheme: dark){ .announce-card .a-ico{color:#7DD3FC} }
.announce-card h4{margin:0 0 8px; font-size:19px; font-weight:800}
.announce-card p{margin:0 0 20px; color:var(--ink2); font-size:14px; line-height:1.7; white-space:pre-wrap; word-break:break-word}
.announce-card .btn{width:100%; min-height:46px}
/* 出现 / 查看次数 */
.stat-line{display:flex; gap:14px; flex-wrap:wrap; margin-top:14px; padding-top:12px; border-top:1px solid var(--line2); font-size:12px; color:var(--ink2)}
.stat-line b{color:var(--ink); font-weight:700}
.perm-tag{background:rgba(255,159,10,.18)!important; color:var(--orange)!important}
.admin-tag{background:rgba(250,36,60,.12)!important; color:var(--accent)!important}
.like-tag{background:rgba(0,113,227,.12)!important; color:var(--blue)!important}
.report-tag{background:rgba(255,159,10,.16)!important; color:var(--orange)!important}
.auto-hidden-tag{background:rgba(250,36,60,.13)!important; color:var(--accent)!important}
/* 待审核：已自动隐藏（举报达阈值）的行整行淡红置顶，一眼区分轻重 */
.trow.review-hot{background:rgba(250,36,60,.055)}
.trow.review-hot:active{background:rgba(250,36,60,.11)}
.review-reports{color:var(--accent); font-weight:800}
.hidden-tag{background:rgba(120,120,128,.18)!important; color:var(--ink2)!important}
/* 点赞 / 踩 / 举报 */
.vote-row{display:flex; gap:6px; margin-top:12px}
.vote-btn{flex:1; display:flex; align-items:center; justify-content:center; gap:4px; min-height:32px; padding:5px 8px; border-radius:999px; border:1px solid var(--line); background:var(--card2); font-size:12px; font-weight:700; color:var(--ink2); transition:.15s}
.vote-btn:active{transform:scale(.96)}
.vote-btn .n{font-variant-numeric:tabular-nums}
.vote-btn.liked{background:rgba(250,36,60,.10); border-color:rgba(250,36,60,.28); color:var(--accent)}
.vote-btn.disliked{background:rgba(0,0,0,.07); border-color:rgba(0,0,0,.18); color:var(--ink)}
.vote-btn.reported{background:rgba(255,159,10,.14); border-color:rgba(255,159,10,.35); color:var(--orange)}
.prio-line{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px}
.prio-note{font-size:11px; color:var(--ink3); margin-top:8px; line-height:1.5}
/* 永久泡泡 / 授权码 */
.perm-box{border:1.5px dashed rgba(255,159,10,.55); background:rgba(255,159,10,.06); border-radius:14px; padding:11px 12px; margin-bottom:10px}
.perm-box .row1{display:flex; align-items:center; gap:10px}
.perm-box .row1 b{font-size:14px; flex:1}
.perm-box .row1 small{display:block; color:var(--ink2); font-weight:500; font-size:12px}
.perm-box input{width:100%; margin-top:11px; border:1px solid var(--line); background:var(--card); border-radius:12px; padding:12px 14px; outline:none; text-transform:uppercase}
.code-row{display:flex; align-items:center; gap:10px; padding:12px 18px; border-bottom:1px solid var(--line2); font-size:13px; flex-wrap:wrap}
.code-row:last-child{border-bottom:none}
.code-row code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-weight:700; font-size:14px; letter-spacing:.04em}
.code-row small{color:var(--ink3)}
/* 授权码批量操作：工具栏 / 状态筛选 / 勾选条 / 导入框 */
.code-tools{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px}
.code-selbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:0 2px 10px; font-size:13px; color:var(--ink2)}
.code-selbar .sp{flex:1}
.code-check{width:20px; height:20px; accent-color:var(--blue); flex:none; margin:0; cursor:pointer}
.code-selall{display:inline-flex; align-items:center; gap:7px; cursor:pointer; font-weight:600; color:var(--ink)}
.code-import{width:100%; border:1px solid var(--line); background:var(--card); border-radius:12px; padding:12px 14px; outline:none; font-size:13px; line-height:1.7; min-height:132px; resize:vertical; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; margin-bottom:18px; color:var(--ink); text-transform:uppercase}
.code-import:focus{border-color:var(--blue)}
.code-empty{padding:26px 18px; text-align:center; color:var(--ink3); font-size:14px}
.set-row textarea{flex:1; min-width:180px; border:1px solid var(--line); border-radius:10px; padding:9px 11px; background:var(--card); resize:vertical; min-height:56px; line-height:1.5}
.set-row select{border:1px solid var(--line); border-radius:10px; padding:8px 10px; background:var(--card)}
/* 自定义发件邮箱账号：邮箱验证开启后展开的整组 SMTP 设置（服务器 / 端口 / 加密 / 账号 / 密码授权码），
   不是单个邮箱输入框——发件要靠这台 SMTP 服务器用这个账号登录后才能发出 */
.mail-group{border-bottom:1px solid var(--line2); background:var(--card2)}
.mail-group .mg-head{display:flex; align-items:center; gap:10px; padding:14px 20px 2px}
.mail-group .mg-head b{font-size:14px}
.mail-group .mg-head small{color:var(--ink3); font-size:12px}
.mail-group .set-row{border-bottom:1px solid var(--line2)}
.mail-group .set-row:last-child{border-bottom:none}
.mail-group .set-row input[type=text],.mail-group .set-row input[type=password],.mail-group .set-row input[type=email]{width:200px; border:1px solid var(--line); border-radius:10px; padding:8px 10px; background:var(--card)}
.mail-group .set-row input[type=number]{width:90px}
.mail-pwd-wrap{display:flex; align-items:center; gap:6px}
.mail-pwd-wrap .pwd-eye{flex:none; min-height:34px; padding:6px 11px; font-size:12px}
.mail-note{padding:10px 20px 14px; font-size:12px; color:var(--ink3); line-height:1.6}
@media (max-width:640px){
  .mail-group .set-row{flex-wrap:wrap}
  .mail-group .set-row input[type=text],.mail-group .set-row input[type=password],.mail-group .set-row input[type=email]{width:100%}
  .mail-pwd-wrap{width:100%}
  .mail-pwd-wrap input{flex:1; min-width:0}
}

  .expand-card,.confirm-card{animation:none}

  .shuffle-fab svg{transition:none}
}

    if(it.leaving && it.y + it.d < -16){ removeItem(it); topUp(); continue; }
    if(!it.entering && !it.leaving){
      if(it.x < 2) it.x=2; if(it.x > w-it.d-2) it.x=w-it.d-2;
      if(it.y < 60) it.y=60; if(it.y > h-it.d-100) it.y=h-it.d-100;
    }
    it.el.style.transform = 'translate('+it.x+'px,'+it.y+'px)';
  }
  W.raf = requestAnimationFrame(tick);
}
function startWorld(){
  if(W.running) return; W.running = true; W.last = performance.now();
  W.raf = requestAnimationFrame(tick);
}
function attachBubblePointer(item){
  const el = item.el; let sx=0, sy=0, moved=0, lastX=0, lastT=0;
  el.addEventListener('pointerdown', e=>{
    e.preventDefault(); el.setPointerCapture(e.pointerId);
    item.drag = true; moved = 0; sx=e.clientX-item.x; sy=e.clientY-item.y; lastX=e.clientX; lastT=performance.now();
    el.classList.add('dragging');
    if(item.leaving){ item.leaving=false; item.entering=false; item.vy=(Math.random()-0.5)*7; el.classList.remove('leaving'); }
  });
  el.addEventListener('pointermove', e=>{
    if(!item.drag) return;
    const nx = e.clientX-sx, ny = e.clientY-sy;
    moved += Math.abs(e.movementX||0)+Math.abs(e.movementY||0);
    const now = performance.now(), dtm = Math.max(1, now-lastT);
    item.vx = (e.clientX-lastX)/dtm*1000*0.35; lastX=e.clientX; lastT=now;
    item.x = nx; item.y = ny;
    el.style.transform = 'translate('+item.x+'px,'+item.y+'px)';
    /* 拖动挤压周围 */
    for(const o of W.list){ if(o===item||o.drag) continue;
      const dx=(o.x+o.d/2)-(item.x+item.d/2), dy=(o.y+o.d/2)-(item.y+item.d/2);
      const dist=Math.hypot(dx,dy), min=(o.d+item.d)/2+16;
      if(dist>0.01 && dist<min){ o.x += dx/dist*3.2; o.y += dy/dist*3.2; }
    }
  });
  const up = ()=>{
    if(!item.drag) return; item.drag=false; el.classList.remove('dragging');
    item.vx = Math.max(-26, Math.min(26, item.vx)); item.vy = (Math.random()-0.5)*8;
    if(moved < 8) openExpand(item.b, 'world');
  };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
}
function popBubble(item){
  const b = item.b, x = item.x, y = item.y, d = item.d;
  W.list = W.list.filter(x=>x!==item); /* 只移出漂浮循环，元素留给爆点动画独占（与小样 burstBubble 同理） */
  popSound();
  const stage = $('stage');
  const fx = h('div','burst-fx');
  fx.style.left = (x + d/2)+'px'; fx.style.top = (y + d/2)+'px';
  const ring = h('span','burst-ring');
  ring.style.setProperty('--rs', String(Math.max(5, Math.round(d/11))));
  fx.appendChild(ring);
  const BURST_COLORS = { text:'rgba(125,211,252,.85)', image:'rgba(110,231,183,.85)', audio:'rgba(253,186,116,.88)', video:'rgba(196,181,253,.88)' };
  const col = BURST_COLORS[b.type] || BURST_COLORS.text;
  const n = 14 + Math.floor(Math.random()*5);
  for(let i=0;i<n;i++){
    const dot = h('span','burst-dot');
    const ang = (i/n)*Math.PI*2 + Math.random()*0.5;
    const dist = d*(0.42 + Math.random()*0.55);
    const sz = 4 + Math.random()*8;
    dot.style.width = sz+'px'; dot.style.height = sz+'px';
    dot.style.margin = (-sz/2)+'px 0 0 '+(-sz/2)+'px';
    dot.style.setProperty('--c', col);
    dot.style.setProperty('--dx', Math.round(Math.cos(ang)*dist)+'px');
    dot.style.setProperty('--dy', Math.round(Math.sin(ang)*dist - d*0.12)+'px');
    dot.style.animationDelay = (Math.random()*0.04)+'s';
    fx.appendChild(dot);
  }
  stage.appendChild(fx);
  setTimeout(()=>{ if(fx.parentNode) fx.parentNode.removeChild(fx); }, 620);
  const el = item.el;
  el.classList.add('popping');
  el.style.transition = 'transform .34s ease-out, opacity .34s ease-out';
  requestAnimationFrame(()=>{
    el.style.transform = 'translate('+x+'px,'+y+'px) scale(1.45)';
    el.style.opacity = '0';
  });
  setTimeout(()=>{ if(el.parentNode) el.parentNode.removeChild(el); }, 380);
  setTimeout(()=>{ topUp(); }, 430);
}
function swapBatch(){
  const cur = W.list.filter(it=>!it.leaving);
  cur.forEach((it,i)=>{ setTimeout(()=>{ it.leaving=true; it.entering=false; it.el.classList.add('leaving'); }, i*60); });
  const need = Math.max(0, W.target - 0);
  setTimeout(()=>{ topUp(); }, 500);
  blipSounds();
}
function applyFilter(f){
  S.filter = f;
  document.querySelectorAll('#worldFilter .chip').forEach(c=>c.classList.toggle('on', c.dataset.f===f));
  const pool = visiblePool();
  const keep = W.list.filter(it=>it.b.type===f || f==='all');
  if(f!=='all' && pool.length < W.target){
    /* 池子不够：只保留同类型在场，不换场 */
    W.list.filter(it=>it.b.type!==f).forEach(it=>{ it.leaving=true; it.entering=false; it.el.classList.add('leaving'); });
    return;
  }
  W.list.filter(it=>!keep.includes(it)).forEach(it=>{ it.leaving=true; it.entering=false; it.el.classList.add('leaving'); });
  setTimeout(()=>topUp(), 350);
}
async function loadPool(){
  const { data, error } = await sb.from('bubbles').select('*').is('deleted_at', null).eq('status','visible').is('archived_at', null).order('created_at',{ascending:false}).limit(600);

function setWorldTarget(){

}
/* ---- 音效（Web Audio 合成，无音频文件） ---- */
let AC=null;
function audioCtx(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state==='suspended') AC.resume(); return AC; }
function blip(freq, t0, dur, gain){
  const ac = audioCtx(); if(!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type='sine'; o.frequency.setValueAtTime(freq, ac.currentTime+t0);
  o.frequency.exponentialRampToValueAtTime(freq*1.7, ac.currentTime+t0+dur);
  g.gain.setValueAtTime(0.0001, ac.currentTime+t0);
  g.gain.exponentialRampToValueAtTime(gain, ac.currentTime+t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+t0+dur);
  o.connect(g).connect(ac.destination); o.start(ac.currentTime+t0); o.stop(ac.currentTime+t0+dur+0.05);
}
function blipSounds(){ for(let i=0;i<6;i++) blip(280+i*70+Math.random()*40, i*0.07, 0.16, 0.05); }
function popSound(){ blip(520, 0, 0.14, 0.07); }

    card.appendChild(wrap);

  }
  /* 点赞 / 踩 / 举报 */
  const votes = h('div','vote-row');
  const mkVote = (body, label)=>{
    const btn = h('button','vote-btn'); btn.innerHTML = vIcon(body, 13);
    btn.appendChild(document.createTextNode(' '+label+' '));
    const n = h('span','n','0'); btn.appendChild(n);
    votes.appendChild(btn); return { btn, n };
  };
  const like = mkVote(VPATH.thumbsUp,'点赞'); like.n.textContent = String(b.like_count||0);
  const dis = mkVote(VPATH.footprints,'踩'); dis.n.textContent = String(b.dislike_count||0);
  let rep;

function needLogin(){ if(!S.user){ toast('先登录才能操作'); showPage('mine'); renderAuth(); return true; } return false; }
async function doReaction(b, type){
  if(needLogin()) return;
  if(b.user_id===S.user.id){ toast('不能给自己的泡泡投票'); return; }
  const { error } = await sb.rpc('toggle_reaction',{ p_bubble:b.id, p_type:type });
  if(error){ toast(errText(error)); return; }
  const prev = S.myReactions.get(b.id);
  if(prev===type){ S.myReactions.delete(b.id); if(type==='like') b.like_count=Math.max(0,(b.like_count||0)-1); else b.dislike_count=Math.max(0,(b.dislike_count||0)-1); }
  else{
    if(prev==='like') b.like_count=Math.max(0,(b.like_count||0)-1);
    if(prev==='dislike') b.dislike_count=Math.max(0,(b.dislike_count||0)-1);
    S.myReactions.set(b.id, type);
    if(type==='like') b.like_count=(b.like_count||0)+1; else b.dislike_count=(b.dislike_count||0)+1;
  }
}

function confirmDeleteBubble(b, inExpand){

/* ---------- 微信式语音条 ---------- */
function fmtSec(s){ s=Math.max(0,Math.ceil(s||0)); return s+"''"; }
function buildVoiceBar(url, durEl){
  const bar = h('div','voice-bar');
  bar.setAttribute('role','slider'); bar.setAttribute('aria-label','语音进度条');
  const fill = h('div','vb-fill');
  const rowHtml = vIcon(VPATH.voice, 25) + '<span class="vb-sp"></span>';
  const row1 = h('div','vb-row'); row1.innerHTML = rowHtml; const t1 = h('span','vb-time','--:--'); row1.appendChild(t1);
  const row2 = h('div','vb-row vb-top'); row2.setAttribute('aria-hidden','true'); row2.innerHTML = rowHtml; const t2 = h('span','vb-time','--:--'); row2.appendChild(t2);
  const btn = h('span','vb-btn');
  const icoPlay = h('span','ico-play'); icoPlay.innerHTML = vIcon('<polygon points="6 3 20 12 6 21 6 3"/>', 16, '#fff', true);
  const icoPause = h('span','ico-pause'); icoPause.innerHTML = vIcon('<rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/>', 16, '#fff');
  btn.append(icoPlay, icoPause);
  bar.append(fill, row1, row2, btn);
  const audio = new Audio(); audio.preload='metadata'; audio.src=url; audio.crossOrigin='anonymous';
  EX.audio = audio;
  const st = { playing:false, scrubbing:false, dur:0, scrubPos:0 };
  EX.voice = st;
  const fmtMS = sec=>{ sec=Math.max(0,Math.ceil(sec||0)); return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'); };
  const paint = ()=>{
    const pos = st.scrubbing ? st.scrubPos : audio.currentTime;
    const pct = st.dur ? Math.min(100, pos/st.dur*100) : 0;
    bar.style.setProperty('--p', pct+'%');
    const remain = fmtMS(st.dur ? st.dur-pos : 0);
    t1.textContent = remain; t2.textContent = remain;
    bar.setAttribute('aria-valuenow', String(Math.round(pct)));
  };
  audio.addEventListener('loadedmetadata', ()=>{ st.dur = audio.duration||0; if(durEl) durEl.textContent = '共 '+fmtMS(st.dur); paint(); });
  audio.addEventListener('timeupdate', ()=>{ if(!st.scrubbing) paint(); });
  audio.addEventListener('ended', ()=>{ st.playing=false; bar.classList.remove('is-playing'); paint(); });
  audio.addEventListener('error', ()=>{ t1.textContent='已失效'; t2.textContent='已失效'; if(durEl) durEl.textContent='音频链接已失效'; });
  const toggle = ()=>{
    if(st.playing){ audio.pause(); st.playing=false; bar.classList.remove('is-playing'); }
    else{ audio.play().then(()=>{ st.playing=true; bar.classList.add('is-playing'); }).catch(()=>toast('音频播放失败')); }
  };
  let startX=0, startPos=0, movedPx=0;
  bar.addEventListener('pointerdown', e=>{
    e.preventDefault(); bar.setPointerCapture(e.pointerId);
    st.scrubbing = true; movedPx=0; startX=e.clientX; startPos=audio.currentTime||0; st.scrubPos=startPos;
  });
  bar.addEventListener('pointermove', e=>{
    if(!st.scrubbing || !st.dur) return;
    movedPx = Math.max(movedPx, Math.abs(e.clientX-startX));
    const rect = bar.getBoundingClientRect();
    st.scrubPos = Math.max(0, Math.min(st.dur, startPos + (e.clientX-startX)/rect.width*st.dur));
    paint();
  });
  bar.addEventListener('pointerup', ()=>{
    if(!st.scrubbing) return; st.scrubbing=false;
    if(movedPx > 8){ try{ audio.currentTime = st.scrubPos; }catch(e){} paint(); }
    else toggle();
  });
  return bar;
}

/* ---------- Video.js 10（videojs.org 新款，远程组件） ---------- */
let vjs10Loading = null;
function loadVjs10(){
  if(window.customElements && customElements.get('video-player')) return Promise.resolve(true);
  if(vjs10Loading) return vjs10Loading;
  vjs10Loading = new Promise(resolve=>{
    const css = document.createElement('link'); css.rel='stylesheet';
    css.href='https://cdn.jsdelivr.net/npm/@videojs/cdn@10/dist/video.css';
    document.head.appendChild(css);
    const s1 = document.createElement('script'); s1.type='module';
    s1.src='https://cdn.jsdelivr.net/npm/@videojs/cdn@10/dist/video.js';
    const s2 = document.createElement('script'); s2.type='module';
    s2.src='https://cdn.jsdelivr.net/npm/@videojs/cdn@10/dist/media/hlsjs-video.js';
    let done=false; const fin=ok=>{ if(!done){ done=true; resolve(ok); } };
    s2.onload=()=>setTimeout(()=>fin(true),60); s2.onerror=()=>fin(false); s1.onerror=()=>fin(false);
    document.head.append(s1, s2);
    setTimeout(()=>fin(!!(window.customElements && customElements.get('video-player'))), 6000);
  });
  return vjs10Loading;
}
async function buildVideoPlayer(wrap, url){
  if(!isHttps(url)){
    const box = h('div','video-box');
    const vp = h('span','v-play'); vp.innerHTML = vIcon('<polygon points="6 3 20 12 6 21 6 3"/>', 26, '#fff', true);
    box.append(vp, h('small',null,'视频链接已失效'));
    wrap.replaceWith(box); return;
  }
  const ok = await loadVjs10().catch(()=>false);
  if(!document.body.contains(wrap)) return;
  if(ok){
    const isHls = /\.m3u8($|\?)/i.test(url);
    const player = document.createElement('video-player');
    const skin = document.createElement('video-skin');
    const media = document.createElement(isHls ? 'hlsjs-video' : 'video');
    media.setAttribute('slot','media'); media.setAttribute('src', url);
    media.setAttribute('playsinline',''); media.setAttribute('crossorigin','anonymous');
    skin.appendChild(media); player.appendChild(skin);
    wrap.appendChild(player); EX.vjsEl = player;
    media.addEventListener('error', ()=>{ wrap.innerHTML=''; wrap.appendChild(h('div','media-file-line','视频链接已失效')); }, { once:true });
  } else {
    const v = h('video','expand-video'); v.src=url; v.controls=true; v.playsInline=true; v.setAttribute('playsinline','');
    v.addEventListener('error', ()=>{ wrap.innerHTML=''; wrap.appendChild(h('div','media-file-line','视频链接已失效')); }, { once:true });
    wrap.appendChild(v); EX.vjsEl = v;
  }
}

/* 面板下滑关闭：横杠 + 内容区滚到顶后下滑 */
(function(){
  const sheet = $('pubSheet'); let startY=null, fromContent=false;
  const onDown = (y, content)=>{ startY=y; fromContent=content; sheet.classList.add('dragging'); };
  const onMove = y=>{
    if(startY===null) return;
    const dy = y-startY;
    if(dy>0 && (!fromContent || sheet.scrollTop<=0)) sheet.style.transform='translate(-50%,'+dy+'px)';
  };
  const onUp = y=>{
    if(startY===null) return;
    const dy = y-startY; startY=null; sheet.style.transform=''; sheet.classList.remove('dragging');
    if(dy>80 && (!fromContent || sheet.scrollTop<=0)) closePublish();
  };
  $('pubGrab').addEventListener('pointerdown', e=>onDown(e.clientY,false));
  sheet.addEventListener('pointerdown', e=>{
    if(e.target.closest('input,textarea,button,select,label.switch,.cost-opt,.seg')) return;
    onDown(e.clientY,true);
  });
  addEventListener('pointermove', e=>onMove(e.clientY));
  addEventListener('pointerup', e=>onUp(e.clientY));
})();
function buildPublishForm(){

    };

function syncPubForm(){
  const form = $('pubForm'); if(!form) return; form.innerHTML='';
  const t = PUB.type;

async function uploadMedia(file, t){
  const maxMB = t==='image' ? 5 : 10;
  if(file.size > maxMB*1024*1024){ toast('文件不能超过 '+maxMB+'MB'); return; }
  PUB.uploading = true; toast('上传中…');
  try{
    const { data } = await sb.auth.getSession();
    const jwt = data && data.session ? data.session.access_token : '';
    const dataUrl = await new Promise((res, rej)=>{ const fr = new FileReader(); fr.onload = ()=>res(fr.result); fr.onerror = rej; fr.readAsDataURL(file); });
    const data_base64 = String(dataUrl).split(',')[1] || '';
    const resp = await fetch(MEDIA_API+'/upload', { method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+jwt }, body: JSON.stringify({ kind:t, filename:file.name, mime:file.type, data_base64 }) });
    const json = await resp.json().catch(()=>({}));
    if(!resp.ok) throw new Error(json.message || json.error || '上传失败');
    PUB.fileUrl = json.url || ''; PUB.filePath = json.path || '';
    const ui = $('upInfo');
    if(ui){
      ui.hidden = false;
      const mr = $('mediaRow'); if(mr) mr.style.display='none';
      const ub = $('upName'); if(ub) ub.textContent = file.name;
      const um = $('upMeta'); if(um) um.textContent = (file.size/1024).toFixed(0)+' KB · 已上传';
      const th = $('upThumb');
      if(th){ if(t==='image'){ th.src = dataUrl; th.style.display=''; } else th.style.display='none'; }
    }
    const urlIn = $('mediaInput'); if(urlIn) urlIn.value='';
    toast('上传完成');
  }catch(e){ toast(errText(e)); }
  PUB.uploading = false;
}
async function submitPublish(codeIn){
  if(PUB.uploading){ toast('文件还在上传中'); return; }
  const t = PUB.type;
  const textEl = $('contentInput');
  const content = textEl ? textEl.value.trim() : '';
  let mediaUrl = '', mediaPath = '';
  if(t!=='text'){
    const urlIn = $('mediaInput'); const link = urlIn ? urlIn.value.trim() : '';
    if(PUB.fileUrl){ mediaUrl = PUB.fileUrl; mediaPath = PUB.filePath; }
    else if(link){ mediaUrl = link; }
    else { toast('请上传文件或粘贴链接'); return; }
    if(!isHttps(mediaUrl)){ toast('只支持 https 链接'); return; }
  }
  if(t==='text' && !content){ toast('先写点内容'); return; }
  if(t==='text' && content.length>300){ toast('文字最多 300 字'); return; }
  if(t!=='text' && content.length>150){ toast('说明最多 150 字'); return; }
  const permCode = PUB.permanent ? (codeIn.value||'').trim() : '';
  if(PUB.permanent && !permCode){ toast('请输入授权码'); return; }
  if(!PUB.permanent && S.profile && S.profile.points < PUB.cost){ toast('积分不足，还差 '+(PUB.cost - S.profile.points)+' 分，去签到吧'); return; }
  const { data, error } = await sb.rpc('publish_bubble', {
    p_type:t, p_content:content, p_media_url:mediaUrl||null, p_media_path:mediaPath||null,
    p_cost:PUB.cost, p_perm_code: permCode||null
  });
  if(error){ toast(errText(error)); return; }
  closePublish(); toast('发布成功');
  await Promise.all([loadProfile(), loadPool()]);
  const nb = data && (data.id ? S.poolById.get(data.id) : (typeof data==='string' ? S.poolById.get(data) : null));
  setWorldTarget(); showWorld();
  if(nb){ const it = spawnBubble(nb, 0); if(it){ it.y = stageSize().h*0.4; it.entering=false; it.el.classList.add('fresh'); } }
  else topUp();
}

function renderAuth(){
  showPage('mine');

  const card = h('div','card auth-card');
  const seg = h('div','seg'); seg.style.marginBottom='20px';
  const tIn = h('button','on','登录'), tUp = h('button','','注册');
  seg.append(tIn, tUp); card.appendChild(seg);
  const title = h('h3',null,'欢迎回来'); card.appendChild(title);
  const desc = h('p',null,'登录后可以签到、发泡泡、管理你的内容。'); card.appendChild(desc);
  const form = h('div'); card.appendChild(form);
  const note = h('div','verify-note'); note.style.display='none';
  note.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex:none; margin-top:2px"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>';
  const noteTx = h('span'); note.appendChild(noteTx); card.appendChild(note);
  let mode = 'in';
  const build = ()=>{
    form.innerHTML='';
    tIn.classList.toggle('on', mode==='in'); tUp.classList.toggle('on', mode==='up');
    title.textContent = mode==='in' ? '欢迎回来' : '加入泡泡世界';
    desc.textContent = mode==='in' ? '登录后可以签到、发泡泡、管理你的内容。' : '注册后可以签到、发泡泡、管理你的内容。';
    note.style.display = mode==='up' ? '' : 'none';
    if(mode==='up'){
      noteTx.innerHTML = '';
      noteTx.append(document.createTextNode('注册成功赠送 '), h('b',null,setGet('newbie_points',5)+' 积分'), document.createTextNode('新手礼。'));
      if(setGet('email_verify_required', true)) noteTx.append(document.createTextNode('当前开启'), h('b',null,'邮箱验证'), document.createTextNode('：验证邮件发出后，点邮件里的链接完成验证，才能发布和签到（此开关管理员可控）。'));
      const f1 = h('div','field'); f1.appendChild(h('label',null,'昵称'));
      const nick = h('input'); nick.type='text'; nick.id='authNick'; nick.maxLength=6; nick.placeholder='给大家认识的名字'; f1.appendChild(nick); form.appendChild(f1);
    }
    const f2 = h('div','field'); f2.appendChild(h('label',null,'邮箱'));
    const em = h('input'); em.type='text'; em.setAttribute('inputmode','email'); em.id='authEmail'; em.placeholder='you@example.com'; f2.appendChild(em); form.appendChild(f2);
    const f3 = h('div','field'); f3.appendChild(h('label',null,'密码'));
    const pw = h('input'); pw.type='password'; pw.id='authPw'; pw.placeholder='至少 6 位'; f3.appendChild(pw); form.appendChild(f3);
    const btn = h('button','btn btn-blue', mode==='in' ? '登录' : '注册');
    btn.style.cssText='width:100%; min-height:48px; font-size:15px';
    btn.onclick = async ()=>{
      const email = em.value.trim(), pass = pw.value;
      if(!email || !pass){ toast('邮箱和密码都要填'); return; }
      btn.disabled = true;
      if(mode==='in'){
        const { error } = await sb.auth.signInWithPassword({ email, password: pass });
        btn.disabled=false;
        if(error){ toast(errText(error)); return; }
        toast('登录成功'); await afterAuth();
      } else {
        const nickEl = $('authNick'); const nick = nickEl ? nickEl.value.trim() : '';
        if(!nick){ toast('先填昵称'); btn.disabled=false; return; }
        if(nick.length>6){ toast('昵称最多 6 个字'); btn.disabled=false; return; }
        const { data, error } = await sb.auth.signUp({ email, password: pass, options:{ data:{ nickname: nick } } });
        btn.disabled=false;
        if(error){ toast(errText(error)); return; }
        if(!data.session){ toast('注册成功，请先去邮箱完成验证，再回来登录'); mode='in'; build(); return; }
        toast('注册成功，新手积分已到账'); await afterAuth();
      }
    };
    form.appendChild(btn);
  };
  tIn.onclick=()=>{ mode='in'; build(); }; tUp.onclick=()=>{ mode='up'; build(); };
  build();
  wrap.appendChild(card);
  wrap.appendChild(copyrightEl());
}

  S.user = data && data.session ? data.session.user : null;

function listRow(b, subLines, opts){

function bubbleTags(b, extra){
  const tags = [];
  const a = S.authors.get(b.user_id);
  if(a && a.role==='admin') tags.push(tagEl('admin-tag','管理员'));
  if(b.is_permanent) tags.push(tagEl('perm-tag','∞ 永久'));
  if(b.status==='hidden') tags.push(tagEl('hidden-tag','已下架'));

  if(extra) tags.push(extra);
  return tags;

    sel.onchange=()=>fn(sel.value); bar.appendChild(sel); return sel;
  };
  mkSel(ABF.date, [['all','全部日期'],['today','今天'],['7d','近 7 天'],['30d','近 30 天']], v=>{ ABF.date=v; renderAdminBubbles(); });
  mkSel(ABF.type, [['all','全部类型'],['text','文字'],['image','图片'],['audio','音频'],['video','视频']], v=>{ ABF.type=v; renderAdminBubbles(); });
  mkSel(ABF.cost, [['all','全部档位'],['5','5'],['10','10'],['20','20'],['50','50'],['100','100']], v=>{ ABF.cost=v; renderAdminBubbles(); });
  const kw = h('input'); kw.type='text'; kw.placeholder='搜泡泡内容关键词…'; kw.value=ABF.kw;
  kw.onchange=()=>{ ABF.kw=kw.value.trim(); renderAdminBubbles(); };
  bar.appendChild(kw);
  const reset = h('button','btn btn-ghost','重置'); reset.style.cssText='min-height:38px; padding:6px 16px';
  reset.onclick=()=>{ ABF = { date:'all', type:'all', cost:'all', status:'all', kw:'' }; renderAdminBubbles(); };
  bar.appendChild(reset);
  panel.appendChild(bar);
  const table = h('div','table-card'); panel.appendChild(table);

  let q = sb.from('bubbles').select('*').order('created_at',{ascending:false}).limit(100);
  if(ABF.status==='deleted') q = q.not('deleted_at','is',null);
  else if(ABF.status==='visible'||ABF.status==='hidden'){ q = q.is('deleted_at',null).eq('status', ABF.status); }
  if(ABF.type!=='all') q = q.eq('type', ABF.type);
  if(ABF.cost!=='all') q = q.eq('cost', Number(ABF.cost));
  if(ABF.kw) q = q.ilike('content', '%'+ABF.kw.replace(/[%_]/g,'')+'%');
  if(ABF.date!=='all'){
    const days = ABF.date==='today' ? 0 : ABF.date==='7d' ? 7 : 30;
    const since = new Date(Date.now() - days*86400*1000); if(days===0) since.setHours(0,0,0,0);
    q = q.gte('created_at', since.toISOString());
  }
  const { data, error } = await q;
  if(error){ table.appendChild(emptyNoteEl(errText(error))); return; }
  await authorsFor(data||[]);

    if(a.role==='admin') tags.push(tagEl('admin-tag','管理员'));
    if(b.is_permanent) tags.push(tagEl('perm-tag','∞ 永久'));
    if((b.like_count||0)>=8 && a.role!=='admin' && !b.is_permanent) tags.push(tagEl('like-tag','高赞'));
    if((b.report_count||0) >= thr) tags.push(tagEl('hidden-tag','已隐藏'));
    else if((b.report_count||0) > 0) tags.push(tagEl('report-tag','举报 '+b.report_count));
    const status = b.deleted_at ? '已删除' : (b.report_count||0) >= thr ? '已隐藏' : b.status==='hidden' ? '已下架' : '展示中';
    table.appendChild(trowEl(miniB(b,38,16), bubbleTitle(b), tags,
      [document.createTextNode((a.nickname||'用户')+' · '+TYPE_META[b.type].name+' · '+b.cost+' 积分 · '+fmtTimeShort(b.created_at)+' · '+status)],
      ()=>renderAdminBubbleDetail(b), false));
  });

  const clearAll = h('button','mini-btn red','一键清空'); clearAll.onclick=()=>confirmBox('清空所有授权码？','全部授权码都会被删除，不可恢复。','清空',true, async ()=>{
    const { error } = await sb.rpc('admin_clear_codes');

  });
  tools.append(gen, imp, exp, clearAll); panel.appendChild(tools);
  const chips = h('div','filter-bar'); chips.style.marginBottom='10px';
  [['all','全部'],['unused','未使用'],['used','已使用'],['void','已作废']].forEach(([v,t])=>{
    const c = h('button','chip'+(CODEF===v?' on':''), t);
    c.onclick=()=>{ CODEF=v; renderAdminCodes(); };
    chips.appendChild(c);
  });
  panel.appendChild(chips);
  const selbar = h('div','code-selbar');
  const selAllLabel = h('label','code-selall');
  const selAll = h('input','code-check'); selAll.type='checkbox';
  selAllLabel.append(selAll, document.createTextNode('全选'));
  const selInfo = h('span',null,'已选 0 条');
  const delSel = h('button','mini-btn red','批量删除');
  selbar.append(selAllLabel, selInfo, h('span','sp'), delSel);
  panel.appendChild(selbar);
  const listCard = h('div','card'); listCard.style.cssText='overflow:hidden; margin-bottom:12px';
  panel.appendChild(listCard);
  wrap.appendChild(panel); wrap.appendChild(copyrightEl());
  let q = sb.from('auth_codes').select('*').order('created_at',{ascending:false}).limit(500);
  if(CODEF!=='all') q = q.eq('status', CODEF);
  const { data, error } = await q;
  if(error){ listCard.appendChild(emptyNoteEl(errText(error))); return; }
  const rows = data||[];
  const syncSel = ()=>{
    selInfo.textContent = '已选 '+CODESEL.size+' 条';
    selAll.checked = rows.length>0 && rows.every(c=>CODESEL.has(c.id));
  };
  selAll.onchange=()=>{

  delSel.onclick=()=>{
    if(!CODESEL.size){ toast('先勾选要删除的授权码'); return; }
    confirmBox('批量删除？','将删除勾选的 '+CODESEL.size+' 条授权码。','删除',true, async ()=>{
      const { error } = await sb.rpc('admin_delete_codes',{ p_ids:[...CODESEL] });
      if(error){ toast(errText(error)); return; }
      CODESEL.clear(); toast('已删除'); renderAdminCodes();
    });
  };
  if(!rows.length) listCard.appendChild(h('div','code-empty', CODEF==='all' ? '还没有任何授权码，点「批量生成」或「批量导入」添加' : '这个状态下没有授权码'));
  rows.forEach(c=>{
    const r = h('div','code-row');
    const chk = h('input','code-check sel'); chk.type='checkbox'; chk.checked = CODESEL.has(c.id);
    chk.setAttribute('aria-label','勾选授权码 '+c.code);
    chk.onchange=()=>{ chk.checked ? CODESEL.add(c.id) : CODESEL.delete(c.id); syncSel(); };
    const code = document.createElement('code'); code.textContent = c.code;
    const tag = c.status==='used' ? tagEl('','已使用','background:rgba(120,120,128,.16); color:var(--ink2)')
      : c.status==='void' ? tagEl('','已作废','background:rgba(250,36,60,.12); color:var(--accent)')
      : tagEl('','未使用','background:rgba(52,199,89,.14); color:var(--green)');
    const info = c.status==='used' ? ('使用者 ID '+(c.used_by_user_no==null?'—':c.used_by_user_no)+' · '+(c.used_at?fmtDate(c.used_at):''))
      : c.status==='void' ? ('生成于 '+fmtDate(c.created_at)+' · 已作废')
      : ('生成于 '+fmtDate(c.created_at));
    const sm = h('small',null, info); sm.style.cssText='flex:1; min-width:140px';
    r.append(chk, code, tag, sm);
    if(c.status==='unused'){
      const cp = h('button','mini-btn','复制');
      cp.onclick=()=>{ if(navigator.clipboard) navigator.clipboard.writeText(c.code).then(()=>toast('授权码已复制：'+c.code)); };
      r.appendChild(cp);
    }
    const del = h('button','mini-btn red','删除');
    del.onclick=()=>confirmBox('删除这个授权码？','授权码 '+c.code+' 将被删除。','删除',true, async ()=>{
      const { error } = await sb.rpc('admin_delete_codes',{ p_ids:[c.id] });
      if(error){ toast(errText(error)); return; }
      CODESEL.delete(c.id); toast('授权码已删除：'+c.code); renderAdminCodes();
    });
    r.appendChild(del);
    listCard.appendChild(r);
  });
  CODESEL.forEach(id=>{ if(!rows.some(c=>c.id===id) && CODEF==='all') CODESEL.delete(id); });
  syncSel();
}
function openGenCodes(){

    b.onclick=()=>{ count=v; custom.value=''; opts.querySelectorAll('.gift-opt').forEach(x=>x.classList.remove('on')); b.classList.add('on'); };

function openImportCodes(){
  const card = h('div','confirm-card');
  card.appendChild(h('h4',null,'批量导入授权码'));
  card.appendChild(h('p',null,'一行一个授权码，导入后都是未使用状态；已存在的码会自动跳过'));

  card.appendChild(ta);

  const ok = h('button','btn btn-blue','导入');

    closeModal();

async function exportCodes(){
  let rows;
  if(CODESEL.size){
    const { data } = await sb.from('auth_codes').select('code').in('id', [...CODESEL]);
    rows = data||[];
  } else {
    let q = sb.from('auth_codes').select('code').order('created_at',{ascending:false}).limit(2000);
    if(CODEF!=='all') q = q.eq('status', CODEF);
    const { data } = await q; rows = data||[];
  }
  if(!rows.length){ toast('没有可导出的授权码'); return; }
  const blob = new Blob([rows.map(r=>r.code).join('\n')], { type:'text/plain;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download='授权码.txt';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

<script>
/* ================= 顶栏与导航接线 ================= */
$('brandBtn').onclick = ()=>{ showWorld(); };
$('tabWorld').onclick = ()=>{ showWorld(); };

(function buildFilter(){
  const menu = $('filterMenu');
  const tools = $('worldFilter');
  [['all','全部'],['text','文字'],['image','图片'],['audio','音频'],['video','视频']].forEach(([f,t])=>{
    const b = h('button','chip'+(f==='all'?' on':''), t); b.dataset.f=f;
    b.onclick = e=>{ e.stopPropagation(); menu.classList.remove('open'); $('filterBtn').classList.remove('open'); $('filterBtn').setAttribute('aria-expanded','false'); applyFilter(f); };
    tools.appendChild(b);
  });
  $('filterBtn').onclick = e=>{
    e.stopPropagation();
    const open = menu.classList.toggle('open');
    $('filterBtn').classList.toggle('open', open);
    $('filterBtn').setAttribute('aria-expanded', open ? 'true' : 'false');
  };
  document.addEventListener('click', e=>{ if(menu.classList.contains('open') && !menu.contains(e.target)){ menu.classList.remove('open'); $('filterBtn').classList.remove('open'); $('filterBtn').setAttribute('aria-expanded','false'); } });
})();
/* 禁双击 / 捏合缩放 */
document.addEventListener('gesturestart', e=>e.preventDefault());
let lastTouchEnd = 0;
document.addEventListener('touchend', e=>{ const now=Date.now(); if(now-lastTouchEnd<=300) e.preventDefault(); lastTouchEnd=now; }, { passive:false });
document.addEventListener('wheel', e=>{ if(e.ctrlKey) e.preventDefault(); }, { passive:false });

/* ================= 公告（已看记录带内容签名） ================= */
function showNotice(n, isPreview){
  const card = h('div','announce-card');
  const ico = h('div','a-ico'); ico.innerHTML = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>';
  card.append(ico, h('h4',null, n.title||'公告'), h('p',null, n.body||''));
  const btn = h('button','btn btn-blue','知道了');
  btn.onclick = ()=>{
    closeModal();
    if(!isPreview){
      const sig = hashStr((n.title||'')+'|'+(n.body||''));
      try{ localStorage.setItem('paopao_notice_seen', JSON.stringify({ sig, at: Date.now() })); }catch(e){}
    }
  };
  card.appendChild(btn);
  openModal(card);
  $('modalOverlay').classList.add('announce-mode');
}
function maybeShowNotice(){
  const s = S.settings||{};
  if(!s.notice_enabled || !s.notice_body) return;
  const sig = hashStr((s.notice_title||'')+'|'+(s.notice_body||''));
  let seen = null;
  try{ seen = JSON.parse(localStorage.getItem('paopao_notice_seen')||'null'); }catch(e){}
  const intervalMs = (Number(s.notice_interval_hours)||24)*3600*1000;
  if(seen && seen.sig===sig && (Date.now()-seen.at) < intervalMs) return;
  showNotice({ title:s.notice_title, body:s.notice_body }, false);
}

/* ================= 开屏与启动 ================= */

let bootHidden = false;
function hideBoot(){
  if(bootHidden) return; bootHidden = true;
  document.documentElement.classList.remove('booting');
  const b = $('boot'); if(!b) return;
  b.classList.add('done');
  setTimeout(()=>{ b.remove(); maybeShowNotice(); }, 550);
}
setTimeout(hideBoot, 3200);
async function deepLink(){
  const id = new URLSearchParams(location.search).get('b');
  if(!id) return;
  const { data } = await sb.from('bubbles').select('*').eq('id', id).single();
  if(!data || data.deleted_at || data.status!=='visible'){ toast('这个泡泡已不可见'); return; }
  await authorsFor([data]);
  S.poolById.set(data.id, data);
  openExpand(data, 'link');
}
async function init(){
  setWorldTarget();
  const { data } = await sb.auth.getSession();
  S.user = data && data.session ? data.session.user : null;
  await loadSettings();
  setWorldTarget();
  await Promise.all([loadProfile(), loadMyMarks(), loadPool()]);
  showWorld();
  topUp();
  deepLink();
  sb.auth.onAuthStateChange(async (evt, session)=>{
    S.user = session ? session.user : null;
    if(evt==='SIGNED_IN'){ await Promise.all([loadProfile(), loadMyMarks()]); }
    if(evt==='SIGNED_OUT'){ S.profile=null; S.myReactions.clear(); S.myFavorites.clear(); updatePointsCap(); }
  });
  addEventListener('resize', ()=>{ setWorldTarget(); });
}
init().catch(e=>{ toast(errText(e)); hideBoot(); });
</script>
</body>
</html>
