<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>泡泡世界</title>
<style>
:root{
  --bg:#EAF4FB; --ink:#1D1D1F; --ink2:rgba(29,29,31,.62); --ink3:rgba(29,29,31,.42);
  --card:#FFFFFF; --line:rgba(29,29,31,.09); --accent:#0284C7; --accent2:#38BDF8;
  --red:#FA243C; --orange1:#FDBA74; --orange2:#FB923C;
  --glass:rgba(255,255,255,.72); --shadow:0 12px 34px rgba(31,78,120,.14);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0B1520; --ink:#F5F7FA; --ink2:rgba(245,247,250,.66); --ink3:rgba(245,247,250,.44);
    --card:#16222E; --line:rgba(255,255,255,.12); --glass:rgba(18,30,42,.78); --shadow:0 12px 34px rgba(0,0,0,.45); }
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(180deg,#DFF1FD 0%,#EAF4FB 46%,#FDF3E3 100%);
  color:var(--ink); overflow:hidden; touch-action:manipulation;
  padding-top:calc(56px + var(--safe-t));
}
@media (prefers-color-scheme:dark){ body{background:linear-gradient(180deg,#0A141F 0%,#0B1520 55%,#141210 100%)} }
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--ink)}
svg.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.ic.sm{width:15px;height:15px}
svg.ic.lg{width:24px;height:24px}

/* ---------- 顶部悬浮胶囊 ---------- */
.top-caps{position:fixed;top:calc(10px + var(--safe-t));left:0;right:0;z-index:60;display:flex;justify-content:center;gap:8px;pointer-events:none}
.cap{pointer-events:auto;display:flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:999px;
  background:var(--glass);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);
  box-shadow:0 4px 16px rgba(31,78,120,.14);font-size:13px;font-weight:600;color:var(--ink)}
.cap .pts{color:var(--accent);font-weight:700}
.cap-btn{width:38px;padding:0;justify-content:center}
.cap-btn.on{color:var(--accent)}
.filter-menu{position:fixed;top:calc(54px + var(--safe-t));left:50%;transform:translateX(-50%);z-index:61;min-width:132px;
  background:var(--glass);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);
  border-radius:18px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column}
.filter-menu button{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;font-size:13.5px;text-align:left;color:var(--ink)}
.filter-menu button.on{background:rgba(56,189,248,.16);color:var(--accent);font-weight:600}

/* ---------- 世界舞台 ---------- */
#stage{position:fixed;inset:0;overflow:hidden;z-index:1}
.bub{position:absolute;border-radius:50%;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  border:1.5px solid rgba(255,255,255,.65);
  box-shadow:inset -10px -12px 22px rgba(255,255,255,.35), inset 8px 10px 18px rgba(255,255,255,.5), 0 8px 20px rgba(31,78,120,.16);
}
.bub::before{content:"";position:absolute;top:9%;left:14%;width:34%;height:22%;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(255,255,255,.85),rgba(255,255,255,0) 70%);transform:rotate(-18deg);pointer-events:none}
.bub .b-ico{opacity:.55;color:#fff;display:flex}
.bub .b-ico svg{width:20px;height:20px;stroke-width:1.8}
.bub .b-name{font-size:11px;line-height:1.15;color:rgba(255,255,255,.96);font-weight:600;max-width:86%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 4px rgba(0,60,110,.35)}
.bub .b-tag{font-size:8.5px;line-height:1;padding:2px 5px;border-radius:99px;background:rgba(255,255,255,.35);color:#fff;font-weight:700}
.bub.breathe-gold{animation:breatheG 3s ease-in-out infinite}
.bub.breathe-color{animation:breatheC 3s ease-in-out infinite}
@keyframes breatheG{0%,100%{filter:brightness(1)}50%{filter:brightness(1.22) saturate(1.15)}}
@keyframes breatheC{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18) hue-rotate(14deg)}}
.bub.popping{transition:transform .34s ease-in,opacity .34s ease-in;pointer-events:none}
.pop-ring{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.8);pointer-events:none;animation:ring .45s ease-out forwards}
@keyframes ring{from{transform:scale(.4);opacity:.9}to{transform:scale(1.5);opacity:0}}
.pop-drop{position:absolute;width:7px;height:7px;border-radius:50%;pointer-events:none;animation:drop .45s ease-out forwards}
@keyframes drop{from{transform:translate(0,0);opacity:1}to{transform:translate(var(--dx),var(--dy));opacity:0}}

/* ---------- 换一批 ---------- */
#refreshBtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + var(--safe-b));z-index:55;width:44px;height:44px;border-radius:50%;
  background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 6px 18px rgba(31,78,120,.2);
  display:flex;align-items:center;justify-content:center;color:var(--accent)}
#refreshBtn svg{transform:rotate(-90deg)}

/* ---------- 底部胶囊导航 ---------- */
#tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + var(--safe-b));z-index:60;
  display:flex;align-items:center;gap:2px;padding:7px;border-radius:999px;
  background:rgba(20,28,38,.48);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  box-shadow:0 14px 34px rgba(0,0,0,.28)}
#tabbar button{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:74px;padding:7px 10px;border-radius:999px;color:rgba(255,255,255,.75);font-size:10.5px}
#tabbar button.on{background:rgba(255,255,255,.22);color:#fff}
#tabbar .pub-btn{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;border-radius:50%;min-width:0;width:46px;height:46px;padding:0;justify-content:center}
#tabbar .pub-btn svg{width:24px;height:24px}

/* ---------- 开屏加载层 ---------- */
#boot{position:fixed;inset:0;z-index:200;background:linear-gradient(180deg,#DFF1FD,#FDF3E3);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:22vh;transition:opacity .5s}
@media (prefers-color-scheme:dark){#boot{background:linear-gradient(180deg,#0A141F,#141210)}}
#boot.gone{opacity:0;pointer-events:none}
#boot .boot-stage{position:absolute;inset:0;overflow:hidden}
.boot-bub{position:absolute;bottom:-70px;border-radius:50%;animation:bootUp linear infinite;box-shadow:inset -6px -8px 14px rgba(255,255,255,.4),inset 6px 8px 12px rgba(255,255,255,.5)}
@keyframes bootUp{from{transform:translateY(0)}to{transform:translateY(-112vh)}}
#boot p{position:relative;font-size:14px;color:var(--ink2);letter-spacing:.14em}

/* ---------- 通用页面（我的/管理员） ---------- */
.page{position:fixed;inset:0;z-index:40;overflow-y:auto;-webkit-overflow-scrolling:touch;background:transparent;padding:calc(64px + var(--safe-t)) 16px calc(120px + var(--safe-b))}
.page .wrap{max-width:640px;margin:0 auto}
.back-link{display:inline-flex;align-items:center;gap:4px;font-size:13.5px;color:var(--ink2);min-height:34px;margin-bottom:6px}
.back-link svg{width:16px;height:16px}
.card{background:var(--card);border-radius:20px;box-shadow:0 4px 18px rgba(31,78,120,.08);padding:16px;margin-bottom:12px}
.card h3{font-size:15px;margin-bottom:4px}
.card .sub{font-size:12.5px;color:var(--ink2)}
.menu-list{background:var(--card);border-radius:20px;box-shadow:0 4px 18px rgba(31,78,120,.08);overflow:hidden;margin-bottom:12px}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;padding:15px 16px;font-size:14.5px;text-align:left;color:var(--ink);border-bottom:1px solid var(--line)}
.menu-item:last-child{border-bottom:none}
.menu-item .mi-ico{color:var(--accent);display:flex}
.menu-item .mi-arrow{margin-left:auto;color:var(--ink3);display:flex}
.menu-item .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;min-width:19px;height:19px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.menu-item .badge + .mi-arrow{margin-left:8px}
.row-line{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row-line:last-child{border-bottom:none}
.row-line .grow{flex:1;min-width:0}
.row-line .t1{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-line .t2{font-size:12px;color:var(--ink2);margin-top:2px}
.pill-btn{padding:7px 13px;border-radius:999px;background:rgba(56,189,248,.14);color:var(--accent);font-size:12.5px;font-weight:600;white-space:nowrap}
.pill-btn.gray{background:rgba(120,130,140,.12);color:var(--ink2)}
.pill-btn.red{background:rgba(250,36,60,.1);color:var(--red)}
.pill-btn:disabled{opacity:.45}
.big-btn{width:100%;padding:13px;border-radius:14px;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;font-size:15px;font-weight:700}
.big-btn:disabled{opacity:.5}
.ghost-btn{width:100%;padding:12px;border-radius:14px;background:rgba(120,130,140,.1);color:var(--ink);font-size:14px;font-weight:600}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:transparent;outline:none}
.field textarea{resize:vertical;min-height:64px}
.field .hint{font-size:11.5px;color:var(--ink3);margin-top:5px}
.switch{position:relative;width:46px;height:27px;flex:none}
.switch input{opacity:0;width:100%;height:100%;position:absolute;margin:0;cursor:pointer;z-index:2}
.switch .tr{position:absolute;inset:0;border-radius:99px;background:rgba(120,130,140,.3);transition:.2s}
.switch .tr::after{content:"";position:absolute;top:2.5px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.switch input:checked + .tr{background:#34C759}
.switch input:checked + .tr::after{transform:translateX(18px)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:999px;background:rgba(120,130,140,.12);font-size:12.5px;color:var(--ink2)}
.chip.on{background:var(--accent);color:#fff;font-weight:600}
.empty-note{text-align:center;color:var(--ink3);font-size:13px;padding:26px 10px}
.copyright{text-align:center;font-size:11.5px;color:var(--ink3);padding:16px 0 4px;letter-spacing:.03em}
.avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:700;flex:none}
.admin-badge{font-size:10px;background:linear-gradient(135deg,#F59E0B,#D97706);color:#fff;padding:2px 7px;border-radius:99px;font-weight:700}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-box{background:rgba(56,189,248,.09);border-radius:14px;padding:13px}
.stat-box .n{font-size:21px;font-weight:800}
.stat-box .l{font-size:12px;color:var(--ink2);margin-top:2px}
.set-group{margin-bottom:18px}
.set-group-head{margin:2px 2px 9px}
.set-group-head .gt{font-size:14.5px;font-weight:700}
.set-group-head .gd{font-size:12px;color:var(--ink2);margin-top:2px}
</style>
</head>
<body>
<style>
/* ---------- 遮罩 / 展开层 ---------- */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(15,25,35,.34);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:18px}
.expand-card{background:var(--card);border-radius:26px;width:min(92vw,520px);max-height:86vh;overflow-y:auto;padding:20px;box-shadow:var(--shadow);animation:expandIn .3s cubic-bezier(.2,.9,.3,1.2)}
@keyframes expandIn{from{transform:scale(.55);opacity:.4}to{transform:scale(1);opacity:1}}
.ex-head{display:flex;gap:10px;align-items:flex-start}
.ex-head .grow{flex:1;min-width:0}
.ex-user{font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ex-idline{font-size:12px;color:var(--ink2);margin-top:2px}
.ex-meta{text-align:right;font-size:12px;color:var(--ink2);line-height:1.5;flex:none}
.ex-meta .cost{color:var(--accent);font-weight:700}
.ex-content{font-size:16.5px;line-height:1.65;margin:14px 0;white-space:pre-wrap;word-break:break-word}
.ex-img{width:100%;border-radius:16px;margin:12px 0;display:block;background:rgba(120,130,140,.12)}
.ex-media-note{font-size:14px;color:var(--ink2);margin:10px 0;white-space:pre-wrap;word-break:break-word}
.ex-stats{font-size:12px;color:var(--ink3);margin:12px 0 4px;line-height:1.6}
.ex-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.act-btn{display:inline-flex;align-items:center;gap:5px;padding:8px 13px;border-radius:999px;background:rgba(120,130,140,.1);font-size:13px;color:var(--ink);height:34px}
.act-btn svg{width:14px;height:14px}
.act-btn.on{background:rgba(250,36,60,.12);color:var(--red)}
.act-btn.on-fav{background:rgba(245,158,11,.16);color:#D97706}
.act-btn.red{color:var(--red)}
.ex-close{width:100%;margin-top:16px;padding:12px;border-radius:14px;background:rgba(120,130,140,.1);font-size:14px;font-weight:600}

/* ---------- 微信式语音条 ---------- */
.voice-bar{position:relative;display:flex;align-items:center;gap:10px;height:46px;border-radius:999px;padding:0 14px 0 6px;margin:14px 0;overflow:hidden;background:linear-gradient(135deg,#E0F2FE,#F0F9FF);border:1px solid rgba(56,189,248,.35);touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
@media (prefers-color-scheme:dark){.voice-bar{background:linear-gradient(135deg,#123043,#0F2733)}}
.vb-fill{position:absolute;left:0;top:0;bottom:0;width:0%;background:linear-gradient(90deg,var(--orange1),var(--orange2));opacity:.85;pointer-events:none}
.vb-btn{position:relative;z-index:2;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--orange1),var(--orange2));color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.vb-btn svg{width:16px;height:16px}
.vb-waves{position:relative;z-index:2;display:flex;align-items:center;gap:2.5px;color:#B45309}
.vb-waves svg{width:18px;height:18px}
.voice-bar.playing .vb-waves{animation:wavePulse 1s ease-in-out infinite}
@keyframes wavePulse{0%,100%{opacity:.45}50%{opacity:1}}
.vb-time{position:relative;z-index:2;margin-left:auto;font-size:13px;font-weight:600;color:#9A3412;font-variant-numeric:tabular-nums}
@media (prefers-color-scheme:dark){.vb-time{color:#FDBA74}.vb-waves{color:#FDBA74}}

/* ---------- Video.js 10 容器 ---------- */
.vjs10-wrap{margin:14px 0;border-radius:16px;overflow:hidden;background:#000}
.vjs10-wrap video-player{display:block;width:100%}
.vjs10-fallback{width:100%;display:block;background:#000;border-radius:16px}

/* ---------- 发布面板 ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:110;visibility:hidden}
.sheet-wrap.open{visibility:visible}
.sheet-mask{position:absolute;inset:0;background:rgba(15,25,35,.34);opacity:0;transition:opacity .3s}
.sheet-wrap.open .sheet-mask{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;overscroll-behavior:contain;
  background:var(--glass);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);
  border-radius:26px 26px 0 0;padding:8px 18px calc(18px + var(--safe-b));transform:translateY(105%);transition:transform .34s cubic-bezier(.3,.8,.3,1);max-width:640px;margin:0 auto}
.sheet-wrap.open .sheet{transform:translateY(0)}
.sheet-grab{padding:8px 0 4px;cursor:grab}
.sheet-grab i{display:block;width:42px;height:5px;border-radius:99px;background:rgba(120,130,140,.4);margin:0 auto}
.sheet h3{font-size:16.5px;text-align:center;margin:6px 0 14px}
.type-seg{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:13px}
.type-seg button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px;border-radius:14px;background:rgba(120,130,140,.1);font-size:12.5px;color:var(--ink2)}
.type-seg button.on{background:rgba(56,189,248,.18);color:var(--accent);font-weight:700}
.pub-form{min-height:158px}
.media-line{display:flex;gap:8px;align-items:stretch}
.media-line input{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:transparent;outline:none}
.upload-btn{display:flex;align-items:center;gap:5px;padding:0 13px;border-radius:12px;background:rgba(56,189,248,.15);color:var(--accent);font-size:13px;font-weight:600;white-space:nowrap}
.file-line{display:flex;align-items:center;gap:8px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;font-size:13px}
.file-line .grow{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.char-count{text-align:right;font-size:11.5px;color:var(--ink3);margin-top:4px}
.cost-row{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:6px 0 4px}
.cost-opt{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 2px;border-radius:14px;background:rgba(120,130,140,.08);font-size:12.5px;color:var(--ink2)}
.cost-opt .dot{border-radius:50%;border:1.5px solid rgba(255,255,255,.7);box-shadow:inset -3px -4px 7px rgba(255,255,255,.4)}
.cost-opt.on{background:rgba(56,189,248,.18);color:var(--accent);font-weight:700}
.perm-row{display:flex;align-items:center;gap:10px;padding:11px 0}
.perm-row .grow{flex:1}
.perm-row .t1{font-size:14px}
.perm-row .t2{font-size:12px;color:var(--ink2)}
.sheet-btns{display:flex;gap:10px;margin-top:14px}
.sheet-btns .cancel{flex:0 0 96px;padding:13px;border-radius:14px;background:rgba(120,130,140,.12);font-size:14.5px;font-weight:600}
.sheet-btns .go{flex:1}

/* ---------- 确认 / 赠送 / 公告等弹窗 ---------- */
.confirm-card{background:var(--card);border-radius:22px;width:min(88vw,360px);padding:20px;box-shadow:var(--shadow);animation:expandIn .22s ease}
.confirm-card h3{font-size:15.5px;margin-bottom:8px;text-align:center}
.confirm-card p{font-size:13.5px;color:var(--ink2);line-height:1.6;text-align:center}
.confirm-btns{display:flex;gap:10px;margin-top:16px}
.confirm-btns button{flex:1;padding:11px;border-radius:12px;font-size:14px;font-weight:600;background:rgba(120,130,140,.12)}
.confirm-btns .danger{background:var(--red);color:#fff}
.confirm-btns .primary{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff}
.gift-opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 10px}
.gift-opt{padding:11px 0;border-radius:12px;background:rgba(120,130,140,.1);font-size:14.5px;font-weight:600;text-align:center}
.gift-opt.on{background:rgba(56,189,248,.2);color:var(--accent)}
.notice-card{background:var(--card);border-radius:24px;width:min(88vw,380px);padding:24px 20px 18px;box-shadow:var(--shadow);text-align:center;animation:expandIn .25s ease}
.notice-card .a-ico{width:52px;height:52px;border-radius:50%;background:rgba(56,189,248,.15);color:#0369A1;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
@media (prefers-color-scheme:dark){.notice-card .a-ico{color:#7DD3FC}}
.notice-card .a-ico svg{width:26px;height:26px}
.notice-card h3{font-size:16.5px;margin-bottom:8px}
.notice-card p{font-size:14px;color:var(--ink2);line-height:1.65;white-space:pre-wrap;text-align:left}
.notice-card .big-btn{margin-top:16px}

/* ---------- 登录 ---------- */
.auth-card{max-width:400px;margin:4vh auto 0}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:16px}
.auth-tabs button{padding:10px;border-radius:12px;background:rgba(120,130,140,.1);font-size:14px;color:var(--ink2)}

function setGet(key, dflt){ const v=S.settings ? S.settings[key] : undefined; return (v===undefined||v===null) ? dflt : v; }

async function loadProfile(){
  if(!S.user){ S.profile=null; updatePointsCap(); return null; }

  if(!S.user) return;
  const [r,f]=await Promise.all([
    sb.from('reactions').select('bubble_id,type').eq('user_id', S.user.id),
    sb.from('favorites').select('bubble_id').eq('user_id', S.user.id)
  ]);
  (r.data||[]).forEach(x=>S.myReactions.set(x.bubble_id, x.type));
  (f.data||[]).forEach(x=>S.myFavorites.add(x.bubble_id));

async function authorsFor(rows){

  if(ids.length){
    const { data } = await sb.from('profiles').select('id,user_no,nickname,role').in('id', ids);
    (data||[]).forEach(p=>S.authors.set(p.id,p));
  }
}
function authorOf(b){ return S.authors.get(b.user_id) || { nickname:'用户', user_no:'', role:'user' }; }

<script>
/* ================= 世界泡泡引擎 ================= */
const stage = $('stage');
const COST_SIZE = {5:90, 10:118, 20:156, 50:208, 100:262};
const TYPE_META = {
  text:{ name:'文字', color:['rgba(125,211,252,.72)','rgba(56,189,248,.62)'], ico:'type' },
  image:{ name:'图片', color:['rgba(167,243,208,.72)','rgba(52,211,153,.60)'], ico:'image' },
  audio:{ name:'音频', color:['rgba(253,186,116,.74)','rgba(251,146,60,.62)'], ico:'audioLines' },
  video:{ name:'视频', color:['rgba(196,181,253,.72)','rgba(167,139,250,.62)'], ico:'play' }
};
let W = { list:[], raf:0, last:0, running:false, target:30, showQueue:[], firstRendered:false };
function stageSize(){ return { w: stage.clientWidth || innerWidth, h: stage.clientHeight || innerHeight }; }
function bubbleSize(b){
  let d = COST_SIZE[b.cost] || 90;
  const { w } = stageSize();
  if(w < 760) d = d * 0.82;
  return Math.max(88, Math.round(d));
}
function weightOf(b){
  const a = authorOf(b);
  if(a.role==='admin') return 10;
  if(b.is_permanent) return 5;
  if((b.report_count||0) >= 2) return 0.2;
  const net = (b.like_count||0) - (b.dislike_count||0);
  return 1 + Math.max(0, Math.min(net*0.1, 3.9));
}
function pickWeighted(cands, exclude){
  let total=0; const ws = cands.map(b=>{ const w=weightOf(b); total+=w; return w; });
  let r = Math.random()*total;
  for(let i=0;i<cands.length;i++){ r-=ws[i]; if(r<=0) return cands[i]; }
  return cands[cands.length-1];
}
function visiblePool(){
  const hideN = Number(setGet('report_hide_threshold',3)) || 3;
  return S.pool.filter(b => (b.report_count||0) < hideN && (S.filter==='all' || b.type===S.filter));
}
function makeBubbleEl(b){
  const el = h('div','bub');
  const d = bubbleSize(b);
  el.style.width = d+'px'; el.style.height = d+'px';
  const [c1,c2] = TYPE_META[b.type].color;
  el.style.background = 'linear-gradient(135deg,'+c1+','+c2+')';
  const a = authorOf(b);
  if(a.role==='admin') el.classList.add('breathe-gold');
  else if(b.is_permanent) el.classList.add('breathe-color');
  const ico = h('span','b-ico'); ico.innerHTML = icon(TYPE_META[b.type].ico);
  const nm = h('span','b-name', a.nickname || '用户');
  el.append(ico, nm);
  if(b.is_permanent) el.appendChild(h('span','b-tag','永久'));
  else if(a.role==='admin') el.appendChild(h('span','b-tag','管理员'));
  el.dataset.id = b.id;
  return el;
}
function spawnBubble(b, delay){
  const { w, hgt } = (function(){ const s=stageSize(); return { w:s.w, hgt:s.h }; })();
  const d = bubbleSize(b);
  const item = {
    b, el: makeBubbleEl(b), d,
    x: Math.max(4, Math.min(w-d-4, Math.random()*(w-d))),
    y: hgt + 10 + (delay||0),
    vx: (Math.random()-0.5)*9, vy: -(26 + Math.random()*22),
    entering:true, leaving:false, drag:false, idlePhase: Math.random()*Math.PI*2
  };
  item.el.style.transform = 'translate('+item.x+'px,'+item.y+'px)';
  stage.appendChild(item.el);
  attachBubblePointer(item);
  W.list.push(item);
  W.showQueue.push(b.id);
  flushShows();
  return item;
}
let showTimer=null;
function flushShows(){
  if(showTimer) return;
  showTimer = setTimeout(async ()=>{
    showTimer=null;
    const ids = W.showQueue.splice(0, W.showQueue.length);
    if(ids.length){ try{ await sb.rpc('record_shows',{ p_ids: ids }); ids.forEach(id=>{ const b=S.poolById.get(id); if(b) b.show_count=(b.show_count||0)+1; }); }catch(e){} }
  }, 900);
}
function removeItem(item){
  item.el.remove();
  W.list = W.list.filter(x=>x!==item);
}
function topUp(){
  const { h } = stageSize();
  const cands = visiblePool().filter(b => !W.list.some(it=>it.b.id===b.id));
  let guard = 0;
  while(W.list.filter(it=>!it.leaving).length < W.target && cands.length && guard++ < W.target+4){
    const b = pickWeighted(cands);
    cands.splice(cands.indexOf(b),1);
    spawnBubble(b, Math.random()*h*0.35);
  }
  if(!W.firstRendered && W.list.length){ W.firstRendered = true; hideBoot(); }
}
function tick(ts){
  if(!W.running) return;
  const dt = Math.min(0.05, (ts - W.last)/1000 || 0.016); W.last = ts;
  const { w, h } = stageSize();
  const items = W.list;
  for(const it of items){
    if(it.drag) continue;
    if(it.entering){
      it.y += it.vy*dt*2.2; it.x += Math.sin(ts/700 + it.idlePhase)*7*dt + it.vx*dt;
      if(it.y < h - it.d - 130){ it.entering=false; it.vy = (Math.random()-0.5)*7; }
    } else if(it.leaving){
      it.y -= 52*dt; it.x += it.vx*dt;
    } else {
      it.idlePhase += dt*0.7;
      it.x += (it.vx + Math.sin(it.idlePhase)*4)*dt;
      it.y += (it.vy + Math.cos(it.idlePhase*0.8)*3)*dt;
      if(it.x < 2){ it.x=2; it.vx=Math.abs(it.vx); }
      if(it.x > w-it.d-2){ it.x=w-it.d-2; it.vx=-Math.abs(it.vx); }
      if(it.y < 66){ it.y=66; it.vy=Math.abs(it.vy); }
      if(it.y > h-it.d-108){ it.y=h-it.d-108; it.vy=-Math.abs(it.vy); }
    }
  }
  /* 两两挤压 */
  for(let i=0;i<items.length;i++) for(let j=i+1;j<items.length;j++){
    const a=items[i], c=items[j]; if(a.drag||c.drag) continue;
    const ax=a.x+a.d/2, ay=a.y+a.d/2, cx=c.x+c.d/2, cy=c.y+c.d/2;
    let dx=cx-ax, dy=cy-ay; let dist=Math.hypot(dx,dy); const min=(a.d+c.d)/2+3;
    if(dist>0.01 && dist<min){
      const push=(min-dist)/2, ux=dx/dist, uy=dy/dist;
      if(!a.entering){ a.x-=ux*push*0.5; a.y-=uy*push*0.5; }
      if(!c.entering){ c.x+=ux*push*0.5; c.y+=uy*push*0.5; }
      if(a.entering && !c.entering){ c.x+=ux*push; c.y+=uy*push; }
      if(c.entering && !a.entering){ a.x-=ux*push; a.y-=uy*push; }
    }
  }
  for(const it of [...items]){
    if(it.leaving && it.y + it.d < -16){ removeItem(it); topUp(); continue; }
    if(!it.entering && !it.leaving){
      if(it.x < 2) it.x=2; if(it.x > w-it.d-2) it.x=w-it.d-2;
      if(it.y < 60) it.y=60; if(it.y > h-it.d-100) it.y=h-it.d-100;
    }
    it.el.style.transform = 'translate('+it.x+'px,'+it.y+'px)';
  }
  W.raf = requestAnimationFrame(tick);
}
function startWorld(){
  if(W.running) return; W.running = true; W.last = performance.now();
  W.raf = requestAnimationFrame(tick);
}
function attachBubblePointer(item){
  const el = item.el; let sx=0, sy=0, moved=0, lastX=0, lastT=0;
  el.addEventListener('pointerdown', e=>{
    e.preventDefault(); el.setPointerCapture(e.pointerId);
    item.drag = true; moved = 0; sx=e.clientX-item.x; sy=e.clientY-item.y; lastX=e.clientX; lastT=performance.now();
    if(item.leaving){ item.leaving=false; item.entering=false; item.vy=(Math.random()-0.5)*7; }
  });
  el.addEventListener('pointermove', e=>{
    if(!item.drag) return;
    const nx = e.clientX-sx, ny = e.clientY-sy;
    moved += Math.abs(e.movementX||0)+Math.abs(e.movementY||0);
    const now = performance.now(), dtm = Math.max(1, now-lastT);
    item.vx = (e.clientX-lastX)/dtm*1000*0.35; lastX=e.clientX; lastT=now;
    item.x = nx; item.y = ny;
    el.style.transform = 'translate('+item.x+'px,'+item.y+'px)';
    /* 拖动挤压周围 */
    for(const o of W.list){ if(o===item||o.drag) continue;
      const dx=(o.x+o.d/2)-(item.x+item.d/2), dy=(o.y+o.d/2)-(item.y+item.d/2);
      const dist=Math.hypot(dx,dy), min=(o.d+item.d)/2+16;
      if(dist>0.01 && dist<min){ o.x += dx/dist*3.2; o.y += dy/dist*3.2; }
    }
  });
  const up = ()=>{
    if(!item.drag) return; item.drag=false;
    item.vx = Math.max(-26, Math.min(26, item.vx)); item.vy = (Math.random()-0.5)*8;
    if(moved < 8) openExpand(item.b, 'world');
  };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
}
function popBubble(item){
  const { x, y, d } = item;
  item.el.classList.add('popping');
  item.el.style.transform = 'translate('+x+'px,'+y+'px) scale(1.45)';
  item.el.style.opacity = '0';
  const ring = h('div','pop-ring');
  ring.style.cssText = 'left:'+x+'px;top:'+y+'px;width:'+d+'px;height:'+d+'px';
  stage.appendChild(ring); setTimeout(()=>ring.remove(), 480);
  const col = TYPE_META[item.b.type].color[1];
  for(let i=0;i<9;i++){
    const dr = h('div','pop-drop'); const ang = Math.random()*Math.PI*2, dist = 26+Math.random()*36;
    dr.style.cssText = 'left:'+(x+d/2)+'px;top:'+(y+d/2)+'px;background:'+col;
    dr.style.setProperty('--dx', Math.cos(ang)*dist+'px'); dr.style.setProperty('--dy', Math.sin(ang)*dist+'px');
    stage.appendChild(dr); setTimeout(()=>dr.remove(), 480);
  }
  popSound();
  setTimeout(()=>{ removeItem(item); topUp(); }, 360);
}
function swapBatch(){
  const cur = W.list.filter(it=>!it.leaving);
  cur.forEach((it,i)=>{ setTimeout(()=>{ it.leaving=true; it.entering=false; }, i*60); });
  const need = Math.max(0, W.target - 0);
  setTimeout(()=>{ topUp(); }, 500);
  blipSounds();
}
function applyFilter(f){
  S.filter = f;
  document.querySelectorAll('#filterMenu button').forEach(b=>b.classList.toggle('on', b.dataset.f===f));
  $('filterBtn').classList.toggle('on', f!=='all');
  const pool = visiblePool();
  const keep = W.list.filter(it=>it.b.type===f || f==='all');
  if(f!=='all' && pool.length < W.target){
    /* 池子不够：只保留同类型在场，不换场 */
    W.list.filter(it=>it.b.type!==f).forEach(it=>{ it.leaving=true; it.entering=false; });
    return;
  }
  W.list.filter(it=>!keep.includes(it)).forEach(it=>{ it.leaving=true; it.entering=false; });
  setTimeout(()=>topUp(), 350);
}
async function loadPool(){
  const { data, error } = await sb.from('bubbles').select('*').is('deleted_at', null).eq('status','visible').is('archived_at', null).order('created_at',{ascending:false}).limit(600);

  S.pool = data||[]; S.poolById = new Map(S.pool.map(b=>[b.id,b]));

function setWorldTarget(){
  const narrow = innerWidth < 760;
  W.target = Number(narrow ? setGet('world_count_narrow',30) : setGet('world_count_wide',60)) || (narrow?30:60);
}
/* ---- 音效（Web Audio 合成，无音频文件） ---- */
let AC=null;
function audioCtx(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state==='suspended') AC.resume(); return AC; }
function blip(freq, t0, dur, gain){
  const ac = audioCtx(); if(!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type='sine'; o.frequency.setValueAtTime(freq, ac.currentTime+t0);
  o.frequency.exponentialRampToValueAtTime(freq*1.7, ac.currentTime+t0+dur);
  g.gain.setValueAtTime(0.0001, ac.currentTime+t0);
  g.gain.exponentialRampToValueAtTime(gain, ac.currentTime+t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+t0+dur);
  o.connect(g).connect(ac.destination); o.start(ac.currentTime+t0); o.stop(ac.currentTime+t0+dur+0.05);
}
function blipSounds(){ for(let i=0;i<6;i++) blip(280+i*70+Math.random()*40, i*0.07, 0.16, 0.05); }
function popSound(){ blip(520, 0, 0.14, 0.07); }
</script>

function needLogin(){ if(!S.user){ toast('先登录才能操作'); showPage('mine'); renderAuth(); return true; } return false; }
async function doReaction(b, type, likeBtn, disBtn){

/* ---------- 微信式语音条 ---------- */
function fmtSec(s){ s=Math.max(0,Math.ceil(s||0)); return s+"''"; }
function buildVoiceBar(url){
  const bar = h('div','voice-bar');
  const fill = h('div','vb-fill');
  const btn = h('span','vb-btn'); btn.innerHTML = icon('play');
  const waves = h('span','vb-waves'); waves.innerHTML = icon('audioLines');
  const time = h('span','vb-time','--\'\'');
  bar.append(fill, btn, waves, time);
  const audio = new Audio(); audio.preload='metadata'; audio.src=url; audio.crossOrigin='anonymous';
  EX.audio = audio;
  const st = { playing:false, scrubbing:false, dur:0 };
  EX.voice = st;
  const paint = ()=>{
    const pos = st.scrubbing ? st.scrubPos : audio.currentTime;
    const pct = st.dur ? Math.min(100, pos/st.dur*100) : 0;
    fill.style.width = pct+'%';
    time.textContent = fmtSec(st.dur ? st.dur-pos : 0);
  };
  audio.addEventListener('loadedmetadata', ()=>{ st.dur = audio.duration||0; time.textContent = fmtSec(st.dur); paint(); });
  audio.addEventListener('timeupdate', ()=>{ if(!st.scrubbing) paint(); });
  audio.addEventListener('ended', ()=>{ st.playing=false; bar.classList.remove('playing'); btn.innerHTML=icon('play'); paint(); });
  audio.addEventListener('error', ()=>{ time.textContent='已失效'; });
  const toggle = ()=>{
    if(st.playing){ audio.pause(); st.playing=false; bar.classList.remove('playing'); btn.innerHTML=icon('play'); }
    else{ audio.play().then(()=>{ st.playing=true; bar.classList.add('playing'); btn.innerHTML=icon('pause'); }).catch(()=>toast('音频播放失败')); }
  };
  let startX=0, startPos=0, movedPx=0;
  bar.addEventListener('pointerdown', e=>{
    e.preventDefault(); bar.setPointerCapture(e.pointerId);
    st.scrubbing = true; movedPx=0; startX=e.clientX; startPos=audio.currentTime||0; st.scrubPos=startPos;
  });
  bar.addEventListener('pointermove', e=>{
    if(!st.scrubbing || !st.dur) return;
    movedPx = Math.max(movedPx, Math.abs(e.clientX-startX));
    const rect = bar.getBoundingClientRect();
    st.scrubPos = Math.max(0, Math.min(st.dur, startPos + (e.clientX-startX)/rect.width*st.dur));
    paint();
  });
  bar.addEventListener('pointerup', ()=>{
    if(!st.scrubbing) return; st.scrubbing=false;
    if(movedPx > 8){ try{ audio.currentTime = st.scrubPos; }catch(e){} paint(); }
    else toggle();
  });
  return bar;
}

/* ---------- Video.js 10（videojs.org 新款，远程组件） ---------- */
let vjs10Loading = null;
function loadVjs10(){
  if(window.customElements && customElements.get('video-player')) return Promise.resolve(true);
  if(vjs10Loading) return vjs10Loading;
  vjs10Loading = new Promise(resolve=>{
    const css = document.createElement('link'); css.rel='stylesheet';
    css.href='https://cdn.jsdelivr.net/npm/@videojs/cdn@10/dist/video.css';
    document.head.appendChild(css);
    const s1 = document.createElement('script'); s1.type='module';
    s1.src='https://cdn.jsdelivr.net/npm/@videojs/cdn@10/dist/video.js';
    const s2 = document.createElement('script'); s2.type='module';
    s2.src='https://cdn.jsdelivr.net/npm/@videojs/cdn@10/dist/media/hlsjs-video.js';
    let done=false; const fin=ok=>{ if(!done){ done=true; resolve(ok); } };
    s2.onload=()=>setTimeout(()=>fin(true),60); s2.onerror=()=>fin(false); s1.onerror=()=>fin(false);
    document.head.append(s1, s2);
    setTimeout(()=>fin(!!(window.customElements && customElements.get('video-player'))), 6000);
  });
  return vjs10Loading;
}
async function buildVideoPlayer(wrap, url){
  if(!isHttps(url)){ wrap.appendChild(h('div','ex-media-note','视频链接已失效')); return; }
  const ok = await loadVjs10().catch(()=>false);
  if(!document.body.contains(wrap)) return;
  if(ok){
    const isHls = /\.m3u8($|\?)/i.test(url);
    const player = document.createElement('video-player');
    const skin = document.createElement('video-skin');
    const media = document.createElement(isHls ? 'hlsjs-video' : 'video');
    media.setAttribute('slot','media'); media.setAttribute('src', url);
    media.setAttribute('playsinline',''); media.setAttribute('crossorigin','anonymous');
    skin.appendChild(media); player.appendChild(skin);
    wrap.appendChild(player); EX.vjsEl = player;
    media.addEventListener('error', ()=>{ wrap.innerHTML=''; wrap.appendChild(h('div','ex-media-note','视频链接已失效')); }, { once:true });
  } else {
    const v = h('video','vjs10-fallback'); v.src=url; v.controls=true; v.playsInline=true; v.setAttribute('playsinline','');
    v.addEventListener('error', ()=>{ wrap.innerHTML=''; wrap.appendChild(h('div','ex-media-note','视频链接已失效')); }, { once:true });
    wrap.appendChild(v); EX.vjsEl = v;
  }
}

(function(){
  const sheet = $('pubSheet'); let startY=null, fromContent=false;
  const onDown = (y, content)=>{ startY=y; fromContent=content; };
  const onMove = y=>{
    if(startY===null) return;
    const dy = y-startY;
    if(dy>0 && (!fromContent || sheet.scrollTop<=0)) sheet.style.transform='translateY('+dy+'px)';
  };
  const onUp = y=>{
    if(startY===null) return;
    const dy = y-startY; startY=null; sheet.style.transform='';
    if(dy>80 && (!fromContent || sheet.scrollTop<=0)) closePublish();
  };
  $('pubGrab').addEventListener('pointerdown', e=>onDown(e.clientY,false));
  sheet.addEventListener('pointerdown', e=>{
    if(e.target.closest('input,textarea,button,select,label.switch,.cost-opt,.type-seg')) return;
    onDown(e.clientY,true);
  });
  addEventListener('pointermove', e=>onMove(e.clientY));
  addEventListener('pointerup', e=>onUp(e.clientY));
})();
function buildPublishForm(){
  const body = $('pubBody'); body.innerHTML='';
  PUB = { type:'text', cost:5, file:null, fileUrl:'', filePath:'', uploading:false };
  const seg = h('div','type-seg');
  ['text','image','audio','video'].forEach(t=>{
    const b = h('button', t==='text'?'on':''); b.innerHTML = icon(TYPE_META[t].ico); b.appendChild(document.createTextNode(TYPE_META[t].name));
    b.onclick = ()=>{ PUB.type=t; seg.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); syncPubForm(); };
    seg.appendChild(b);
  });
  body.appendChild(seg);
  const form = h('div','pub-form'); form.id='pubForm'; body.appendChild(form);
  /* 积分档位 */
  const costLabel = h('div'); costLabel.appendChild(h('label',null,'泡泡大小（积分）')); costLabel.querySelector('label').style.cssText='font-size:12.5px;color:var(--ink2);display:block;margin:12px 0 2px';
  body.appendChild(costLabel);
  const costRow = h('div','cost-row');
  [5,10,20,50,100].forEach(c=>{
    const o = h('button','cost-opt'+(c===5?' on':''));
    const dot = h('span','dot'); const px = Math.round((COST_SIZE[c]/262)*34)+8;
    dot.style.width=px+'px'; dot.style.height=px+'px';
    dot.style.background='linear-gradient(135deg,rgba(125,211,252,.8),rgba(56,189,248,.65))';
    o.append(dot, document.createTextNode(c+' 分'));
    o.onclick=()=>{ PUB.cost=c; costRow.querySelectorAll('.cost-opt').forEach(x=>x.classList.remove('on')); o.classList.add('on'); };
    costRow.appendChild(o);
  });
  body.appendChild(costRow);
  /* 永久泡泡 */
  const perm = h('div','perm-row');
  const pg = h('div','grow'); pg.append(h('div','t1','永久泡泡'), h('div','t2','用授权码发布，永不过期，大小按 100 分档'));
  const sw = h('label','switch'); const swIn = h('input'); swIn.type='checkbox';
  const tr = h('span','tr'); sw.append(swIn, tr);
  perm.append(pg, sw); body.appendChild(perm);
  const codeField = h('div','field'); codeField.hidden = true;
  const codeIn = h('input'); codeIn.placeholder='输入授权码'; codeIn.id='permCode';
  codeField.appendChild(codeIn); body.appendChild(codeField);
  swIn.onchange = ()=>{ codeField.hidden = !swIn.checked; PUB.permanent = swIn.checked; };
  PUB.permanent = false;
  /* 按钮 */
  const btns = h('div','sheet-btns');
  const cancel = h('button','cancel','取消'); cancel.onclick=closePublish;
  const go = h('button','big-btn go','发布泡泡');
  go.onclick = ()=>submitPublish(codeIn);
  btns.append(cancel, go); body.appendChild(btns);
  syncPubForm();
}
function syncPubForm(){
  const form = $('pubForm'); if(!form) return; form.innerHTML='';
  const t = PUB.type;
  if(t==='text'){
    const f = h('div','field');
    const ta = h('textarea'); ta.id='pubText'; ta.maxLength=300; ta.placeholder='写下你想说的话（最多 300 字）'; ta.rows=4;
    const cnt = h('div','char-count','0 / 300');
    ta.oninput=()=>{ cnt.textContent = ta.value.length+' / 300'; };
    f.append(ta, cnt); form.appendChild(f);
  } else {
    /* 媒体行：上传 + 链接同行 */
    const line = h('div','media-line');
    if(t==='image' || t==='audio'){
      if(setGet('media_upload_enabled', true)){
        const up = h('button','upload-btn'); up.innerHTML = icon('upload','sm'); up.appendChild(document.createTextNode('上传'));
        const fileIn = h('input'); fileIn.type='file'; fileIn.hidden=true;
        fileIn.accept = t==='image' ? 'image/*' : 'audio/*';
        up.onclick=()=>fileIn.click();
        fileIn.onchange=()=>{ if(fileIn.files[0]) uploadMedia(fileIn.files[0], t); };
        line.append(up, fileIn);
      }
    }
    const urlIn = h('input'); urlIn.id='pubUrl'; urlIn.placeholder = t==='video' ? '粘贴视频链接（https，支持 MP4 / m3u8）' : '或粘贴链接（https）';
    urlIn.oninput=()=>{ if(urlIn.value.trim()){ PUB.fileUrl=''; PUB.filePath=''; const fl=$('pubFileLine'); if(fl) fl.remove(); } };
    line.appendChild(urlIn); form.appendChild(line);
    const note = h('div','field'); note.style.marginTop='10px';
    const ta = h('textarea'); ta.id='pubText'; ta.maxLength=150; ta.placeholder='配一段说明（选填，最多 150 字）'; ta.rows=2;
    const cnt = h('div','char-count','0 / 150');
    ta.oninput=()=>{ cnt.textContent = ta.value.length+' / 150'; };
    note.append(ta, cnt); form.appendChild(note);
  }
}
async function uploadMedia(file, t){
  const maxMB = t==='image' ? 5 : 10;
  if(file.size > maxMB*1024*1024){ toast('文件不能超过 '+maxMB+'MB'); return; }
  PUB.uploading = true; toast('上传中…');
  try{
    const { data } = await sb.auth.getSession();
    const jwt = data && data.session ? data.session.access_token : '';
    const dataUrl = await new Promise((res, rej)=>{ const fr = new FileReader(); fr.onload = ()=>res(fr.result); fr.onerror = rej; fr.readAsDataURL(file); });
    const data_base64 = String(dataUrl).split(',')[1] || '';
    const resp = await fetch(MEDIA_API+'/upload', { method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+jwt }, body: JSON.stringify({ kind:t, filename:file.name, mime:file.type, data_base64 }) });
    const json = await resp.json().catch(()=>({}));
    if(!resp.ok) throw new Error(json.message || json.error || '上传失败');
    PUB.fileUrl = json.url || ''; PUB.filePath = json.path || '';
    const form = $('pubForm'); const old = $('pubFileLine'); if(old) old.remove();
    const fl = h('div','file-line'); fl.id='pubFileLine';
    fl.append(h('span','grow', file.name), h('span',null,'已上传'));
    const rm = h('button','pill-btn gray','移除'); rm.onclick=()=>{ PUB.fileUrl=''; PUB.filePath=''; fl.remove(); };
    fl.appendChild(rm); form.prepend(fl);
    const urlIn = $('pubUrl'); if(urlIn) urlIn.value='';
    toast('上传完成');
  }catch(e){ toast(errText(e)); }
  PUB.uploading = false;
}
async function submitPublish(codeIn){
  if(PUB.uploading){ toast('文件还在上传中'); return; }
  const t = PUB.type;
  const textEl = $('pubText');
  const content = textEl ? textEl.value.trim() : '';
  let mediaUrl = '', mediaPath = '';
  if(t!=='text'){
    const urlIn = $('pubUrl'); const link = urlIn ? urlIn.value.trim() : '';
    if(PUB.fileUrl){ mediaUrl = PUB.fileUrl; mediaPath = PUB.filePath; }
    else if(link){ mediaUrl = link; }
    else { toast('请上传文件或粘贴链接'); return; }
    if(!isHttps(mediaUrl)){ toast('只支持 https 链接'); return; }
  }
  if(t==='text' && !content){ toast('先写点内容'); return; }
  if(t==='text' && content.length>300){ toast('文字最多 300 字'); return; }
  if(t!=='text' && content.length>150){ toast('说明最多 150 字'); return; }
  const permCode = PUB.permanent ? (codeIn.value||'').trim() : '';
  if(PUB.permanent && !permCode){ toast('请输入授权码'); return; }
  if(!PUB.permanent && S.profile && S.profile.points < PUB.cost){ toast('积分不足，还差 '+(PUB.cost - S.profile.points)+' 分，去签到吧'); return; }
  const { data, error } = await sb.rpc('publish_bubble', {
    p_type:t, p_content:content, p_media_url:mediaUrl||null, p_media_path:mediaPath||null,
    p_cost:PUB.cost, p_perm_code: permCode||null
  });
  if(error){ toast(errText(error)); return; }
  closePublish(); toast('发布成功');
  await Promise.all([loadProfile(), loadPool()]);
  const nb = data && (data.id ? S.poolById.get(data.id) : (typeof data==='string' ? S.poolById.get(data) : null));
  setWorldTarget(); showWorld();
  if(nb){ const it = spawnBubble(nb, 0); if(it){ it.y = stageSize().h*0.4; it.entering=false; } }
  else topUp();
}
</script>
<script>
/* ================= 页面导航 ================= */
function showWorld(){
  S.view='world'; $('page').hidden = true; $('stage').style.visibility='visible';
  $('refreshBtn').style.visibility='visible'; $('topCaps').style.visibility='visible';
  $('tabWorld').classList.add('on'); $('tabMine').classList.remove('on');

}
function showPage(kind){

function backLink(text, fn){
  const b = h('button','back-link'); b.innerHTML = icon('chevL'); b.appendChild(document.createTextNode(text));
  b.onclick = fn; return b;
}
function copyrightEl(){ return h('div','copyright', COPYRIGHT); }
function menuItem(icoName, label, fn, badge){
  const b = h('button','menu-item');
  const ic = h('span','mi-ico'); ic.innerHTML = icon(icoName);
  b.append(ic, document.createTextNode(label));
  if(badge){ b.appendChild(h('span','badge', String(badge))); }
  const ar = h('span','mi-arrow'); ar.innerHTML = icon('chevR','sm'); b.appendChild(ar);

/* ================= 我的 ================= */
async function renderMine(){
  showPage('mine');
  const wrap = $('pageWrap'); wrap.innerHTML='';
  if(!S.user){ renderAuth(); return; }
  await loadProfile();
  const p = S.profile || {};
  /* 账号卡 */
  const card = h('div','card');
  const top = h('div'); top.style.display='flex'; top.style.gap='12px'; top.style.alignItems='center';
  const av = h('div','avatar', (p.nickname||'用').slice(0,1));
  const info = h('div','grow'); info.style.flex='1'; info.style.minWidth='0';

  nameLine.append(document.createTextNode(p.nickname||'用户'));

  nameLine.appendChild(idSpan);
  if(p.role==='admin') nameLine.appendChild(h('span','admin-badge','管理员'));
  info.append(nameLine, h('div','sub', S.user.email||''));
  top.append(av, info); card.appendChild(top);
  if(p.is_banned){ const bn = h('div','sub','账号已被封禁：能浏览，不能发布与签到'); bn.style.color='var(--red)'; bn.style.marginTop='8px'; card.appendChild(bn); }
  wrap.appendChild(card);
  /* 提醒角标 */
  let unread = 0;
  const { data: notis } = await sb.from('notifications').select('id').eq('user_id', S.user.id).eq('is_read', false);
  unread = (notis||[]).length;
  let pending = 0;
  if(isAdmin()){ try{ const { data: pr } = await sb.rpc('admin_pending_reviews'); pending = (pr||[]).length; }catch(e){} }
  const list = h('div','menu-list');
  list.append(
    menuItem('user','账号信息', renderAccount),
    menuItem('calendarCheck','签到与积分', renderCheckin),
    menuItem('globe','发布的泡泡', renderMyBubbles),
    menuItem('star','收藏的泡泡', renderFavorites),
    menuItem('history','泡泡足迹', renderFootprints),
    menuItem('bell','站内提醒', renderNotifications, unread||undefined)
  );
  wrap.appendChild(list);
  if(isAdmin()){
    const al = h('div','menu-list');
    al.appendChild(menuItem('shield','管理员后台', renderAdminHome, pending||undefined));
    wrap.appendChild(al);
  }
  const out = h('button','ghost-btn','退出登录');
  out.onclick = ()=>confirmBox('退出登录？','退出后需要重新登录才能发布和签到。','退出',false, async ()=>{ await sb.auth.signOut(); S.user=null; S.profile=null; updatePointsCap(); toast('已退出'); renderMine(); showWorld(); });
  wrap.appendChild(out);
  wrap.appendChild(copyrightEl());
}
/* ---------- 登录 / 注册 ---------- */
function renderAuth(){
  showPage('mine');
  const wrap = $('pageWrap'); wrap.innerHTML='';
  const card = h('div','card auth-card');
  card.appendChild(h('h3',null,'欢迎来到泡泡世界'));
  card.appendChild(h('p','sub','登录后可以签到攒积分、发布泡泡。'));
  const tabs = h('div','auth-tabs');
  const tIn = h('button','on','登录'), tUp = h('button','','注册');
  tabs.append(tIn, tUp); card.appendChild(tabs);
  const form = h('div'); card.appendChild(form);
  let mode = 'in';
  const build = ()=>{
    form.innerHTML='';
    tIn.classList.toggle('on', mode==='in'); tUp.classList.toggle('on', mode==='up');
    if(mode==='up'){
      const f1 = h('div','field'); f1.appendChild(h('label',null,'昵称（最多 6 个字）'));
      const nick = h('input'); nick.id='authNick'; nick.maxLength=6; nick.placeholder='给自己起个名字'; f1.appendChild(nick); form.appendChild(f1);
    }
    const f2 = h('div','field'); f2.appendChild(h('label',null,'邮箱'));
    const em = h('input'); em.id='authEmail'; em.type='email'; em.placeholder='you@example.com'; f2.appendChild(em); form.appendChild(f2);
    const f3 = h('div','field'); f3.appendChild(h('label',null,'密码'));
    const pw = h('input'); pw.id='authPw'; pw.type='password'; pw.placeholder='至少 6 位'; f3.appendChild(pw); form.appendChild(f3);
    const btn = h('button','big-btn', mode==='in' ? '登录' : '注册并领取新手积分');
    btn.onclick = async ()=>{
      const email = em.value.trim(), pass = pw.value;
      if(!email || !pass){ toast('邮箱和密码都要填'); return; }
      btn.disabled = true;
      if(mode==='in'){
        const { error } = await sb.auth.signInWithPassword({ email, password: pass });
        btn.disabled=false;
        if(error){ toast(errText(error)); return; }
        toast('登录成功'); await afterAuth();
      } else {
        const nickEl = $('authNick'); const nick = nickEl ? nickEl.value.trim() : '';
        if(!nick){ toast('先填昵称'); btn.disabled=false; return; }
        if(nick.length>6){ toast('昵称最多 6 个字'); btn.disabled=false; return; }
        const { data, error } = await sb.auth.signUp({ email, password: pass, options:{ data:{ nickname: nick } } });
        btn.disabled=false;
        if(error){ toast(errText(error)); return; }
        if(!data.session){ toast('注册成功，请先去邮箱完成验证，再回来登录'); mode='in'; build(); return; }
        toast('注册成功，新手积分已到账'); await afterAuth();
      }
    };
    form.appendChild(btn);
  };
  tIn.onclick=()=>{ mode='in'; build(); }; tUp.onclick=()=>{ mode='up'; build(); };
  build();
  wrap.appendChild(card);
  wrap.appendChild(copyrightEl());
}
async function afterAuth(){
  const { data } = await sb.auth.getSession();
  S.user = data && data.session ? data.session.user : null;
  await Promise.all([loadProfile(), loadMyMarks()]);
  renderMine();
}
/* ---------- 账号信息 ---------- */

  wrap.appendChild(backLink('返回我的', renderMine));
  await loadProfile(); const p = S.profile||{};

  const rows = [
    ['昵称', p.nickname||''], ['用户 ID', String(p.user_no||'')], ['邮箱', S.user.email||''],
    ['注册日期', p.created_at ? fmtDate(p.created_at) : ''], ['角色', p.role==='admin' ? '管理员' : '普通用户'],
    ['状态', p.is_banned ? '已封禁' : '正常'], ['积分余额', String(p.points||0)]
  ];
  rows.forEach(([k,v])=>{ const r=h('div','row-line'); r.append(h('span','t2',k), h('span','grow')); r.lastChild.textContent=''; const val=h('span','t1',v); val.style.textAlign='right'; r.appendChild(val); card.appendChild(r); });
  wrap.appendChild(card);

  edit.appendChild(h('h3',null,'修改昵称'));
  const f = h('div','field'); const inp = h('input'); inp.maxLength=6; inp.value=p.nickname||''; inp.placeholder='最多 6 个字'; f.appendChild(inp); edit.appendChild(f);

/* ---------- 签到与积分 ---------- */
async function renderCheckin(){
  S.view='checkin'; showPage('checkin');
  const wrap = $('pageWrap'); wrap.innerHTML='';
  wrap.appendChild(backLink('返回我的', renderMine));
  await loadProfile(); const p = S.profile||{};

  card.appendChild(h('div',null,'当前积分')); card.querySelector('div').style.cssText='font-size:12.5px;color:var(--ink2)';
  const bal = h('div',null,String(p.points||0)); bal.style.cssText='font-size:38px;font-weight:800;margin:6px 0 12px';
  card.appendChild(bal);
  const today = shanghaiToday();
  const { data: done } = await sb.from('checkins').select('id').eq('user_id', S.user.id).eq('checkin_date', today);
  const signed = (done||[]).length>0;
  const btn = h('button','big-btn', signed ? '今日已签到，明日再来' : '每日签到 +'+setGet('checkin_points',2));
  btn.disabled = signed || banned();
  if(banned()) btn.textContent='已封禁，不能签到';

    btn.disabled = true;
    const { error } = await sb.rpc('daily_checkin');
    if(error){ toast(errText(error)); btn.disabled=false; return; }
    toast('签到成功 +'+setGet('checkin_points',2)); renderCheckin();
  };
  card.appendChild(btn); wrap.appendChild(card);

  listCard.appendChild(h('h3',null,'积分明细'));
  const { data: logs } = await sb.from('points_log').select('*').eq('user_id', S.user.id).order('created_at',{ascending:false}).limit(60);
  if(!logs || !logs.length) listCard.appendChild(h('div','empty-note','还没有积分记录'));
  (logs||[]).forEach(l=>{
    const r = h('div','row-line');
    const g = h('div','grow'); g.append(h('div','t1', reasonText(l)), h('div','t2', fmtDate(l.created_at)));
    const amt = h('span',null,(l.change>0?'+':'')+l.change);
    amt.style.cssText='font-weight:700;color:'+(l.change>=0?'var(--accent)':'var(--red)');
    r.append(g, amt); listCard.appendChild(r);
  });
  wrap.appendChild(listCard);
  wrap.appendChild(copyrightEl());
}
function reasonText(l){
  const map = { checkin:'每日签到', publish:'发布泡泡', publish_permanent:'发布永久泡泡', admin_gift:'管理员赠送', newbie:'新手赠送' };
  return (map[l.reason]||l.reason||'积分变动') + (l.note ? ' · '+l.note : '');
}
/* ---------- 我的泡泡 / 收藏 / 足迹 ---------- */
function bubbleRow(b, extra){
  const r = h('div','row-line');
  const dot = h('span'); const d = Math.max(16, Math.min(34, (COST_SIZE[b.cost]||90)/7));
  dot.style.cssText='width:'+d+'px;height:'+d+'px;border-radius:50%;flex:none;background:linear-gradient(135deg,'+TYPE_META[b.type].color[0]+','+TYPE_META[b.type].color[1]+')';
  const g = h('div','grow');
  const title = b.type==='text' ? (b.content||'（无内容）') : (TYPE_META[b.type].name + (b.content ? ' · '+b.content : ''));
  g.append(h('div','t1', title), h('div','t2', (extra||'') + fmtDate(b.created_at)));
  r.append(dot, g); return r;
}
async function renderMyBubbles(){
  S.view='mine'; showPage('mine');
  const wrap = $('pageWrap'); wrap.innerHTML='';
  wrap.appendChild(backLink('返回我的', renderMine));
  const card = h('div','card'); card.appendChild(h('h3',null,'发布的泡泡'));
  const { data } = await sb.from('bubbles').select('*').eq('user_id', S.user.id).is('deleted_at', null).order('created_at',{ascending:false}).limit(100);
  if(!data || !data.length) card.appendChild(h('div','empty-note','还没有发布过泡泡'));
  (data||[]).forEach(b=>{
    const r = bubbleRow(b, b.cost+' 分 · 出现 '+(b.show_count||0)+' · 查看 '+(b.view_count||0)+' · 赞 '+(b.like_count||0)+' · 踩 '+(b.dislike_count||0)+(b.archived_at?' · 已归档':'')+(b.status==='hidden'?' · 已下架':'')+' · ');
    const view = h('button','pill-btn','查看'); view.onclick=()=>{ authorsFor([b]).then(()=>openExpand(b,'list')); };
    const del = h('button','pill-btn red','删除'); del.onclick=()=>confirmDeleteBubble(b,false);
    r.append(view, del); card.appendChild(r);
  });
  wrap.appendChild(card); wrap.appendChild(copyrightEl());
}
async function renderFavorites(){
  S.view='mine'; showPage('mine');
  const wrap = $('pageWrap'); wrap.innerHTML='';
  wrap.appendChild(backLink('返回我的', renderMine));
  const card = h('div','card'); card.appendChild(h('h3',null,'收藏的泡泡'));
  const { data: favs } = await sb.from('favorites').select('bubble_id,created_at').eq('user_id', S.user.id).order('created_at',{ascending:false}).limit(100);
  if(!favs || !favs.length){ card.appendChild(h('div','empty-note','还没有收藏的泡泡')); wrap.appendChild(card); wrap.appendChild(copyrightEl()); return; }

async function renderFootprints(){

<script>
/* ================= 管理员后台 ================= */

/* ---------- 待审核 ---------- */
async function renderAdminReviews(){
  S.view='admin'; showPage('admin');
  const wrap = $('pageWrap'); wrap.innerHTML='';
  wrap.appendChild(backLink('返回后台', renderAdminHome));
  const card = h('div','card'); card.appendChild(h('h3',null,'待审核'));
  const { data, error } = await sb.rpc('admin_pending_reviews');
  if(error) card.appendChild(h('div','empty-note', errText(error)));
  const rows = data||[];
  if(!rows.length) card.appendChild(h('div','empty-note','没有待审核的泡泡'));
  await authorsFor(rows);
  rows.forEach(b=>{
    const hot = (b.report_count||0) >= Number(setGet('report_hide_threshold',3));
    const r = bubbleRow(b, '举报 '+(b.report_count||0)+' 次 · 赞 '+(b.like_count||0)+' · 踩 '+(b.dislike_count||0)+' · 出现 '+(b.show_count||0)+' · 查看 '+(b.view_count||0)+' · ');
    if(hot) r.classList.add('review-hot');
    if(b.status==='hidden'){ const tg=h('span','hidden-tag','已自动隐藏'); r.appendChild(tg); }
    const det = h('button','pill-btn','处理'); det.onclick=()=>renderReviewDetail(b);
    r.appendChild(det); card.appendChild(r);
  });
  wrap.appendChild(card);
  /* 处理记录 */
  const logCard = h('div','card'); logCard.appendChild(h('h3',null,'处理记录'));
  const { data: logs } = await sb.from('admin_logs').select('*').order('created_at',{ascending:false}).limit(20);
  if(!logs || !logs.length) logCard.appendChild(h('div','empty-note','暂无记录'));
  (logs||[]).forEach(l=>{
    const r = h('div','row-line');
    const g = h('div','grow'); g.append(h('div','t1', String(l.action||'')), h('div','t2', fmtDate(l.created_at)));
    r.appendChild(g); logCard.appendChild(r);
  });
  wrap.appendChild(logCard); wrap.appendChild(copyrightEl());
}
function renderReviewDetail(b){
  S.view='admin'; showPage('admin');
  const wrap = $('pageWrap'); wrap.innerHTML='';
  wrap.appendChild(backLink('返回待审核', renderAdminReviews));
  const a = authorOf(b);
  const card = h('div','card');
  card.appendChild(h('h3',null,'审核详情'));
  const info = h('div','ex-stats');
  info.textContent = '发布者：'+(a.nickname||'用户')+'（ID '+a.user_no+'） · 类型：'+TYPE_META[b.type].name+' · '+b.cost+' 分 · 发布于 '+fmtDate(b.created_at);
  card.appendChild(info);
  const rc = h('div'); rc.style.cssText='font-size:15px;font-weight:700;color:var(--red);margin:8px 0';
  rc.textContent = '被举报 '+(b.report_count||0)+' 次'+(b.status==='hidden'?' · 已自动隐藏':'');
  card.appendChild(rc);
  if(b.type==='text') card.appendChild(h('div','ex-content', b.content||''));
  else{
    if(isHttps(b.media_url)){ const im=h('div','ex-media-note','媒体链接：'+b.media_url); card.appendChild(im); }
    if(b.content) card.appendChild(h('div','ex-media-note', b.content));
  }
  const prev = h('button','ghost-btn','预览（按世界样式打开）'); prev.style.marginBottom='10px';
  prev.onclick=()=>openExpand(b,'admin');
  card.appendChild(prev);
  const row = h('div'); row.style.display='flex'; row.style.gap='8px'; row.style.flexWrap='wrap';
  const act = async (action, label)=>{
    if(action==='delete'){ confirmBox('删除这个泡泡？','删除后不退还积分。','删除',true, async ()=>{ const { error } = await sb.rpc('admin_review',{ p_bubble:b.id, p_action:'delete' }); if(error){ toast(errText(error)); return; } toast('已删除'); renderAdminReviews(); }); return; }
    const { error } = await sb.rpc('admin_review',{ p_bubble:b.id, p_action:action });
    if(error){ toast(errText(error)); return; }
    toast(label+'完成'); renderAdminReviews();
  };
  const b1 = h('button','pill-btn','恢复显示'); b1.onclick=()=>act('restore','恢复显示');
  const b2 = h('button','pill-btn gray','下架'); b2.onclick=()=>act('hide','下架');
  const b3 = h('button','pill-btn red','删除'); b3.onclick=()=>act('delete','删除');
  row.append(b1,b2,b3); card.appendChild(row);
  wrap.appendChild(card); wrap.appendChild(copyrightEl());
}
/* ---------- 泡泡管理 ---------- */
let ABF = { date:'all', type:'all', cost:'all', status:'all', kw:'' };
async function renderAdminBubbles(){
  S.view='adminBubbles'; showPage('admin');
  const wrap = $('pageWrap'); wrap.innerHTML='';
  wrap.appendChild(backLink('返回后台', renderAdminHome));
  const card = h('div','card'); card.appendChild(h('h3',null,'泡泡管理'));
  const kwF = h('div','field'); const kw = h('input'); kw.placeholder='搜索文字内容关键词'; kw.value=ABF.kw;
  kw.onchange=()=>{ ABF.kw=kw.value.trim(); renderAdminBubbles(); };
  kwF.appendChild(kw); card.appendChild(kwF);
  const mkChips = (label, key, opts)=>{
    const lab = h('div','sub', label); lab.style.margin='8px 0 6px'; card.appendChild(lab);
    const row = h('div','chips');
    opts.forEach(([v,t])=>{ const c=h('button','chip'+(ABF[key]===v?' on':''), t); c.onclick=()=>{ ABF[key]=v; renderAdminBubbles(); }; row.appendChild(c); });
    card.appendChild(row);
  };
  mkChips('日期','date',[['all','全部'],['today','今天'],['7d','近 7 天'],['30d','近 30 天']]);
  mkChips('类型','type',[['all','全部'],['text','文字'],['image','图片'],['audio','音频'],['video','视频']]);
  mkChips('档位','cost',[['all','全部'],['5','5'],['10','10'],['20','20'],['50','50'],['100','100']]);
  mkChips('状态','status',[['all','全部'],['visible','展示中'],['hidden','已下架'],['deleted','已删除']]);
  const listBox = h('div'); listBox.style.marginTop='10px'; card.appendChild(listBox);
  wrap.appendChild(card); wrap.appendChild(copyrightEl());
  let q = sb.from('bubbles').select('*').order('created_at',{ascending:false}).limit(100);
  if(ABF.status==='deleted') q = q.not('deleted_at','is',null);
  else if(ABF.status==='visible'||ABF.status==='hidden'){ q = q.is('deleted_at',null).eq('status', ABF.status); }
  if(ABF.type!=='all') q = q.eq('type', ABF.type);
  if(ABF.cost!=='all') q = q.eq('cost', Number(ABF.cost));
  if(ABF.kw) q = q.ilike('content', '%'+ABF.kw.replace(/[%_]/g,'')+'%');
  if(ABF.date!=='all'){
    const days = ABF.date==='today' ? 0 : ABF.date==='7d' ? 7 : 30;
    const since = new Date(Date.now() - days*86400*1000); if(days===0) since.setHours(0,0,0,0);
    q = q.gte('created_at', since.toISOString());
  }
  const { data, error } = await q;
  if(error){ listBox.appendChild(h('div','empty-note', errText(error))); return; }
  await authorsFor(data||[]);
  if(!data || !data.length) listBox.appendChild(h('div','empty-note','没有符合条件的泡泡'));
  (data||[]).forEach(b=>{
    const a = authorOf(b);
    const r = bubbleRow(b, (a.nickname||'用户')+' · '+b.cost+' 分 · '+(b.deleted_at?'已删除':b.status==='hidden'?'已下架':'展示中')+' · ');
    const prev = h('button','pill-btn','预览'); prev.onclick=()=>openExpand(b,'admin');
    r.appendChild(prev);
    if(!b.deleted_at){
      if(b.status==='hidden'){ const rs=h('button','pill-btn','恢复'); rs.onclick=async()=>{ const { error } = await sb.rpc('admin_bubble_action',{ p_bubble:b.id, p_action:'restore' }); if(error) toast(errText(error)); else { toast('已恢复'); renderAdminBubbles(); } }; r.appendChild(rs); }
      else { const hd=h('button','pill-btn gray','下架'); hd.onclick=async()=>{ const { error } = await sb.rpc('admin_bubble_action',{ p_bubble:b.id, p_action:'hide' }); if(error) toast(errText(error)); else { toast('已下架'); S.pool=S.pool.filter(x=>x.id!==b.id); renderAdminBubbles(); } }; r.appendChild(hd); }
      const del = h('button','pill-btn red','删除'); del.onclick=()=>confirmDeleteBubble(b,false); r.appendChild(del);
    }
    listBox.appendChild(r);
  });
}
/* ---------- 用户管理 ---------- */
async function renderAdminUsers(kwVal){
  S.view='admin'; showPage('admin');
  const wrap = $('pageWrap'); wrap.innerHTML='';
  wrap.appendChild(backLink('返回后台', renderAdminHome));
  const card = h('div','card'); card.appendChild(h('h3',null,'用户管理'));
  const f = h('div','field'); const inp = h('input'); inp.placeholder='搜索昵称 / 邮箱 / 用户 ID'; inp.value=kwVal||'';
  inp.onchange=()=>renderAdminUsers(inp.value.trim());
  f.appendChild(inp); card.appendChild(f);

  const kwv = (kwVal||'').trim();
  if(kwv){
    if(/^\d+$/.test(kwv)) q = q.eq('user_no', Number(kwv));
    else q = q.or('nickname.ilike.%'+kwv.replace(/[%_,()]/g,'')+'%,email.ilike.%'+kwv.replace(/[%_,()]/g,'')+'%');
  }
  const { data, error } = await q;
  if(error){ listBox.appendChild(h('div','empty-note', errText(error))); return; }
  if(!data || !data.length) listBox.appendChild(h('div','empty-note','没有符合条件的用户'));
  (data||[]).forEach(u=>{
    const r = h('div','row-line');

    g.append(t1, h('div','t2', (u.email||'')+' · 积分 '+u.points+' · 注册 '+fmtDate(u.created_at)));

function renderAdminUserDetail(u){
  S.view='admin'; showPage('admin');
  const wrap = $('pageWrap'); wrap.innerHTML='';
  wrap.appendChild(backLink('返回用户管理', ()=>renderAdminUsers('')));
  const card = h('div','card');
  card.appendChild(h('h3',null,(u.nickname||'用户')+' · ID '+u.user_no));
  [['邮箱',u.email||''],['积分余额',String(u.points||0)],['注册日期',fmtDate(u.created_at)],['状态',u.is_banned?'已封禁':'正常'],['封禁原因',u.ban_reason||'—']].forEach(([k,v])=>{

  else { const bn=h('button','pill-btn gray','封禁'); bn.onclick=()=>{
    const c = h('div','confirm-card'); c.appendChild(h('h3',null,'封禁该用户？'));
    c.appendChild(h('p',null,'封禁后能登录浏览，但不能发布、不能签到；已发布泡泡保留展示。'));
    const f = h('div','field'); f.style.marginTop='10px'; const inp=h('input'); inp.placeholder='封禁原因（必填）'; f.appendChild(inp); c.appendChild(f);
    const btns=h('div','confirm-btns'); const ca=h('button',null,'取消'); ca.onclick=closeModal;
    const ok=h('button','danger','封禁'); ok.onclick=async()=>{ const reason=inp.value.trim(); if(!reason){ toast('请填写封禁原因'); return; } closeModal(); const { error } = await sb.rpc('admin_set_ban',{ p_user:u.id, p_ban:true, p_reason:reason }); if(error) toast(errText(error)); else { toast('已封禁'); renderAdminUsers(''); } };
    btns.append(ca,ok); c.appendChild(btns); openModal(c);
  }; row.appendChild(bn); }
  const del = h('button','pill-btn red','删除账号');
  del.onclick=()=>confirmBox('删除该账号？','该用户将无法登录，其泡泡一并删除。此操作请谨慎。','删除账号',true, async ()=>{
    const { error } = await sb.rpc('admin_delete_user',{ p_user:u.id });
    if(error){ toast(errText(error)); return; }
    toast('账号已删除'); renderAdminUsers('');
  });
  row.appendChild(del);
  card.appendChild(row); wrap.appendChild(card); wrap.appendChild(copyrightEl());
}
function openGift(u){
  const card = h('div','confirm-card');
  card.appendChild(h('h3',null,'赠送积分'));
  card.appendChild(h('p',null,'给「'+(u.nickname||'用户')+'」（ID '+u.user_no+'）赠送积分'));
  const opts = h('div','gift-opts'); let amount = 10;
  [5,10,50,100].forEach(v=>{
    const b = h('button','gift-opt'+(v===10?' on':''), String(v));
    b.onclick=()=>{ amount=v; custom.value=''; opts.querySelectorAll('.gift-opt').forEach(x=>x.classList.remove('on')); b.classList.add('on'); };
    opts.appendChild(b);
  });
  card.appendChild(opts);
  const f = h('div','field'); const custom = h('input'); custom.type='number'; custom.min='1'; custom.placeholder='或输入自定义数量';
  custom.oninput=()=>{ if(custom.value) opts.querySelectorAll('.gift-opt').forEach(x=>x.classList.remove('on')); };
  f.appendChild(custom); card.appendChild(f);
  const nf = h('div','field'); const note = h('input'); note.placeholder='备注（选填）'; nf.appendChild(note); card.appendChild(nf);
  const btns = h('div','confirm-btns');
  const ca = h('button',null,'取消'); ca.onclick=closeModal;
  const ok = h('button','primary','确定');
  ok.onclick = async ()=>{
    const finalAmt = custom.value ? Number(custom.value) : amount;
    if(!finalAmt || finalAmt<=0 || !Number.isFinite(finalAmt)){ toast('先输入有效数量'); return; }
    closeModal();
    const { error } = await sb.rpc('admin_gift_points',{ p_user_no:u.user_no, p_amount:Math.floor(finalAmt), p_note:note.value.trim()||null });
    if(error){ toast(errText(error)); return; }
    toast('已赠送 '+Math.floor(finalAmt)+' 积分'); renderAdminUsers('');
  };
  btns.append(ca, ok); card.appendChild(btns); openModal(card);
}
/* ---------- 授权码 ---------- */
let CODEF = 'all', CODESEL = new Set();
async function renderAdminCodes(){
