<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F7">
<title>短视频解析</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { touch-action:manipulation; }
  body {
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    background:#F5F5F7; color:#1D1D1F; min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  header {
    position:fixed; top:0; left:0; right:0; height:64px; z-index:50;
    background:rgba(245,245,247,.72); backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:1px solid rgba(0,0,0,.06);
    display:flex; align-items:center; justify-content:center;
  }
  header .logo { font-size:17px; font-weight:600; letter-spacing:.02em; cursor:pointer; user-select:none; }
  main { max-width:680px; margin:0 auto; padding:128px 20px 80px; }
  .card {
    background:#fff; border-radius:20px; padding:20px;
    box-shadow:0 4px 24px rgba(0,0,0,.05);
  }
  textarea {
    width:100%; border:none; outline:none; resize:none; background:transparent;
    font-size:16px; line-height:1.55; color:#1D1D1F; font-family:inherit;
    min-height:104px;
  }
  textarea::placeholder { color:#86868B; }
  .extract {
    display:flex; align-items:center; gap:8px; margin-top:6px; padding:10px 12px;
    background:#F5F5F7; border-radius:12px; font-size:13px; color:#515154;
    min-width:0;
  }
  .extract svg { flex:none; color:#86868B; }
  .extract .u { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0; }
  .tag {
    flex:none; font-size:12px; font-weight:600; color:#FA243C;
    background:rgba(250,36,60,.08); padding:3px 9px; border-radius:999px;
  }
  .actions { display:flex; align-items:center; gap:10px; margin-top:16px; }
  .btn {
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
    border:none; cursor:pointer; font-family:inherit; font-size:15px; font-weight:500;
    height:44px; padding:0 18px; border-radius:999px; transition:transform .12s, opacity .2s, background .2s;
    user-select:none;
  }
  .btn:active { transform:scale(.97); }
  .btn.ghost { background:#F5F5F7; color:#1D1D1F; }
  .btn.ghost:hover { background:#ECECF0; }
  .btn.primary { background:#FA243C; color:#fff; flex:1; font-weight:600; }
  .btn.primary:disabled { opacity:.45; cursor:default; transform:none; }
  .btn.dark { background:#1D1D1F; color:#fff; }
  .btn.block { width:100%; }
  .support {
    text-align:center; color:#86868B; font-size:13px; margin-top:28px; letter-spacing:.06em;
  }
  /* result */
  #resultCard { margin-top:36px; display:none; }
  #resultCard.show { display:block; animation:up .35s ease; }
  @keyframes up { from { opacity:0; transform:translateY(10px);} to { opacity:1; transform:none;} }
  .player {
    border-radius:14px; overflow:hidden; background:#000; margin:-20px -20px 0;
    border-radius:20px 20px 0 0;
  }
  .player video { width:100%; max-height:68vh; display:block; background:#000; }
  .rbody { padding-top:18px; }
  .player + .rbody { padding-top:16px; }
  .coverOnly { margin:-20px -20px 0; }
  .coverOnly img { width:100%; max-height:52vh; object-fit:cover; display:block; }
  .rtitle { font-size:17px; font-weight:600; line-height:1.45; word-break:break-word; }
  .author { display:flex; align-items:center; gap:9px; margin-top:12px; }
  .author img { width:30px; height:30px; border-radius:50%; object-fit:cover; background:#E8E8ED; }
  .author .an { font-size:14px; color:#515154; }
  .author .meta { margin-left:auto; font-size:13px; color:#86868B; flex:none; }
  .rbtns { display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }
  .rbtns .btn { flex:1; min-width:120px; }
  .backups { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .backups .btn { height:38px; font-size:13px; padding:0 14px; flex:none; }
  .imgs { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:4px; }
  .imgs figure { position:relative; border-radius:12px; overflow:hidden; background:#E8E8ED; aspect-ratio:3/4; }
  .imgs img { width:100%; height:100%; object-fit:cover; display:block; }
  .imgs button {
    position:absolute; right:6px; bottom:6px; width:32px; height:32px; border:none; border-radius:50%;
    background:rgba(0,0,0,.55); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer;
    backdrop-filter:blur(6px);
  }
  .parts { margin-top:6px; }
  .part {
    display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:none; cursor:pointer;
    background:#F5F5F7; border-radius:12px; padding:12px 14px; font-family:inherit; margin-top:8px;
  }
  .part .pt { flex:1; min-width:0; font-size:14px; color:#1D1D1F; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .part .pd { font-size:12px; color:#86868B; flex:none; }
  .part svg { color:#515154; flex:none; }
  .musicRow { display:flex; align-items:center; gap:10px; margin-top:14px; background:#F5F5F7; border-radius:12px; padding:10px 12px; }
  .musicRow audio { flex:1; height:36px; min-width:0; }
  .musicRow button { flex:none; width:36px; height:36px; border:none; border-radius:50%; background:#1D1D1F; color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .sect { font-size:13px; font-weight:600; color:#86868B; margin-top:20px; letter-spacing:.04em; }
  /* loading */
  #loading { display:none; text-align:center; padding:56px 0 8px; }
  #loading.show { display:block; }
  .spin {
    width:30px; height:30px; margin:0 auto; border-radius:50%;
    border:3px solid rgba(0,0,0,.1); border-top-color:#1D1D1F;
    animation:sp 0.8s linear infinite;
  }
  @keyframes sp { to { transform:rotate(360deg);} }
  /* toast */
  #toast {
    position:fixed; top:calc(64px + env(safe-area-inset-top) + 10px); left:50%; transform:translate(-50%,-8px);
    background:rgba(29,29,31,.92); color:#fff; font-size:14px; padding:10px 18px; border-radius:999px;
    opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:99; max-width:88vw;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #toast.show { opacity:1; transform:translate(-50%,0); }
  @media (max-width:560px) {
    main { padding:104px 16px 64px; }
    .card { padding:16px; border-radius:18px; }
    .player { margin:-16px -16px 0; border-radius:18px 18px 0 0; }
    .coverOnly { margin:-16px -16px 0; }
    .btn { padding:0 14px; }
  }
</style>
</head>
<body>
<header><div class="logo" id="logo">短视频解析</div></header>
<main>
  <section class="card">
    <textarea id="input" rows="4" placeholder="粘贴分享链接或整段文案" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
    <div class="extract" id="extractRow" hidden>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      <span class="u" id="extractUrl"></span>
      <span class="tag" id="extractPlat" hidden></span>
    </div>
    <div class="actions">
      <button class="btn ghost" id="pasteBtn" type="button">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
        粘贴
      </button>
      <button class="btn ghost" id="clearBtn" type="button">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        清空
      </button>
      <button class="btn primary" id="parseBtn" type="button">解析</button>
    </div>
  </section>
  <p class="support">抖音 · 快手 · 小红书 · 哔哩哔哩 · 微博 · 今日头条 · 西瓜视频 · 皮皮虾</p>

  <div id="loading"><div class="spin"></div></div>

  <section class="card" id="resultCard">
    <div id="mediaBox"></div>
    <div class="rbody" id="resultBody"></div>
  </section>
</main>
<div id="toast"></div>

<script>
'use strict';
var API = 'https://api.bugpk.com';
var PROXY = 'https://feiyu-proxy.netlify.app/api/proxy?url=';

var PLATFORMS = [
  { key:'douyin',      name:'抖音',     hosts:['douyin.com','iesdouyin.com','amemv.com'],        api:'/api/douyin' },
  { key:'kuaishou',    name:'快手',     hosts:['kuaishou.com','gifshow.com','chenzhongtech.com'], api:'/api/ksjx' },
  { key:'xiaohongshu', name:'小红书',   hosts:['xiaohongshu.com','xhslink.com'],                  api:'/api/xhsjx' },
  { key:'bilibili',    name:'哔哩哔哩', hosts:['bilibili.com','b23.tv'],                          api:'/api/bilibili' },
  { key:'toutiao',     name:'今日头条', hosts:['toutiao.com'],                                    api:'/api/toutiao' },
  { key:'weibo',       name:'微博',     hosts:['weibo.com','weibo.cn'],                           api:null },
  { key:'xigua',       name:'西瓜视频', hosts:['ixigua.com'],                                     api:null },
  { key:'pipixia',     name:'皮皮虾',   hosts:['pipix.com','pipixia.com','ippzone.com'],          api:null },
  { key:'weishi',      name:'微视',     hosts:['weishi.qq.com'],                                  api:null },
  { key:'tiktok',      name:'TikTok',   hosts:['tiktok.com'],                                     api:null }
];

/* ---------- link extraction ---------- */
function cleanUrl(u) {
  if (!u) return '';
  u = u.split(/[\u4e00-\u9fff\u3000-\u303f\uff00-\uffef]/)[0];
  u = u.replace(/[)\]}>.,;:!?'"`]+$/, '');
  u = u.replace(/\/:[A-Za-z0-9]{1,8}\/?$/, '/');
  return u;
}
function extractAllUrls(text) {
  if (!text) return [];
  var t = String(text).replace(/[\u200b-\u200f\ufeff]/g, ' ');
  var out = [], m;
  var re = /https?:\/\/[^\s"'<>]+/gi;
  while ((m = re.exec(t)) !== null) { var c = cleanUrl(m[0]); if (c) out.push(c); }
  if (!out.length) {
    var re2 = /(?:[a-z0-9-]+\.)+(?:com|cn|net|tv|io|app)(?:\/[^\s"'<>]*)?/gi;
    while ((m = re2.exec(t)) !== null) { var c2 = cleanUrl(m[0]); if (c2) out.push('https://' + c2); }
  }
  return out;
}
function detectPlatform(url) {
  var host = '';
  try { host = new URL(url).hostname.toLowerCase(); } catch (e) { return null; }
  for (var i = 0; i < PLATFORMS.length; i++) {
    var p = PLATFORMS[i];
    for (var j = 0; j < p.hosts.length; j++) {
      if (host === p.hosts[j] || host.endsWith('.' + p.hosts[j])) return p;
    }
  }
  return null;
}
function extractUrl(text) {
  var urls = extractAllUrls(text);
  if (!urls.length) return '';
  for (var i = 0; i < urls.length; i++) if (detectPlatform(urls[i])) return urls[i];
  return urls[0];
}

/* ---------- api ---------- */
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
async function fetchJsonOnce(target) {
  try {
    var r = await fetch(target, { method: 'GET' });
    return await r.json();
  } catch (e) {
    var rp = await fetch(PROXY + encodeURIComponent(target), { method: 'GET' });
    return await rp.json();
  }
}
async function fetchApi(apiPath, link) {
  var target = API + apiPath + '?url=' + encodeURIComponent(link);
  var json = null;
  for (var i = 0; i < 3; i++) {
    json = await fetchJsonOnce(target);
    if (json && (json.code === 429 || /concurrency|频繁|稍后/.test(String(json.msg || '')))) {
      if (i < 2) { await sleep(((json.retry_after || 3) * 1000)); continue; }
    }
    break;
  }
  return json;
}
function str(v) { return typeof v === 'string' ? v : ''; }
function normalizeBackup(b) {
  var out = [];
  if (!b) return out;
  if (typeof b === 'string') return [{ url: b, label: '原画' }];
  var arr = Array.isArray(b) ? b : [b];
  arr.forEach(function (x) {
    if (typeof x === 'string') out.push({ url: x, label: '备用' });
    else if (x && x.url) out.push({ url: x.url, label: x.quality || '备用', sizeLabel: x.size_label || '' });
  });
  return out;
}
function normalize(json) {
  if (!json) return null;
  var d = json.data;
  if (!d || typeof d !== 'object' || Array.isArray(d)) return null;
  var images = [];
  if (Array.isArray(d.images)) d.images.forEach(function (im) {
    if (typeof im === 'string') images.push(im);
    else if (im && (im.url || im.image)) images.push(im.url || im.image);
  });
  var live = [];
  if (Array.isArray(d.live_photo)) d.live_photo.forEach(function (lp) {
    if (lp && (lp.video || lp.image)) live.push({ image: lp.image || '', video: lp.video || '' });
  });
  var videos = [];
  if (Array.isArray(d.videos)) d.videos.forEach(function (v) {
    if (v && v.url) videos.push({ title: v.title || '', url: v.url, durationFormat: v.durationFormat || '' });
  });
  var video = str(d.url);
  if (!video && !images.length && !live.length && !videos.length) return null;
  var authorObj = (d.author && typeof d.author === 'object') ? d.author : null;
  var authorName = (d.user && d.user.name) || (authorObj && authorObj.name) || (typeof d.author === 'string' ? d.author : '') || str(d.auther);
  var authorAvatar = (d.user && d.user.avatar) || (authorObj && authorObj.avatar) || str(d.avatar);
  var backups = normalizeBackup(d.video_backup).filter(function (b) { return b.url !== video; });
  return {
    title: str(d.title) || str(d.desc),
    authorName: authorName || '',
    authorAvatar: authorAvatar || '',
    cover: str(d.cover),
    video: video,
    quality: str(d.quality),
    sizeLabel: str(d.size_label),
    duration: typeof d.duration === 'number' ? d.duration : null,
    backups: backups,
    images: images,
    livePhotos: live,
    videos: videos,
    music: (d.music && d.music.url) ? { title: d.music.title || d.music.name || '', url: d.music.url } : null,
    type: str(d.type)
  };
}
async function parseLink(link) {
  var plat = detectPlatform(link);
  var paths = [];
  if (plat && plat.api) paths.push(plat.api);
  paths.push('/api/short_videos');
  var lastMsg = '';
  for (var i = 0; i < paths.length; i++) {
    var json = await fetchApi(paths[i], link);
    var n = normalize(json);
    if (n) { n.platformName = (plat && plat.name) || json.platform || ''; return n; }
    if (json && json.msg) lastMsg = json.msg;
  }
  throw new Error(lastMsg || '解析失败');
}

/* ---------- download ---------- */
function sanitizeName(s) {
  return String(s || '').replace(/[\\/:*?"<>|\s]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 40);
}
async function downloadFile(url, filename) {
  toast('正在下载…');
  var blob = null;
  try {
    var r = await fetch(url);
    if (!r.ok) throw new Error('bad');
    blob = await r.blob();
  } catch (e) {
    try {
      var rp = await fetch(PROXY + encodeURIComponent(url));
      if (!rp.ok) throw new Error('bad');
      blob = await rp.blob();
    } catch (e2) { blob = null; }
  }
  if (blob) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  } else {
    window.open(url, '_blank');
  }
}
function copyText(t) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(t).then(function () { toast('已复制'); }).catch(function () { fallbackCopy(t); });
  }
  fallbackCopy(t);
}
function fallbackCopy(t) {
  var ta = document.createElement('textarea');
  ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('已复制'); } catch (e) { toast('复制失败'); }
  ta.remove();
}

/* ---------- ui ---------- */
var $ = function (id) { return document.getElementById(id); };
var input = $('input'), extractRow = $('extractRow'), extractUrlEl = $('extractUrl'), extractPlat = $('extractPlat');
var parseBtn = $('parseBtn'), loading = $('loading'), resultCard = $('resultCard');
var mediaBox = $('mediaBox'), resultBody = $('resultBody');
var toastTimer = null, parsing = false, lastParsedLink = '';

function toast(msg) {
  var t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2200);
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
var ICON_DL = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
var ICON_COPY = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';

function refreshExtract() {
  var link = extractUrl(input.value);
  if (link) {
    extractRow.hidden = false;
    extractUrlEl.textContent = link;
    var p = detectPlatform(link);
    if (p) { extractPlat.hidden = false; extractPlat.textContent = p.name; }
    else extractPlat.hidden = true;
  } else {
    extractRow.hidden = true;
  }
  return link;
}
function fmtDur(s) {
  if (!s && s !== 0) return '';
  s = Math.round(s);
  var m = Math.floor(s / 60), ss = s % 60;
  return m + ':' + (ss < 10 ? '0' : '') + ss;
}
function render(n, link) {
  mediaBox.innerHTML = '';
  resultBody.innerHTML = '';
  var base = sanitizeName(n.title) || 'video';
  if (n.video) {
    var pd = document.createElement('div'); pd.className = 'player';
    var v = document.createElement('video');
    v.src = n.video; v.controls = true; v.playsInline = true; v.preload = 'metadata';
    if (n.cover) v.poster = n.cover;
    pd.appendChild(v); mediaBox.appendChild(pd);
  } else if (n.cover && !n.images.length) {
    var cd = document.createElement('div'); cd.className = 'coverOnly';
    var im = document.createElement('img'); im.src = n.cover; im.alt = '';
    cd.appendChild(im); mediaBox.appendChild(cd);
  }
  var html = '';
  if (n.images.length) {
    html += '<div class="imgs">' + n.images.map(function (src, i) {
      return '<figure><img loading="lazy" src="' + esc(src) + '" alt=""><button type="button" data-img="' + i + '" aria-label="下载">' + ICON_DL + '</button></figure>';
    }).join('') + '</div>';
  }
  if (n.livePhotos.length) {
    html += '<div class="sect">实况照片</div><div class="imgs">' + n.livePhotos.map(function (lp, i) {
      return '<figure><img loading="lazy" src="' + esc(lp.image) + '" alt=""><button type="button" data-live="' + i + '" aria-label="下载">' + ICON_DL + '</button></figure>';
    }).join('') + '</div>';
  }
  if (n.title) html += '<div class="rtitle" style="margin-top:16px">' + esc(n.title) + '</div>';
  if (n.authorName || n.duration || n.sizeLabel) {
    html += '<div class="author">' +
      (n.authorAvatar ? '<img src="' + esc(n.authorAvatar) + '" alt="">' : '') +
      '<span class="an">' + esc(n.authorName) + '</span>' +
      '<span class="meta">' + esc([n.duration ? fmtDur(n.duration) : '', n.sizeLabel || ''].filter(Boolean).join(' · ')) + '</span></div>';
  }
  if (n.video) {
    html += '<div class="rbtns">' +
      '<button class="btn dark" type="button" id="dlVideo">' + ICON_DL + '下载视频</button>' +
      '<button class="btn ghost" type="button" id="cpVideo">' + ICON_COPY + '复制直链</button></div>';
    if (n.backups.length) {
      html += '<div class="backups">' + n.backups.map(function (b, i) {
        return '<button class="btn ghost" type="button" data-backup="' + i + '">' + ICON_DL + esc(b.label) + (b.sizeLabel ? ' · ' + esc(b.sizeLabel) : '') + '</button>';
      }).join('') + '</div>';
    }
  }
  if (n.videos.length > 1) {
    html += '<div class="sect">分集</div><div class="parts">' + n.videos.map(function (pv, i) {
      return '<button class="part" type="button" data-part="' + i + '"><span class="pt">' + esc(pv.title || ('第' + (i + 1) + '集')) + '</span>' +
        (pv.durationFormat ? '<span class="pd">' + esc(pv.durationFormat) + '</span>' : '') + ICON_DL + '</button>';
    }).join('') + '</div>';
  } else if (n.videos.length === 1 && !n.video) {
    html += '<div class="rbtns"><button class="btn dark block" type="button" data-part="0">' + ICON_DL + '下载视频</button></div>';
  }
  if (n.images.length > 1) {
    html += '<div class="rbtns"><button class="btn dark block" type="button" id="dlAllImg">' + ICON_DL + '全部下载（' + n.images.length + '张）</button></div>';
  }
  if (n.music) {
    html += '<div class="musicRow"><audio controls preload="none" src="' + esc(n.music.url) + '"></audio>' +
      '<button type="button" id="dlMusic" aria-label="下载音乐">' + ICON_DL + '</button></div>';
  }
  resultBody.innerHTML = html;
  resultCard.classList.add('show');

  var dl = $('dlVideo');
  if (dl) dl.addEventListener('click', function () { downloadFile(n.video, base + '.mp4'); });
  var cp = $('cpVideo');
  if (cp) cp.addEventListener('click', function () { copyText(n.video); });
  resultBody.querySelectorAll('[data-backup]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var b = n.backups[Number(btn.getAttribute('data-backup'))];
      if (b) downloadFile(b.url, base + '.mp4');
    });
  });
  resultBody.querySelectorAll('[data-img]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var src = n.images[Number(btn.getAttribute('data-img'))];
      if (src) downloadFile(src, base + '_' + (Number(btn.getAttribute('data-img')) + 1) + '.jpg');
    });
  });
  resultBody.querySelectorAll('[data-live]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var lp = n.livePhotos[Number(btn.getAttribute('data-live'))];
      if (lp && lp.video) downloadFile(lp.video, base + '_live' + (Number(btn.getAttribute('data-live')) + 1) + '.mp4');
    });
  });
  resultBody.querySelectorAll('[data-part]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var pv = n.videos[Number(btn.getAttribute('data-part'))];
      if (pv) downloadFile(pv.url, sanitizeName(pv.title) || base + '.mp4');
    });
  });
  var dai = $('dlAllImg');
  if (dai) dai.addEventListener('click', async function () {
    for (var i = 0; i < n.images.length; i++) {
      await downloadFile(n.images[i], base + '_' + (i + 1) + '.jpg');
      await sleep(600);
    }
  });
  var dm = $('dlMusic');
  if (dm) dm.addEventListener('click', function () { downloadFile(n.music.url, sanitizeName(n.music.title) || 'music' + '.mp3'); });
}

async function doParse() {
  if (parsing) return;
  var link = refreshExtract();
  if (!link) { toast(input.value.trim() ? '没有找到链接' : '请先粘贴链接'); input.focus(); return; }
  parsing = true;
  parseBtn.disabled = true; parseBtn.textContent = '解析中…';
  loading.classList.add('show');
  resultCard.classList.remove('show');
  try {
    var n = await parseLink(link);
    lastParsedLink = link;
    render(n, link);
  } catch (e) {
    toast(e && e.message ? e.message : '解析失败');
  } finally {
    parsing = false;
    parseBtn.disabled = false; parseBtn.textContent = '解析';
    loading.classList.remove('show');
  }
}

input.addEventListener('input', refreshExtract);
input.addEventListener('paste', function () {
  setTimeout(function () {
    var link = refreshExtract();
    if (link && link !== lastParsedLink) doParse();
  }, 60);
});
parseBtn.addEventListener('click', doParse);
$('clearBtn').addEventListener('click', function () {
  input.value = ''; refreshExtract(); resultCard.classList.remove('show'); input.focus();
});
$('pasteBtn').addEventListener('click', async function () {
  try {
    var t = await navigator.clipboard.readText();
    if (t) { input.value = t; var link = refreshExtract(); if (link) doParse(); }
    else toast('剪贴板是空的');
  } catch (e) { toast('请长按输入框粘贴'); input.focus(); }
});
$('logo').addEventListener('click', function () { location.reload(); });

(function initFromQuery() {
  var q = new URLSearchParams(location.search);
  var t = q.get('text') || q.get('url') || '';
  if (t) { input.value = t; if (refreshExtract()) doParse(); }
})();

window.__jiexi = { extractUrl: extractUrl, extractAllUrls: extractAllUrls, detectPlatform: detectPlatform, normalize: normalize, cleanUrl: cleanUrl };
</script>
</body>
</html>
