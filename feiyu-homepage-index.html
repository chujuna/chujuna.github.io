<title>肥鱼</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000000; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #000000;
    color: #f5f5f7;
    overflow: hidden;
    position: relative;
    padding: 24px;
  }
  /* ===== 动态液态背景（zaxu 风格：黑底 + 靛蓝紫柔光场缓慢漂移） ===== */
  .liquid { position: absolute; inset: 0; overflow: hidden; z-index: 0; background: #000000; }
  .glow { position: absolute; }
  .glow.g0 { width: 100%; height: 17vh; left: 0; top: 0; }
  .glow.g0 .glow-in {
    border-radius: 0;
    filter: none;
    background: linear-gradient(180deg, rgba(2, 0, 10, .96) 0%, rgba(6, 0, 26, .58) 45%, rgba(6, 0, 26, 0) 100%);
  }
  .glow-in { width: 100%; height: 100%; border-radius: 50%; filter: blur(48px); }
  .glow.g1 {
    width: 140vmax; height: 95vmax; left: -20vmax; top: -55vmax;
    transform: translate3d(0, 0, 0) scale(1.05);
  }
  .glow.g1 .glow-in {
    background: radial-gradient(ellipse at center, #3100c3 0%, #210086 45%, rgba(9, 0, 36, 0) 72%);
    opacity: .95;
  }
  .glow.g2 {
    width: 95vmax; height: 95vmax; right: -38vmax; top: -18vmax;
  }
  .glow.g2 .glow-in {
    background: radial-gradient(circle at center, #5a00c8 0%, rgba(88, 0, 158, .55) 45%, rgba(0, 0, 0, 0) 70%);
    opacity: .55;
  }
  .glow.g3 {
    width: 105vmax; height: 75vmax; left: -25vmax; top: -8%;
    transform: translate3d(-2vmax, 2vh, 0);
  }
  .glow.g3 .glow-in {
    background: radial-gradient(ellipse at center, #0038b8 0%, rgba(0, 32, 110, .5) 48%, rgba(0, 0, 0, 0) 72%);
    opacity: .62;
  }
  /* 背景已按用户要求冻结为静态（原 tide/driftX/driftY 漂移动画已移除，位置取原动画起始帧构图） */
  /* ===== 主体 ===== */
  main {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    animation: rise .8s ease-out both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .avatar-wrap {
    position: relative;
    width: clamp(120px, 36vw, 150px);
    aspect-ratio: 1 / 1;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }
  .avatar {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    border: 5px solid #ffffff;
    box-shadow: 0 16px 38px rgba(0, 0, 0, .55), 0 0 64px rgba(49, 0, 195, .35);
    display: block;
    animation: spin 24s linear infinite;
    animation-play-state: paused;
  }
  body.playing .avatar { animation-play-state: running; }
  .avatar-wrap { touch-action: pan-y; }
  .avatar { -webkit-user-drag: none; user-select: none; -webkit-user-select: none; }
  html, body { overflow-x: clip; }
  .disc { position: absolute; inset: 0; will-change: transform, opacity; }
  .avatar.cover { position: absolute; inset: 0; opacity: 0; transition: opacity .35s ease; pointer-events: none; }
  .disc.has-cover .avatar.cover { opacity: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .avatar-icon {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .avatar-icon .badge {
    width: 46px; height: 46px; border-radius: 50%;
    background: rgba(20, 20, 25, .42);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .25);
  }
  body.waiting .avatar-icon .badge { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.14); } }
  .avatar-icon svg { width: 22px; height: 22px; fill: #ffffff; display: block; }
  .avatar-icon .icon-play { margin-left: 0; }
  body.playing .avatar-icon .icon-play { display: none; }
  body:not(.playing) .avatar-icon .icon-pause { display: none; }
  @keyframes floaty {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-7px); }
  }
  h1 {
    margin-top: clamp(22px, 4vh, 32px);
    font-size: clamp(36px, 9vw, 48px);
    font-weight: 700;
    letter-spacing: .14em;
    text-indent: .14em;
    line-height: 1.2;
  }
  .subtitle {
    margin-top: 20px;
    font-size: clamp(15px, 4vw, 17px);
    font-weight: 400;
    color: rgba(235, 235, 245, .6);
    letter-spacing: .32em;
    text-indent: .32em;
    line-height: 1.6;
  }
  .mute-hint {
    position: fixed; left: 50%; top: calc(10px + env(safe-area-inset-top)); z-index: 60;
    transform: translate(-50%, -8px); padding: 8px 16px; border-radius: 999px;
    background: rgba(28, 28, 30, .82); color: #F5F5F7; font-size: 13px; letter-spacing: .02em;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; white-space: nowrap;
  }
  .mute-hint.show { opacity: 1; transform: translate(-50%, 0); }
  .lyrics {
    margin-top: 26px;
    width: 100vw;
    max-width: 600px;
    height: 150px;
    overflow-y: auto;
    overflow-x: hidden;
    touch-action: pan-y;
    overscroll-behavior: contain;
    scrollbar-width: none;
    cursor: grab;
    -webkit-mask-image: linear-gradient(180deg, transparent, #000 22%, #000 78%, transparent);
    mask-image: linear-gradient(180deg, transparent, #000 22%, #000 78%, transparent);
  }
  .lyrics::-webkit-scrollbar { display: none; }
  .lyrics-inner { width: 100%; padding: 60px 0; }
  .lrow {
    height: 30px; line-height: 30px;
    font-size: 15px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: rgba(235, 235, 245, .78); text-align: center;
    transition: opacity .3s ease, transform .3s ease;
  }
  .lrow.r0 { transform: scale(1.18); font-weight: 700; color: #ffffff; opacity: 1; letter-spacing: .02em; }
  .lrow.r1 { opacity: .5; }
  .lrow.r2 { opacity: .22; }
  .lrow.r3 { opacity: .1; }
  @media (prefers-reduced-motion: reduce) {
    main, .avatar, .glow { animation: none; }
  }
</style>
<style>*{touch-action:manipulation}</style>

    <h1>肥鱼</h1>
    <p class="subtitle">活成自己想要的样子</p>
    <div class="lyrics" id="lyricsBox" title="滑动歌词可以快进 / 快退"><div class="lyrics-inner" id="lyricsInner"></div></div>
  </main>
<div class="mute-hint" id="muteHint">点击任意处取消静音</div>
<audio id="audio" preload="auto" muted autoplay></audio>
<script>
(function () {
  var MUSIC_API = 'https://feiyu-proxy.netlify.app/api/music';
  var audio = document.getElementById('audio');
  var wrap = document.getElementById('avatarWrap');
  var coverImg = document.getElementById('coverImg');
  var disc = document.getElementById('disc');
  var box = document.getElementById('lyricsBox');
  var inner = document.getElementById('lyricsInner');

  /* ---------- 歌词：沿用简化逻辑，数据改为按歌曲解析 LRC 文本 ---------- */
  var LRC = [[0, '正在加载歌单…']];
  var rows = inner.children;
  var ROWH = 30;
  var cur = -1, focus = -1;
  var hold = false, settleTimer = null;
  var centering = false, centerTimer = null;
  var userStopped = false;
  var userUnmuted = false;
  function syncMuteHint() {
    var hint = document.getElementById('muteHint');
    if (hint) { hint.textContent = '点击任意处取消静音'; hint.classList.toggle('show', !userUnmuted && !!audio.muted && curSong >= 0); }
  }

  function parseLrc(text, fallback) {
    var out = [];
    if (text) {
      var ls = String(text).split(/\r?\n/);
      for (var i = 0; i < ls.length; i++) {
        var m = ls[i].match(/\[(\d+):(\d+)(?:\.(\d+))?\](.*)/);
        if (m) {
          var t = (+m[1]) * 60 + (+m[2]) + (m[3] ? +('0.' + m[3]) : 0);
          var txt = m[4].trim();
          if (txt) out.push([Math.round(t * 100) / 100, txt]);
        }
      }
    }
    out.sort(function (a, b) { return a[0] - b[0]; });
    return out.length ? out : [[0, fallback || '']];
  }
  function setLyrics(text, fallback) {
    LRC = parseLrc(text, fallback);
    inner.innerHTML = '';
    for (var b = 0; b < LRC.length; b++) {
      var d0 = document.createElement('div');
      d0.className = 'lrow r3';
      d0.textContent = LRC[b][1];
      inner.appendChild(d0);
    }
    rows = inner.children;
    cur = -1; focus = -1; hold = false;
    box.scrollTop = 0;
  }
  function idx(t) {
    var i = 0;
    for (var k = 0; k < LRC.length; k++) { if (t >= LRC[k][0]) i = k; else break; }
    return i;
  }
  function paint(f) {
    if (f === focus) return;
    var prev = focus; focus = f;
    for (var k = 0; k < rows.length; k++) {
      if (Math.abs(k - f) > 3 && Math.abs(k - prev) > 3) continue;
      var dd = Math.abs(k - f);
      var cls = 'lrow ' + (dd === 0 ? 'r0' : dd === 1 ? 'r1' : dd === 2 ? 'r2' : 'r3');
      if (rows[k].className !== cls) rows[k].className = cls;
    }
  }
  function centerOn(i) {
    var target = i * ROWH;
    if (box.scrollTop === target) return;
    centering = true;
    try { box.scrollTo({ top: target, behavior: 'smooth' }); }
    catch (e) { box.scrollTop = target; }
    if (centerTimer) clearTimeout(centerTimer);
    centerTimer = setTimeout(function () { centering = false; }, 600);
  }
  function follow(i) {
    if (i === cur) return;
    cur = i;
    if (!hold) { paint(i); centerOn(i); }
  }
  function nearest() {
    var n = Math.round(box.scrollTop / ROWH);
    return Math.max(0, Math.min(LRC.length - 1, n));
  }
  function seekTo(i) {
    hold = false;
    if (settleTimer) { clearTimeout(settleTimer); settleTimer = null; }
    cur = i; userStopped = false;
    paint(i); centerOn(i);
    audio.currentTime = LRC[i][0] + 0.01;
    if (audio.paused) tryPlay();
  }
  audio.addEventListener('play', function () {
    document.body.classList.add('playing');
    document.body.classList.remove('waiting');
    errStreak = 0;
    syncMuteHint();
    follow(idx(audio.currentTime));
  });
  audio.addEventListener('pause', function () {
    document.body.classList.remove('playing');
    follow(idx(audio.currentTime));
  });
  audio.addEventListener('timeupdate', function () { follow(idx(audio.currentTime)); });
  audio.addEventListener('seeked', function () { follow(idx(audio.currentTime)); });
  function armSettle() {
    if (settleTimer) clearTimeout(settleTimer);
    settleTimer = setTimeout(function () {
      settleTimer = null;
      var n = nearest();
      if (n === cur && box.scrollTop === cur * ROWH) { hold = false; return; }
      seekTo(n);
    }, 280);
  }
  box.addEventListener('scroll', function () {
    if (centering) {
      if (box.scrollTop === cur * ROWH) centering = false;
      return;
    }
    if (!hold && box.scrollTop === cur * ROWH) return;
    hold = true;
    paint(nearest());
    armSettle();
  }, { passive: true });
  box.addEventListener('pointerdown', function () { hold = true; centering = false; }, { passive: true });
  box.addEventListener('wheel', function () { hold = true; centering = false; armSettle(); }, { passive: true });
  window.addEventListener('pointerup', function () { if (hold) armSettle(); }, { passive: true });
  inner.addEventListener('click', function (e) {
    var t = e.target;
    if (t && t.classList && t.classList.contains('lrow')) {
      var ix = Array.prototype.indexOf.call(rows, t);
      if (ix >= 0) seekTo(ix);
    }
  });

  /* ---------- 临时诊断：记录播放事件到本地，左下角「诊断」按钮打开面板 ---------- */
  var DIAG = [];
  try { DIAG = JSON.parse(localStorage.getItem('fy_diag_v1') || '[]'); } catch (e) { DIAG = []; }
  var DIAG_T0 = Date.now();
  function logEv(s) {
    var line = ((Date.now() - DIAG_T0) / 1000).toFixed(1) + 's ' + s;
    DIAG.push(line);
    if (DIAG.length > 60) DIAG = DIAG.slice(DIAG.length - 60);
    try { localStorage.setItem('fy_diag_v1', JSON.stringify(DIAG)); } catch (e) {}
    var pre = document.getElementById('diagPre');
    if (pre && document.getElementById('diagPanel').style.display !== 'none') pre.textContent = DIAG.join('\n');
  }
  (function buildDiag() {
    var btn = document.createElement('button');
    btn.id = 'diagBtn';
    btn.textContent = '诊断';
    btn.style.cssText = 'position:fixed;left:10px;bottom:10px;z-index:200;padding:5px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(20,20,24,.55);color:rgba(255,255,255,.75);font-size:11px;';
    var panel = document.createElement('div');
    panel.id = 'diagPanel';
    panel.style.cssText = 'position:fixed;left:8px;right:8px;bottom:48px;z-index:200;max-height:55vh;overflow:auto;display:none;background:rgba(0,0,0,.88);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:8px;';
    var pre = document.createElement('pre');
    pre.id = 'diagPre';
    pre.style.cssText = 'margin:0;color:#9fe870;font-size:10px;line-height:1.5;white-space:pre-wrap;word-break:break-all;';
    panel.appendChild(pre);
    document.body.appendChild(btn);
    document.body.appendChild(panel);
    btn.addEventListener('click', function () {
      var show = panel.style.display === 'none';
      panel.style.display = show ? 'block' : 'none';
      if (show) pre.textContent = DIAG.join('\n');
    });
  })();
  logEv('LOAD ua=' + navigator.userAgent);
  ['play', 'pause', 'ended', 'stalled', 'waiting', 'canplay', 'loadstart', 'abort', 'emptied', 'suspend'].forEach(function (ev) {
    audio.addEventListener(ev, function () {
      logEv('EV ' + ev + ' t=' + (audio.currentTime || 0).toFixed(1) + ' rs=' + audio.readyState + ' ns=' + audio.networkState);
    });
  });
  audio.addEventListener('error', function () {
    logEv('EV error code=' + (audio.error ? audio.error.code : '?') + ' t=' + (audio.currentTime || 0).toFixed(1) + ' rs=' + audio.readyState + ' ns=' + audio.networkState);
  });
  document.addEventListener('visibilitychange', function () { logEv('VIS ' + (document.hidden ? 'hidden' : 'visible')); });

  /* 播放发起只有一个入口：直接调 play()，失败静默——恢复交给下面的守护定时器，
     不再用任何“请求中”门闩（门闩卡死正是以前把补播吞掉的元凶） */
  function tryPlay() {
    try {
      var p = audio.play();
      if (p && typeof p.catch === 'function') p.catch(function (e) { logEv('play() REJECTED ' + (e && e.name)); });
    } catch (e) { logEv('play() THREW ' + e.message); }
  }

  /* ---------- 歌单：经 Netlify 函数代调 myhkw（密钥只在函数端） ---------- */
  var playlist = [], curSong = -1, listPromise = null, loadSeq = 0, errStreak = 0;
  var errRetrySeq = -1;
  var songCache = {};
  function fetchJson(u) {
    return fetch(u).then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); });
  }
  function applyList(j) {
    var d = (j && j.data) || {};
    var ids = d.songId || [], names = d.songName || [], artists = d.artistName || [], albums = d.albumName || [], types = d.type || [];
    playlist = ids.map(function (id, i) {
      return { id: id, name: names[i] || '', artist: artists[i] || '', album: albums[i] || '', type: types[i] || 'qq' };
    });
    return playlist;
  }
  function loadList() {
    if (playlist.length) return Promise.resolve(playlist);
    if (listPromise) return listPromise;
    listPromise = fetchJson(MUSIC_API + '?list=1').then(applyList).catch(function (e) { listPromise = null; throw e; });
    return listPromise;
  }
  function resolveSong(song) {
    if (songCache[song.id]) return Promise.resolve(songCache[song.id]);
    return fetchJson(MUSIC_API + '?song=' + encodeURIComponent(song.id) + '&type=' + encodeURIComponent(song.type || 'qq'))
      .then(function (j) { songCache[song.id] = j; return j; });
  }
  /* 双卡封面：当前卡与预览卡整卡滑动切换，播放/暂停角标长在卡上、随卡一起走 */
  var cardA = { el: disc, cover: coverImg };
  var discBEl = disc.cloneNode(true);
  discBEl.id = 'discB';
  var coverB = discBEl.querySelector('.cover');
  if (coverB) { coverB.removeAttribute('id'); coverB.removeAttribute('src'); }
  wrap.appendChild(discBEl);
  var cardB = { el: discBEl, cover: coverB };
  var curCard = cardA, nxtCard = cardB;
  function bindCover(card) {
    if (!card.cover) return;
    card.cover.addEventListener('load', function () { card.el.classList.add('has-cover'); });
    card.cover.addEventListener('error', function () { card.el.classList.remove('has-cover'); });
  }
  bindCover(cardA); bindCover(cardB);
  function setCardCover(card, pic) {
    if (!card.cover) return;
    if (pic && /^https?:\/\//i.test(pic)) card.cover.src = String(pic).replace(/^http:\/\//i, 'https://');
    else card.el.classList.remove('has-cover');
  }
  function slideDist() { return (wrap.clientWidth || 150) + 70; }
  function resetCard(card) {
    card.el.classList.remove('has-cover');
    if (card.cover) card.cover.removeAttribute('src');
    card.el.style.transition = 'none';
    card.el.style.transform = 'translateX(0px)';
    card.el.style.opacity = '0';
    card.el.style.visibility = 'hidden';
  }
  var booted = false, dragSwapping = false, peekId = null, alignAfterSwap, swapTimer = 0, lastDir = -1;
  function finishSwap() {
    var old = curCard; curCard = nxtCard; nxtCard = old;
    resetCard(nxtCard);
    if (alignAfterSwap !== undefined) { setCardCover(curCard, alignAfterSwap); alignAfterSwap = undefined; }
  }
  function swapTo(dir, pic) {
    if (swapTimer) { clearTimeout(swapTimer); swapTimer = 0; finishSwap(); }
    nxtCard.el.style.visibility = 'visible';
    setCardCover(nxtCard, pic);
    var start = function () {
      nxtCard.el.style.transition = 'none';
      nxtCard.el.style.transform = 'translateX(' + (-dir * slideDist()) + 'px)';
      nxtCard.el.style.opacity = '0';
      void nxtCard.el.offsetWidth;
      var tr = 'transform .34s cubic-bezier(.22,.9,.3,1), opacity .34s ease';
      curCard.el.style.transition = tr;
      nxtCard.el.style.transition = tr;
      curCard.el.style.transform = 'translateX(' + (dir * slideDist()) + 'px)';
      curCard.el.style.opacity = '0';
      nxtCard.el.style.transform = 'translateX(0px)';
      nxtCard.el.style.opacity = '1';
      swapTimer = setTimeout(function () { swapTimer = 0; finishSwap(); }, 370);
    };
    start();
  }
  function applyVisual(song, info) {
    if (!booted) { booted = true; setCardCover(curCard, info.pic); return; }
    if (dragSwapping) {
      if (String(song.id) !== String(peekId)) alignAfterSwap = info.pic;
      return;
    }
    swapTo(lastDir || -1, info.pic);
  }
  resetCard(cardB);
  function updateMeta(song) {
    document.title = song.name ? (song.name + ' · 肥鱼小站') : '肥鱼小站';
    if ('mediaSession' in navigator && window.MediaMetadata) {
      try {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: song.name || '肥鱼小站', artist: song.artist || '', album: '肥鱼小站',
          artwork: song._pic ? [{ src: song._pic, sizes: '512x512' }] : []
        });
      } catch (e) {}
    }
  }
  function loadSong(i, autoplay, why) {
    if (!playlist.length) return;
    var seq = ++loadSeq;
    curSong = ((i % playlist.length) + playlist.length) % playlist.length;
    var song = playlist[curSong];
    logEv('loadSong ' + (song.name || song.id) + ' why=' + (why || 'auto') + ' prevT=' + (audio.currentTime || 0).toFixed(1));
    document.body.classList.add('waiting');
    updateMeta(song);
    setLyrics('', (song.name || '') + (song.artist ? ' · ' + song.artist : ''));
    var info0 = songCache[song.id];
    if (info0) { applyLoaded(song, info0, seq, autoplay); return; }
    resolveSong(song).then(function (info) { applyLoaded(song, info, seq, autoplay); }).catch(function () {
      if (seq !== loadSeq) return;
      document.body.classList.remove('waiting');
      song._dead = true;
      if (autoplay) { var ni2 = randomIdx(); if (ni2 >= 0) loadSong(ni2, true, 'resolvefail'); }
    });
  }
  function applyLoaded(song, info, seq, autoplay) {
      if (seq !== loadSeq) return;
      document.body.classList.remove('waiting');
      if (!info || !info.url) {
        song._dead = true;
        if (autoplay) { var ni = randomIdx(); if (ni >= 0) { loadSong(ni, true, 'nourl'); return; } }
        setLyrics('', '这张歌单暂时没有可播放的歌曲');
        return;
      }
      logEv('loaded ' + (song.name || song.id) + ' url=' + (info && info.url ? 'Y' : 'N'));
      song._pic = info.pic ? String(info.pic).replace(/^http:\/\//i, 'https://') : '';
      audio.muted = !userUnmuted;
      audio.src = info.url;
      applyVisual(song, info);
      setLyrics(info.lrc, (song.name || '') + (song.artist ? ' · ' + song.artist : ''));
      updateMeta(song);
      syncMuteHint();
      follow(idx(audio.currentTime || 0));
      if (autoplay && !userStopped) tryPlay();
      prepareNext();
  }
  /* 随机播放：切歌一律随机抽一首不是当前的（池子抽取，只掷一次） */
  function randomIdx() {
    var pool = [];
    for (var i = 0; i < playlist.length; i++) if (i !== curSong && !playlist[i]._dead) pool.push(i);
    if (!pool.length) return -1;
    return pool[Math.floor(Math.random() * pool.length)];
  }
  /* 预加载队列：提前抽定两首并取齐数据（当前首选 + 备选），切歌零等待、零重复请求。
     只预热连接与封面，不用第二个音频元素——iOS 上多媒体元素会互相干扰导致暂停/跳歌 */
  var nextIdx = -1, nextIdx2 = -1;
  var prepSeq = 0;
  function warmInfo(info) {
    if (info.pic) { var im = new Image(); im.src = String(info.pic).replace(/^http:\/\//i, 'https://'); }
    try {
      fetch(info.url, { mode: 'no-cors', headers: { Range: 'bytes=0-0' } })
        .then(function (r) { if (r.body && r.body.cancel) r.body.cancel(); })
        .catch(function () {});
    } catch (e) {}
  }
  function prepareNext() {
    if (playlist.length <= 1) return;
    var token = ++prepSeq, tries = 0;
    (function pick() {
      if (token !== prepSeq) return;
      if (nextIdx >= 0 && nextIdx2 >= 0) return;
      if (tries++ >= 8) return;
      var i = randomIdx();
      if (i < 0) return;
      if (i === nextIdx || i === nextIdx2) { pick(); return; }
      resolveSong(playlist[i]).then(function (info) {
        if (token !== prepSeq) return;
        if (!info || !info.url) { playlist[i]._dead = true; pick(); return; }
        warmInfo(info);
        if (nextIdx < 0) nextIdx = i;
        else if (nextIdx2 < 0) nextIdx2 = i;
        pick();
      }).catch(function () { if (token === prepSeq) { playlist[i]._dead = true; pick(); } });
    })();
  }
  function goNext(why) {
    if (!playlist.length || curSong < 0) return;
    userStopped = false;
    var i = (nextIdx >= 0 && nextIdx !== curSong && !playlist[nextIdx]._dead) ? nextIdx : randomIdx();
    if (i === nextIdx) { nextIdx = nextIdx2; nextIdx2 = -1; }
    else if (i === nextIdx2) { nextIdx2 = -1; }
    if (i < 0) return;
    loadSong(i, true, why);
  }
  function nextSong(why) { lastDir = -1; goNext(why); }
  function prevSong(why) { lastDir = 1; goNext(why); }
  audio.addEventListener('ended', function () { logEv('EV ended(real)'); nextSong('ended'); });
  /* 静音自动播放兜底：数据就绪时若还没播起来就补一脚（被拦截时仍有首次点击兜底） */
  /* 自动播放守护（唯一的恢复机制）：每 2 秒看一眼——本该在播（有歌、不是用户暂停、
     也不是播完）却停着，就再试播一次。简单、持续，不与任何一次性重试互相干扰 */
  var lastGuardLog = 0;
  setInterval(function () {
    if (curSong >= 0 && !userStopped && !audio.ended && audio.paused) {
      if (Date.now() - lastGuardLog > 10000) { lastGuardLog = Date.now(); logEv('guardian tryPlay'); }
      tryPlay();
    }
  }, 2000);
  function deadSkip() {
    if (playlist[curSong]) playlist[curSong]._dead = true;
    if (++errStreak <= playlist.length) { var ni3 = randomIdx(); if (ni3 >= 0) loadSong(ni3, !userStopped, 'deadskip'); }
  }
  audio.addEventListener('error', function () {
    if (curSong < 0 || !playlist.length) return;
    var song = playlist[curSong];
    if (!song || !audio.getAttribute('src')) return;
    /* 只重试一次：换一条新直链、回原进度；仍失败就跳歌。不碰 load()、不重载原址 */
    if (errRetrySeq !== loadSeq) {
      errRetrySeq = loadSeq;
      var t = audio.currentTime || 0, seq = loadSeq;
      delete songCache[song.id];
      resolveSong(song).then(function (info) {
        if (seq !== loadSeq) return;
        if (!info || !info.url) { deadSkip(); return; }
        audio.src = info.url;
        var back = function () {
          audio.removeEventListener('loadedmetadata', back);
          if (t > 1) { try { audio.currentTime = t; } catch (e) {} }
        };
        audio.addEventListener('loadedmetadata', back);
        if (!userStopped) tryPlay();
      }).catch(function () { if (seq === loadSeq) deadSkip(); });
      return;
    }
    deadSkip();
  });

  /* ---------- 头像：点按播放/暂停，左右滑切歌（滑动后吞掉这次 click） ---------- */
  function toggle() {
    if (curSong < 0) {
      userStopped = false;
      document.body.classList.add('waiting');
      loadList().then(function () {
        document.body.classList.remove('waiting');
        if (playlist.length) loadSong(Math.floor(Math.random() * playlist.length), true, 'tapload');
        else setLyrics('', '歌单加载失败，点头像重试');
      }).catch(function () {
        document.body.classList.remove('waiting');
        setLyrics('', '歌单加载失败，点头像重试');
      });
      return;
    }
    if (audio.paused) { userStopped = false; tryPlay(); }
    else { userStopped = true; audio.pause(); }
  }
  var swipeAt = 0;
  var dragX = null, dragDx = 0, dragging = false, peekDir = 0;
  function peekDist() { return (wrap.clientWidth || 150) + 10; }
  function stagePeek() {
    peekId = null;
    if (nextIdx < 0) return;
    var s = playlist[nextIdx];
    var info = s && songCache[s.id];
    if (!info || !info.url) return;
    nxtCard.el.style.visibility = 'visible';
    setCardCover(nxtCard, info.pic);
    peekId = s.id;
  }
  function positionCards() {
    curCard.el.style.transform = 'translateX(' + dragDx + 'px)';
    curCard.el.style.opacity = String(1 - Math.min(Math.abs(dragDx) / 260, 0.45));
    if (peekId !== null && peekDir !== 0) {
      nxtCard.el.style.transform = 'translateX(' + (-peekDir * peekDist() + dragDx) + 'px)';
      nxtCard.el.style.opacity = String(Math.min(Math.abs(dragDx) / 90, 1));
    }
  }
  wrap.addEventListener('pointerdown', function (e) {
    if (nextIdx < 0 || nextIdx2 < 0) prepareNext();
    if (swapTimer) { clearTimeout(swapTimer); swapTimer = 0; if (dragSwapping) dragSwapping = false; finishSwap(); }
    dragX = e.clientX; dragDx = 0; dragging = false; peekDir = 0; peekId = null;
    curCard.el.style.transition = 'none';
    nxtCard.el.style.transition = 'none';
  }, { passive: true });
  wrap.addEventListener('pointermove', function (e) {
    if (dragX === null || typeof e.clientX !== 'number') return;
    dragDx = e.clientX - dragX;
    if (Math.abs(dragDx) > 4) dragging = true;
    if (!dragging) return;
    var dirSign = dragDx < 0 ? -1 : 1;
    if (dirSign !== peekDir) { peekDir = dirSign; stagePeek(); }
    positionCards();
  }, { passive: true });
  function snapCards() {
    var tr = 'transform .25s ease, opacity .25s ease';
    curCard.el.style.transition = tr;
    curCard.el.style.transform = 'translateX(0px)';
    curCard.el.style.opacity = '1';
    if (peekId !== null && peekDir !== 0) {
      nxtCard.el.style.transition = tr;
      nxtCard.el.style.transform = 'translateX(' + (-peekDir * peekDist()) + 'px)';
      nxtCard.el.style.opacity = '0';
    }
    peekId = null;
    setTimeout(function () { if (!dragging && peekId === null && !dragSwapping) resetCard(nxtCard); }, 280);
  }
  function commitDrag(dirSign) {
    dragSwapping = true;
    nxtCard.el.style.visibility = 'visible';
    var tr = 'transform .26s ease-out, opacity .26s ease';
    curCard.el.style.transition = tr;
    nxtCard.el.style.transition = tr;
    curCard.el.style.transform = 'translateX(' + (dirSign * slideDist()) + 'px)';
    curCard.el.style.opacity = '0';
    nxtCard.el.style.transform = 'translateX(0px)';
    nxtCard.el.style.opacity = '1';
    swapTimer = setTimeout(function () { swapTimer = 0; dragSwapping = false; finishSwap(); }, 300);
    if (dirSign < 0) nextSong('swipe'); else prevSong('swipe');
  }
  function endDrag() {
    if (dragX === null) return;
    var dx = dragDx; dragX = null;
    if (dragging) {
      swipeAt = Date.now();
      if (Math.abs(dx) >= 20) commitDrag(dx < 0 ? -1 : 1);
      else snapCards();
    }
    dragging = false; dragDx = 0; peekDir = 0;
  }
  wrap.addEventListener('pointerup', endDrag, { passive: true });
  wrap.addEventListener('pointercancel', endDrag, { passive: true });
  wrap.addEventListener('click', function () {
    if (Date.now() - swipeAt < 350) return;
    toggle();
  });
  wrap.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); nextSong('key'); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); prevSong('key'); }
  });

  if ('mediaSession' in navigator) {
    try {
      navigator.mediaSession.setActionHandler('play', function () { toggle(); });
      navigator.mediaSession.setActionHandler('pause', function () { userStopped = true; audio.pause(); });
      navigator.mediaSession.setActionHandler('previoustrack', function () { prevSong('ms'); });
      navigator.mediaSession.setActionHandler('nexttrack', function () { nextSong('ms'); });
    } catch (e) {}
  }

  /* ---------- 启动：拉歌单 → 装载第一首 → 尝试自动播放（被拦截时首次点任意处兜底） ---------- */
  document.body.classList.add('waiting');
  fetchJson(MUSIC_API + '?boot=1').then(function (j) {
    applyList(j);
    if (!playlist.length) { document.body.classList.remove('waiting'); setLyrics('', '歌单是空的'); return; }
    var idx = Math.floor(Math.random() * playlist.length);
    if (j && j.first && j.first.id && j.first.url) {
      songCache[j.first.id] = j.first;
      for (var k = 0; k < playlist.length; k++) if (String(playlist[k].id) === String(j.first.id)) { idx = k; break; }
    }
    loadSong(idx, true, 'boot');
  }).catch(function () {
    loadList().then(function () {
      if (playlist.length) loadSong(Math.floor(Math.random() * playlist.length), true);
      else { document.body.classList.remove('waiting'); setLyrics('', '歌单是空的'); }
    }).catch(function () {
      document.body.classList.remove('waiting');
      setLyrics('', '歌单加载失败，点头像重试');
    });
  });
  /* 点任意处（捕获阶段）：解除静音（只生效一次）；同时以这次真实手势的名义补调一次播放——
     iOS/内嵌浏览器可能只认手势发起的 play()，守护定时器的程序调用会被拒。页面上不出现任何提示 */
  document.addEventListener('pointerdown', function () {
    if (!userUnmuted) {
      userUnmuted = true;
      try { audio.muted = false; audio.volume = 1; } catch (e) {}
      syncMuteHint();
      logEv('unmuted by tap');
    }
    if (curSong >= 0 && audio.paused && !userStopped && !audio.ended) { logEv('gesture tryPlay'); tryPlay(); }
  }, true);
})();
</script>
</body>
</html>
