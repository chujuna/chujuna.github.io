<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SM自测</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F5F5F7; --card:#FFFFFF; --text:#1D1D1F; --sub:#86868B; --faint:#AEAEB2;
  --line:#E8E8ED; --accent:#FA243C; --accent-soft:rgba(250,36,60,.08);
  --radius:24px; --max:1080px;
}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text); line-height:1.5;
  touch-action:manipulation; -webkit-font-smoothing:antialiased;
  padding-bottom:150px;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
svg{display:block}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:50;height:64px;
  background:rgba(245,245,247,.72);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid rgba(0,0,0,.06);
}
.topbar-in{max-width:var(--max);margin:0 auto;height:64px;padding:0 32px;display:flex;align-items:center;justify-content:space-between}
.topbar .logo{font-size:17px;font-weight:600;letter-spacing:.02em}
.topbar .logo span{color:var(--accent)}
.topbar .top-progress{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}

/* ---------- 布局 ---------- */
.wrap{max-width:var(--max);margin:0 auto;padding:0 32px}
.hero{padding:64px 0 0;text-align:center}
.hero .eyebrow{font-size:11px;letter-spacing:.3em;color:var(--faint);margin-bottom:14px}
.hero h1{font-size:48px;font-weight:700;letter-spacing:-.01em;line-height:1.12}
.hero .subtitle{margin-top:12px;font-size:14px;color:var(--sub)}

/* ---------- 指数展示（已融合进底部悬浮坞） ---------- */
.dock-score{display:flex;align-items:center;gap:18px;flex:1;min-width:0}
.dock-score-text{flex:0 0 auto}
.score-label{font-size:12px;color:var(--sub);margin-bottom:2px;white-space:nowrap}
.score-line{display:flex;align-items:center;gap:10px}
.score-value{font-size:32px;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.score-value small{font-size:17px;font-weight:600}
.score-level{font-style:normal;font-size:12px;color:var(--accent);background:var(--accent-soft);padding:3px 10px;border-radius:999px;font-weight:600;white-space:nowrap}
.dock-progress{flex:1;min-width:84px}
.score-count{font-size:12px;color:var(--sub);margin-bottom:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.score-count b{font-weight:600;color:var(--text)}
.progress{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .45s cubic-bezier(.22,1,.36,1)}

/* ---------- 切换（顶部吸顶） ---------- */
.tabs-bar{
  position:sticky;top:64px;z-index:45;margin-top:30px;
  display:flex;justify-content:center;padding:10px 0;
  background:rgba(245,245,247,.85);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
}
.tabs{display:flex;justify-content:center}
.segmented{background:#E8E8ED;border-radius:999px;padding:4px;display:inline-flex;gap:4px}
.segmented button{
  padding:12px 34px;border-radius:999px;font-size:16px;font-weight:500;color:var(--sub);
  transition:all .25s;min-width:148px;
}
.segmented button.active{background:#fff;color:var(--text);font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.10)}

/* ---------- 说明 ---------- */
.legend-card{margin:24px auto 0;max-width:640px;background:var(--card);border-radius:18px;padding:16px 22px 18px}
.legend-head{font-size:11px;letter-spacing:.22em;color:var(--faint);margin-bottom:12px}
.legend{margin:0;max-width:none;display:grid;grid-template-columns:repeat(3,1fr);gap:10px 28px;padding:0}
.legend-item{display:grid;grid-template-columns:76px 1fr;align-items:center;gap:8px;font-size:12px;color:var(--sub);text-align:left}
.legend-item .hearts{display:flex;gap:2px}
.legend-item .hearts svg{width:13px;height:13px}
.legend-sample-reject{width:19px;height:19px;border-radius:50%;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:var(--sub);background:#fff;font-style:normal}
.legend-simple{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 24px;max-width:none}
.legend-simple .legend-item{display:inline-flex;align-items:center;gap:7px}
.yn-dot{display:inline-flex;gap:6px}
.yn-dot i{font-style:normal;font-size:12px;padding:2px 10px;border-radius:999px;background:#fff;border:1px solid var(--line)}

/* ---------- 分类卡 ---------- */
.cards{margin-top:28px;display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
.cards.single{grid-template-columns:1fr;max-width:760px;margin-left:auto;margin-right:auto}
.card{background:var(--card);border-radius:var(--radius);padding:36px 36px 20px;scroll-margin-top:96px}
.card-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.card-title{display:flex;align-items:baseline;gap:12px}
.card-title .num{font-size:13px;color:var(--faint);font-weight:600;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.card-title h2{font-size:20px;font-weight:600}
.card-count{font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}
.card-count.done{color:var(--accent)}

/* ---------- 条目行 ---------- */
.item{padding:20px 0;border-bottom:1px solid #F0F0F3}
.item:last-child{border-bottom:none}
.item.flash{animation:flash 1.2s}
@keyframes flash{0%,60%{background:var(--accent-soft)}100%{background:transparent}}
.item-top{display:grid;grid-template-columns:minmax(0,1fr) 252px;align-items:center;gap:16px}
.rate{justify-content:flex-end;width:100%}
.item-name{
  display:inline-flex;align-items:center;gap:8px;text-align:left;
  font-size:16px;font-weight:500;color:var(--text);line-height:1.45;padding:4px 0;
}
.item-name .degree{font-size:12px;font-weight:600;color:var(--accent);white-space:nowrap}
.item-name .degree:empty{display:none}
.item.rejected .item-name .degree{color:var(--sub)}
.item-name .info{
  flex:0 0 auto;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--faint);font-style:normal;line-height:1;
}
.item.rejected .item-name{color:var(--faint);text-decoration:line-through;text-decoration-color:rgba(0,0,0,.25)}
.rate{display:flex;align-items:center;gap:14px;flex:0 0 auto}
.hearts{display:flex;gap:2px}
.heart-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:transform .15s}
.heart-btn:active{transform:scale(1.25)}
.heart-btn svg{width:24px;height:24px;fill:none;stroke:#C7C7CC;stroke-width:1.6;transition:all .15s}
.heart-btn.on svg{fill:var(--accent);stroke:var(--accent)}
.reject-btn{
  width:36px;height:36px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:13px;line-height:1;color:var(--sub);border:1px solid var(--line);background:#fff;
  border-radius:50%;transition:all .2s;
}
.reject-btn.on{background:var(--text);border-color:var(--text);color:#fff;font-weight:600}

/* ---------- 淫荡指数条目 ---------- */
.lewd-q{font-size:16px;font-weight:500;line-height:1.55;text-align:left;display:inline-flex;gap:8px;align-items:flex-start;padding:4px 0}
.lewd-q .info{margin-top:2px;flex:0 0 auto;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:var(--faint);font-style:normal}
.lewd-controls{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}
.lewd-controls.yn{flex-direction:row-reverse;justify-content:flex-start}
.yn-btn,.opt-btn{
  font-size:14px;padding:9px 22px;border-radius:999px;border:1px solid var(--line);
  background:#fff;color:var(--sub);transition:all .2s;min-height:40px;
}
.yn-btn.on-yes{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.yn-btn.on-no{background:var(--text);border-color:var(--text);color:#fff;font-weight:600}
.opt-btn.on{background:var(--text);border-color:var(--text);color:#fff;font-weight:600}

/* ---------- 页脚 ---------- */
.form-footer{margin-top:56px;text-align:center;font-size:12px;line-height:2;color:var(--faint);white-space:pre-line;padding:0 16px}

/* ---------- 底部悬浮坞（指数 + 进度 + 生成，一体） ---------- */
.dock{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:60;
  display:flex;align-items:center;gap:22px;
  width:min(720px,calc(100vw - 32px));padding:14px 20px;
  background:rgba(255,255,255,.82);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  border-radius:28px;box-shadow:0 12px 40px rgba(0,0,0,.14);border:1px solid rgba(0,0,0,.05);
}
.dock-actions{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.dock .reset{font-size:14px;color:var(--sub);padding:11px 14px;border-radius:999px;white-space:nowrap}
.dock .export{
  font-size:15px;font-weight:600;color:#fff;background:var(--text);
  padding:12px 22px;border-radius:999px;white-space:nowrap;transition:all .2s;
}
.dock .export.ready{background:var(--accent)}
.dock .remain{display:none}

/* ---------- 弹层 ---------- */
.mask{
  position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.32);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .25s;
  display:flex;align-items:flex-end;justify-content:center;
}
.mask.show{opacity:1;pointer-events:auto}
.sheet{
  background:#fff;width:100%;max-width:560px;max-height:82vh;overflow-y:auto;
  border-radius:28px 28px 0 0;padding:36px 32px calc(32px + env(safe-area-inset-bottom));
  transform:translateY(24px);transition:transform .25s;
}
.mask.show .sheet{transform:translateY(0)}
.sheet h3{font-size:20px;font-weight:600;margin-bottom:14px;padding-right:40px}
.sheet .desc{font-size:15px;line-height:1.8;color:#48484A;white-space:pre-line}
.sheet .close-x{position:absolute}
.sheet-wrap{position:relative}
.sheet .x{
  position:absolute;top:28px;right:24px;width:32px;height:32px;border-radius:50%;
  background:var(--bg);color:var(--sub);font-size:15px;display:flex;align-items:center;justify-content:center;
}
.mask.center{align-items:center;padding:20px}
.mask.center .sheet{border-radius:28px;padding-bottom:34px;max-width:440px}
.sheet .row-btns{display:flex;gap:12px;margin-top:26px}
.sheet .row-btns button{flex:1;padding:15px 8px;border-radius:999px;font-size:15px;font-weight:600}
.sheet .btn-primary{background:var(--text);color:#fff}
.sheet .btn-danger{background:var(--accent);color:#fff}
.sheet .btn-ghost{background:var(--bg);color:var(--text)}
.sheet .big-btn{
  margin-top:26px;width:100%;padding:15px;border-radius:999px;background:var(--text);color:#fff;
  font-size:16px;font-weight:600;text-align:center;text-decoration:none;display:block;
}
.sheet .ghost-btn{
  margin-top:12px;width:100%;padding:15px;border-radius:999px;background:var(--bg);color:var(--text);
  font-size:15px;text-align:center;display:block;text-decoration:none;
}
.sheet img.export-img{width:100%;border-radius:16px;border:1px solid var(--line)}
.sheet .save-tip{text-align:center;font-size:13px;color:var(--sub);margin-top:14px}

/* ---------- Toast ---------- */
.toast{
  position:fixed;top:calc(76px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-8px);z-index:200;
  background:rgba(29,29,31,.92);color:#fff;font-size:14px;padding:11px 22px;border-radius:999px;
  opacity:0;pointer-events:none;transition:all .3s;max-width:calc(100vw - 48px);text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- 响应式 ---------- */
@media (max-width:900px){
  .cards{grid-template-columns:1fr}
}
@media (max-width:640px){
  .wrap{padding:0 20px}
  .topbar-in{padding:0 20px}
  .hero{padding:48px 0 0}
  .hero h1{font-size:38px}
  .legend-card{padding:14px 18px 16px;border-radius:16px;margin-top:20px}
  .hero .subtitle{font-size:15px}
  body{padding-bottom:128px}
  .dock{flex-wrap:nowrap;gap:12px;padding:12px 16px 18px;border-radius:24px}
  .dock-score{flex:0 1 auto;gap:0}
  .score-label{font-size:11px;margin-bottom:1px}
  .score-line{gap:8px}
  .score-value{font-size:26px}
  .score-value small{font-size:15px}
  .score-level{font-size:11px;padding:2px 8px}
  .dock-progress{position:absolute;left:16px;right:16px;bottom:7px;min-width:0}
  .dock-progress .score-count{display:none}
  .dock-progress .progress{height:4px}
  .dock-actions{flex:1;justify-content:flex-end;gap:2px}
  .dock .reset{font-size:13px;padding:9px 10px}
  .dock .export{font-size:14px;padding:11px 18px}
  .segmented{width:100%}
  .segmented button{flex:1;min-width:0;padding:10px 8px}
  .legend{grid-template-columns:1fr 1fr;gap:12px 16px}
  .legend-simple{display:flex}
  .card{padding:28px 22px 12px;border-radius:20px}
  .item{padding:18px 0}
  .item-top{grid-template-columns:1fr;gap:6px}
  .rate{width:100%;justify-content:space-between}
  .hearts{gap:0}
  .heart-btn{width:40px;height:40px}
  .heart-btn svg{width:26px;height:26px}
  .reject-btn{width:40px;height:40px}
  .lewd-controls:not(.yn){justify-content:flex-end}
  .mask{align-items:flex-end}
}
@media (max-width:360px){
  .score-level{display:none}
  .dock{gap:8px;padding-left:12px;padding-right:12px}
  .dock .export{padding:11px 14px}
  .dock-progress{left:12px;right:12px}
}
@media (min-width:641px){
  .mask{align-items:center;padding:24px}
  .sheet{border-radius:28px;padding-bottom:36px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="logo">SM<span>自测</span></div>
    <div class="top-progress" id="topProgress">已完成 0 / 146</div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <div class="eyebrow">个人自测 · 仅供娱乐</div>
    <h1 id="heroTitle">喜好自评表</h1>
    <p class="subtitle" id="heroSub">为每一项打上爱心，点条目名称可以看说明</p>
  </section>

  <div class="tabs-bar">
    <div class="segmented" role="tablist">
      <button id="tabBdsm" class="active" type="button">喜好自评表</button>
      <button id="tabLewd" type="button">淫荡指数</button>
    </div>
  </div>

  <section class="legend-card">
    <div class="legend-head">评分说明</div>
    <div class="legend" id="legend"></div>
  </section>
  <div class="cards" id="content"></div>
  <div class="form-footer" id="formFooter"></div>
</main>

<div class="dock">
  <div class="dock-score">
    <div class="dock-score-text">
      <div class="score-label" id="scoreLabel">SM倾向</div>
      <div class="score-line">
        <div class="score-value"><span id="scoreValue">0</span><small>%</small></div>
        <em class="score-level" id="scoreLevel">轻度SM</em>
      </div>
    </div>
    <div class="dock-progress">
      <div class="score-count" id="scoreCount"><b>0</b> <span>/ 146 已完成</span></div>
      <div class="progress"><i id="progressBar"></i></div>
    </div>
  </div>
  <div class="dock-actions">
    <span class="remain" id="remainText"></span>
    <button class="reset" id="resetBtn" type="button">重置</button>
    <button class="export" id="exportBtn" type="button">生成图片</button>
  </div>
</div>

<div class="mask" id="sheetMask">
  <div class="sheet sheet-wrap">
    <button class="x" id="sheetClose" type="button" aria-label="关闭">✕</button>
    <h3 id="sheetTitle"></h3>
    <div class="desc" id="sheetDesc"></div>
  </div>
</div>

<div class="mask center" id="resumeMask">
  <div class="sheet sheet-wrap">
    <h3>上次还没填完</h3>
    <div class="desc" id="resumeText"></div>
    <div class="row-btns">
      <button class="btn-ghost" id="resumeRestart" type="button">重新填写</button>
      <button class="btn-primary" id="resumeContinue" type="button">继续填写</button>
    </div>
  </div>
</div>

<div class="mask center" id="resetMask">
  <div class="sheet sheet-wrap">
    <h3>确定要重置吗？</h3>
    <div class="desc" id="resetText"></div>
    <div class="row-btns">
      <button class="btn-ghost" id="resetCancel" type="button">取消</button>
      <button class="btn-danger" id="resetConfirm" type="button">确认重置</button>
    </div>
  </div>
</div>

<div class="mask" id="exportMask">
  <div class="sheet sheet-wrap">
    <button class="x" id="exportClose" type="button" aria-label="关闭">✕</button>
    <h3>你的自测图</h3>
    <img class="export-img" id="exportImg" alt="自测结果长图">
    <div class="save-tip">手机上长按图片即可保存到相册</div>
    <a class="big-btn" id="downloadBtn" download="sm-test.png">下载图片</a>
    <button class="ghost-btn" id="exportClose2" type="button">关闭</button>
  </div>
</div>

<div class="toast" id="toast"></div>

</script>
<script>
(function(){
'use strict';
var LEWD_YES=1, LEWD_NO=2, LEWD_QUESTION_COUNT=37, REJECT=-1;
var DRAFT_KEY='sm-v2-draft-v1';
var state={tab:'bdsm', ratings:{}};
try{
  var saved=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null');
  if(saved && saved.ratings){ state.ratings=saved.ratings; if(saved.tab==='lewd'||saved.tab==='bdsm') state.tab=saved.tab; }
}catch(e){}
var saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){ try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(state)); }catch(e){} },150);
}
function key(){ return Array.prototype.join.call(arguments,':'); }
function getR(k){ return state.ratings[k]||0; }
function setR(k,v){ if(v===0) delete state.ratings[k]; else state.ratings[k]=v; }

var $=function(id){ return document.getElementById(id); };
var content=$('content');

/* ---------- 说明弹层 ---------- */
var sheetMask=$('sheetMask');
function openSheet(title,desc){
  $('sheetTitle').textContent=title;
  $('sheetDesc').textContent=desc||'暂无说明。';
  sheetMask.classList.add('show');
}
function closeSheet(){ sheetMask.classList.remove('show'); }
$('sheetClose').addEventListener('click',closeSheet);
sheetMask.addEventListener('click',function(e){ if(e.target===sheetMask) closeSheet(); });

/* ---------- Toast ---------- */
var toastTimer=null;
function toast(msg){
  var t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.classList.remove('show'); },2300);
}

/* ---------- 爱心图标 ---------- */
var HEART='M12 20.7C6.4 16.9 3 13.9 3 10.3 3 7.6 5 5.5 7.6 5.5c1.7 0 3.4.9 4.4 2.3.9-1.4 2.7-2.3 4.4-2.3C19 5.5 21 7.6 21 10.3c0 3.6-3.4 6.6-9 10.4z';
function heartSVG(on){
  return '<svg viewBox="0 0 24 24" '+(on?'fill="#FA243C" stroke="#FA243C"':'fill="none" stroke="#C7C7CC"')+' stroke-width="1.6"><path d="'+HEART+'"/></svg>';
}

/* ---------- 计数与指数（与旧版算法一致） ---------- */
var BDSM_CATS=[];
BDSM_FORM.columns.forEach(function(col){ col.categories.forEach(function(c){ BDSM_CATS.push(c); }); });

function bdsmAnswered(){
  var n=0;
  BDSM_FORM.columns.forEach(function(col,ci){ col.categories.forEach(function(cat,cati){ cat.items.forEach(function(_,ii){ if(getR(key('bdsm',ci,cati,ii))!==0) n++; }); }); });
  return n;
}
function calcBdsm(){
  var total=0;
  BDSM_FORM.columns.forEach(function(col,ci){ col.categories.forEach(function(cat,cati){ cat.items.forEach(function(_,ii){ var v=getR(key('bdsm',ci,cati,ii)); if(v>0) total+=v/5; }); }); });
  return Math.round(total/BDSM_ITEM_COUNT*100);
}
function bdsmLevel(p){ return p<=33?BDSM_SM_LEVELS[0]:(p<=66?BDSM_SM_LEVELS[1]:BDSM_SM_LEVELS[2]); }

function lewdItemAnswered(si,item){
  if(item.type==='multi') return item.options.some(function(_,oi){ return getR(key('lewd',si,item.id,'opt',oi))===LEWD_YES; });
  if(item.type==='single') return item.options.some(function(_,oi){ return getR(key('lewd',si,item.id,'single',oi))===LEWD_YES; });
  return getR(key('lewd',si,item.id))!==0;
}
function lewdAnswered(){
  var n=0;
  LEWD_FORM.sections.forEach(function(sec,si){ sec.items.forEach(function(item){ if(lewdItemAnswered(si,item)) n++; }); });
  return n;
}
function calcLewd(){
  var total=0;
  LEWD_FORM.sections.forEach(function(sec,si){
    sec.items.forEach(function(item){
      if(item.type==='multi'){
        var c=0; item.options.forEach(function(_,oi){ if(getR(key('lewd',si,item.id,'opt',oi))===LEWD_YES) c++; });
        total+=c/item.options.length;
      }else if(item.type==='single'){
        var s=0; item.options.forEach(function(_,oi){ if(getR(key('lewd',si,item.id,'single',oi))===LEWD_YES) s=(oi+1)/item.options.length; });
        total+=s;
      }else if(getR(key('lewd',si,item.id))===LEWD_YES){ total+=1; }
    });
  });
  return Math.round(total/LEWD_QUESTION_COUNT*100);
}

/* ---------- 顶部状态 ---------- */
function refreshStatus(){
  var isB=state.tab==='bdsm';
  var done=isB?bdsmAnswered():lewdAnswered();
  var total=isB?BDSM_ITEM_COUNT:LEWD_QUESTION_COUNT;
  var pct=isB?calcBdsm():calcLewd();
  $('scoreValue').textContent=pct;
  $('scoreLabel').textContent=isB?'SM倾向':'淫荡指数';
  var lv=$('scoreLevel');
  if(isB){ lv.style.display=''; lv.textContent=bdsmLevel(pct); } else { lv.style.display='none'; }
  $('scoreCount').innerHTML='<b>'+done+'</b> <span>/ '+total+' 已完成</span>';
  $('progressBar').style.width=(total?Math.round(done/total*100):0)+'%';
  $('topProgress').textContent='已完成 '+done+' / '+total;
  $('remainText').textContent=done>=total?'已全部完成':('还差 '+(total-done)+' 项');
  $('exportBtn').classList.toggle('ready',done>=total);
  $('heroTitle').textContent=isB?'喜好自评表':'淫荡指数';
  $('heroSub').textContent=isB?'为每一项打上爱心，点条目名称可以看说明':'每一题选是或否，点题目可以看说明';
  $('formFooter').textContent=FORM_FOOTER;
  document.querySelectorAll('.card').forEach(function(card){
    var el=card.querySelector('.card-count'); if(!el) return;
    var d=+card.getAttribute('data-done'), t=+card.getAttribute('data-total');
    el.classList.toggle('done', d>=t && t>0);
  });
}

/* ---------- 说明渲染 ---------- */
function renderLegend(){
  var lg=$('legend'); lg.innerHTML='';
  if(state.tab==='bdsm'){
    lg.className='legend';
    BDSM_FORM.legend.forEach(function(l){
      var s=document.createElement('span'); s.className='legend-item';
      if(l.reject){
        s.innerHTML='<span class="hearts"><i class="legend-sample-reject">✕</i></span><span>'+l.label+'</span>';
      }else{
        var hs=''; for(var i=1;i<=5;i++) hs+='<span style="display:inline-flex">'+heartSVG(i<=l.hearts)+'</span>';
        s.innerHTML='<span class="hearts">'+hs+'</span><span>'+l.label+'</span>';
      }
      lg.appendChild(s);
    });
  }else{
    lg.className='legend legend-simple';
    lg.innerHTML='<span class="legend-item"><span class="yn-dot"><i>是</i></span> 是 / 有过</span><span class="legend-item"><span class="yn-dot"><i>否</i></span> 否 / 没有</span><span class="legend-item">带选项的题，点选项即为选择</span>';
  }
}

/* ---------- 喜好自评表 ---------- */
function renderBdsm(){
  content.className='cards';
  content.innerHTML='';
  BDSM_FORM.columns.forEach(function(col,ci){
    col.categories.forEach(function(cat,cati){
      var globalCi=BDSM_CATS.indexOf(cat);
      var card=document.createElement('section'); card.className='card'; card.id='cat-'+globalCi;
      var doneInCat=0;
      cat.items.forEach(function(_,ii){ if(getR(key('bdsm',ci,cati,ii))!==0) doneInCat++; });
      card.setAttribute('data-done',doneInCat); card.setAttribute('data-total',cat.items.length);
      var head=document.createElement('div'); head.className='card-head';
      head.innerHTML='<div class="card-title"><span class="num">'+String(cat.num).padStart(2,'0')+'</span><h2>'+cat.name+'</h2></div><div class="card-count">'+doneInCat+' / '+cat.items.length+'</div>';
      card.appendChild(head);
      cat.items.forEach(function(name,ii){
        var k=key('bdsm',ci,cati,ii);
        var row=document.createElement('div'); row.className='item'; row.setAttribute('data-key',k);
        var top=document.createElement('div'); top.className='item-top';
        var nameBtn=document.createElement('button'); nameBtn.type='button'; nameBtn.className='item-name';
        var desc=(typeof BDSM_ITEM_DESCS!=='undefined')?BDSM_ITEM_DESCS[name]:null;
        nameBtn.innerHTML='';
        var tspan=document.createElement('span'); tspan.textContent=name; nameBtn.appendChild(tspan);
        var deg=document.createElement('span'); deg.className='degree'; nameBtn.appendChild(deg);
        if(desc){ var inf=document.createElement('i'); inf.className='info'; inf.textContent='i'; nameBtn.appendChild(inf); }
        nameBtn.addEventListener('click',function(){ openSheet(name, desc||'暂无说明。'); });
        var rate=document.createElement('div'); rate.className='rate';
        var hearts=document.createElement('div'); hearts.className='hearts';
        for(var h=1;h<=5;h++){
          (function(hv){
            var b=document.createElement('button'); b.type='button'; b.className='heart-btn'; b.setAttribute('aria-label',hv+'颗爱心');
            b.addEventListener('click',function(){
              var cur=getR(k);
              setR(k, cur===hv?0:hv);
              save(); syncRow(row,k); refreshCardCount(card,ci,cati); refreshStatus();
            });
            hearts.appendChild(b);
          })(h);
        }
        var rej=document.createElement('button'); rej.type='button'; rej.className='reject-btn'; rej.textContent='✕'; rej.setAttribute('aria-label','拒绝');
        rej.addEventListener('click',function(){
          var cur=getR(k);
          setR(k, cur===REJECT?0:REJECT);
          save(); syncRow(row,k); refreshCardCount(card,ci,cati); refreshStatus();
        });
        rate.appendChild(hearts); rate.appendChild(rej);
        top.appendChild(nameBtn); top.appendChild(rate);
        row.appendChild(top);
        card.appendChild(row);
        syncRow(row,k);
      });
      content.appendChild(card);
    });
  });
}
var DEGREE_LABELS={1:'勉强',2:'一般',3:'喜欢',4:'很喜欢',5:'极度渴望'};
function syncRow(row,k){
  var v=getR(k);
  var deg=row.querySelector('.degree');
  if(deg) deg.textContent= v>0 ? DEGREE_LABELS[v] : (v===REJECT ? '拒绝' : '');
  row.classList.toggle('rejected', v===REJECT);
  row.querySelectorAll('.heart-btn').forEach(function(b,i){ b.innerHTML=heartSVG(v>0 && i<v); b.classList.toggle('on', v>0 && i<v); });
  var rej=row.querySelector('.reject-btn'); if(rej) rej.classList.toggle('on', v===REJECT);
}
function refreshCardCount(card,ci,cati){
  var cat=BDSM_FORM.columns[ci].categories[cati];
  var d=0; cat.items.forEach(function(_,ii){ if(getR(key('bdsm',ci,cati,ii))!==0) d++; });
  card.setAttribute('data-done',d);
  var el=card.querySelector('.card-count'); if(el) el.textContent=d+' / '+cat.items.length;
}

/* ---------- 淫荡指数 ---------- */
function renderLewd(){
  content.className='cards single';
  content.innerHTML='';
  LEWD_FORM.sections.forEach(function(sec,si){
    var card=document.createElement('section'); card.className='card';
    var doneInSec=0; sec.items.forEach(function(item){ if(lewdItemAnswered(si,item)) doneInSec++; });
    card.setAttribute('data-done',doneInSec); card.setAttribute('data-total',sec.items.length);
    var head=document.createElement('div'); head.className='card-head';
    head.innerHTML='<div class="card-title"><span class="num">'+String(sec.num).padStart(2,'0')+'</span><h2>'+sec.name+'</h2></div><div class="card-count">'+doneInSec+' / '+sec.items.length+'</div>';
    card.appendChild(head);
    sec.items.forEach(function(item){
      var row=document.createElement('div'); row.className='item';
      var q=document.createElement('button'); q.type='button'; q.className='lewd-q';
      var ts=document.createElement('span'); ts.textContent=item.text; q.appendChild(ts);
      if(item.desc){ var inf=document.createElement('i'); inf.className='info'; inf.textContent='i'; q.appendChild(inf); }
      q.addEventListener('click',function(){
        var d=item.desc||'';
        if(item.options){ d+=(d?'\n\n':'')+item.options.map(function(o){ return '· '+o.text+'：'+(o.desc||''); }).join('\n'); }
        openSheet(item.text, d||'暂无说明。');
      });
      row.appendChild(q);
      var controls=document.createElement('div'); controls.className='lewd-controls';
      if(item.type==='multi' || item.type==='single'){
        var isSingle=item.type==='single';
        item.options.forEach(function(opt,oi){
          var ok=key('lewd',si,item.id, isSingle?'single':'opt', oi);
          var b=document.createElement('button'); b.type='button'; b.className='opt-btn'; b.textContent=opt.text;
          b.classList.toggle('on', getR(ok)===LEWD_YES);
          b.addEventListener('click',function(){
            if(isSingle){
              item.options.forEach(function(_,oj){ setR(key('lewd',si,item.id,'single',oj), oj===oi && getR(ok)!==LEWD_YES ? LEWD_YES : 0); });
            }else{
              setR(ok, getR(ok)===LEWD_YES?0:LEWD_YES);
            }
            save();
            controls.querySelectorAll('.opt-btn').forEach(function(bb,oj){
              var kk=key('lewd',si,item.id, isSingle?'single':'opt', oj);
              bb.classList.toggle('on', getR(kk)===LEWD_YES);
            });
            refreshLewdCardCount(card,si); refreshStatus();
          });
          controls.appendChild(b);
        });
      }else{
        controls.classList.add('yn');
        var k=key('lewd',si,item.id);
        [['是',LEWD_YES,'on-yes'],['否',LEWD_NO,'on-no']].forEach(function(pair){
          var b=document.createElement('button'); b.type='button'; b.className='yn-btn'; b.textContent=pair[0];
          b.classList.toggle(pair[2], getR(k)===pair[1]);
          b.addEventListener('click',function(){
            setR(k, getR(k)===pair[1]?0:pair[1]);
            save();
            controls.querySelectorAll('.yn-btn').forEach(function(bb,bi){
              bb.classList.toggle(bi===0?'on-yes':'on-no', getR(k)===(bi===0?LEWD_YES:LEWD_NO));
            });
            refreshLewdCardCount(card,si); refreshStatus();
          });
          controls.appendChild(b);
        });
      }
      row.appendChild(controls);
      card.appendChild(row);
    });
    content.appendChild(card);
  });
}
function refreshLewdCardCount(card,si){
  var sec=LEWD_FORM.sections[si];
  var d=0; sec.items.forEach(function(item){ if(lewdItemAnswered(si,item)) d++; });
  card.setAttribute('data-done',d);
  var el=card.querySelector('.card-count'); if(el) el.textContent=d+' / '+sec.items.length;
}

/* ---------- 渲染入口 ---------- */
function render(){
  $('tabBdsm').classList.toggle('active', state.tab==='bdsm');
  $('tabLewd').classList.toggle('active', state.tab==='lewd');
  renderLegend();
  if(state.tab==='bdsm') renderBdsm(); else renderLewd();
  refreshStatus();
}
$('tabBdsm').addEventListener('click',function(){ if(state.tab!=='bdsm'){ state.tab='bdsm'; save(); render(); window.scrollTo({top:0,behavior:'smooth'}); } });
$('tabLewd').addEventListener('click',function(){ if(state.tab!=='lewd'){ state.tab='lewd'; save(); render(); window.scrollTo({top:0,behavior:'smooth'}); } });

/* ---------- 重置（自制确认弹窗，不用系统 confirm） ---------- */
function closeReset(){ $('resetMask').classList.remove('show'); }
$('resetBtn').addEventListener('click',function(){
  var isB=state.tab==='bdsm';
  var done=isB?bdsmAnswered():lewdAnswered();
  if(done===0){ toast('当前还没有填任何内容'); return; }
  $('resetText').textContent='将清空「'+(isB?'喜好自评表':'淫荡指数')+'」已填的 '+done+' 项，清空后不能恢复。';
  $('resetMask').classList.add('show');
});
$('resetCancel').addEventListener('click',closeReset);
$('resetMask').addEventListener('click',function(e){ if(e.target===$('resetMask')) closeReset(); });
$('resetConfirm').addEventListener('click',function(){
  var isB=state.tab==='bdsm';
  Object.keys(state.ratings).forEach(function(k){ if(k.indexOf(isB?'bdsm:':'lewd:')===0) delete state.ratings[k]; });
  try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(state)); }catch(e){}
  closeReset(); render(); window.scrollTo({top:0,behavior:'smooth'}); toast('已重置，可以重新填写');
});

/* ---------- 重开检测：有未填完的记录时居中提示 ---------- */
function partialForms(){
  var list=[];
  var b=bdsmAnswered(), l=lewdAnswered();
  if(b>0 && b<BDSM_ITEM_COUNT) list.push('喜好自评表：已填 '+b+' / '+BDSM_ITEM_COUNT);
  if(l>0 && l<LEWD_QUESTION_COUNT) list.push('淫荡指数：已填 '+l+' / '+LEWD_QUESTION_COUNT);
  return list;
}
function checkResume(){
  var list=partialForms();
  if(!list.length) return false;
  $('resumeText').textContent='检测到上次没有填完的记录：\n'+list.join('\n')+'\n\n要接着上次的进度继续，还是清空重新填写？';
  $('resumeMask').classList.add('show');
  return true;
}
$('resumeContinue').addEventListener('click',function(){ $('resumeMask').classList.remove('show'); toast('已恢复上次的进度'); });
$('resumeRestart').addEventListener('click',function(){
  state.ratings={};
  try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(state)); }catch(e){}
  $('resumeMask').classList.remove('show');
  render(); window.scrollTo({top:0}); toast('已清空，可以重新填写');
});

/* ---------- 找第一项未完成 ---------- */
function firstIncompleteEl(){
  if(state.tab==='bdsm'){
    var miss=null;
    BDSM_FORM.columns.forEach(function(col,ci){ col.categories.forEach(function(cat,cati){ cat.items.forEach(function(_,ii){ if(!miss && getR(key('bdsm',ci,cati,ii))===0) miss=key('bdsm',ci,cati,ii); }); }); });
    return miss?content.querySelector('[data-key="'+miss+'"]'):null;
  }
  return null;
}

/* ---------- 图片导出（原生 Canvas 绘制，不依赖任何库） ---------- */
function buildExportModel(){
  var isB=state.tab==='bdsm';
  var model={ isB:isB, title:isB?'喜好自评表':'淫荡指数', pct:isB?calcBdsm():calcLewd(), level:isB?bdsmLevel(calcBdsm()):'', groups:[] };
  if(isB){
    BDSM_CATS.forEach(function(cat){
      var g={name:cat.name, rows:[]};
      BDSM_FORM.columns.forEach(function(col,ci){ col.categories.forEach(function(cc,cati){ if(cc===cat){ cc.items.forEach(function(name,ii){ var v=getR(key('bdsm',ci,cati,ii)); g.rows.push({name:name, value:v}); }); } }); });
      model.groups.push(g);
    });
  }else{
    LEWD_FORM.sections.forEach(function(sec,si){
      var g={name:sec.name, rows:[]};
      sec.items.forEach(function(item){
        var ans='';
        if(item.type==='multi'){
          var sel=[]; item.options.forEach(function(o,oi){ if(getR(key('lewd',si,item.id,'opt',oi))===LEWD_YES) sel.push(o.text); });
          ans=sel.length?sel.join('、'):'否';
        }else if(item.type==='single'){
          var picked='否'; item.options.forEach(function(o,oi){ if(getR(key('lewd',si,item.id,'single',oi))===LEWD_YES) picked=o.text; });
          ans=picked;
        }else{
          ans=getR(key('lewd',si,item.id))===LEWD_YES?'是':'否';
        }
        g.rows.push({name:item.text, value:ans});
      });
      model.groups.push(g);
    });
  }
  return model;
}
function wrapText(ctx,text,maxW){
  var lines=[], line='';
  for(var i=0;i<text.length;i++){
    var test=line+text[i];
    if(ctx.measureText(test).width>maxW && line){ lines.push(line); line=text[i]; } else line=test;
  }
  if(line) lines.push(line);
  return lines.length?lines:[''];
}
function drawExport(){
  var model=buildExportModel();
  var SCALE=2, W=1080, PAD=72, COLGAP=56;
  var colW=model.isB ? (W-PAD*2-COLGAP)/2 : (W-PAD*2);
  var probe=document.createElement('canvas').getContext('2d');
  function groupHeight(g,twoCol){
    var h=58;
    probe.font='500 25px -apple-system,"PingFang SC",sans-serif';
    g.rows.forEach(function(r){
      if(model.isB){ h+=40; }
      else{
        probe.font='600 25px -apple-system,"PingFang SC",sans-serif';
        var aw=Math.min(probe.measureText(r.value||'').width, 300);
        probe.font='500 25px -apple-system,"PingFang SC",sans-serif';
        var ls=wrapText(probe, r.name, colW-aw-48);
        h+=Math.max(40, ls.length*34+10);
      }
    });
    return h+30;
  }
  var cols=[];
  if(model.isB){
    var left=model.groups.slice(0,5), right=model.groups.slice(5);
    cols=[left,right];
  }else{ cols=[model.groups]; }
  var colHeights=cols.map(function(gs){ return gs.reduce(function(s,g){ return s+groupHeight(g); },0); });
  var bodyH=Math.max.apply(null,colHeights);
  var H=300+bodyH+170;
  var canvas=document.createElement('canvas');
  canvas.width=W*SCALE; canvas.height=H*SCALE;
  var ctx=canvas.getContext('2d');
  if(!ctx) throw new Error('no-ctx');
  ctx.scale(SCALE,SCALE);
  ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#F5F5F7'; ctx.fillRect(0,0,W,300);
  ctx.fillStyle='#86868B'; ctx.font='500 22px -apple-system,"PingFang SC",sans-serif';
  ctx.fillText('个人自测 · 仅供娱乐', PAD, 84);
  ctx.fillStyle='#1D1D1F'; ctx.font='700 54px -apple-system,"PingFang SC",sans-serif';
  ctx.fillText(model.title, PAD, 152);
  ctx.textAlign='right';
  ctx.fillStyle='#FA243C'; ctx.font='700 92px -apple-system,"PingFang SC",sans-serif';
  ctx.fillText(model.pct+'%', W-PAD, 150);
  ctx.fillStyle='#86868B'; ctx.font='500 24px -apple-system,"PingFang SC",sans-serif';
  ctx.fillText(model.isB?('SM倾向 · '+model.level):'淫荡指数', W-PAD, 196);
  ctx.textAlign='left';
  var now=new Date();
  var pad2=function(n){ return String(n).padStart(2,'0'); };
  var dateStr=now.getFullYear()+'-'+pad2(now.getMonth()+1)+'-'+pad2(now.getDate())+' '+pad2(now.getHours())+':'+pad2(now.getMinutes());
  ctx.fillStyle='#AEAEB2'; ctx.font='400 21px -apple-system,"PingFang SC",sans-serif';
  ctx.fillText(dateStr, PAD, 248);
  function drawGroup(g,x,y){
    ctx.fillStyle='#1D1D1F'; ctx.font='600 29px -apple-system,"PingFang SC",sans-serif';
    ctx.fillText(g.name, x, y+34);
    var cy=y+58;
    ctx.font='500 25px -apple-system,"PingFang SC",sans-serif';
    g.rows.forEach(function(r){
      if(model.isB){
        ctx.fillStyle='#1D1D1F';
        var name=r.name;
        while(ctx.measureText(name).width>colW-190 && name.length>1) name=name.slice(0,-1);
        if(name!==r.name) name=name.slice(0,-1)+'…';
        var nameW=ctx.measureText(name).width;
        var rateText, rateW;
        if(r.value===REJECT){ ctx.font='600 23px -apple-system,"PingFang SC",sans-serif'; rateText='拒绝'; rateW=ctx.measureText(rateText).width; }
        else{ ctx.font='400 26px -apple-system,"PingFang SC",sans-serif'; rateText='♥'.repeat(r.value)+'♡'.repeat(5-r.value); rateW=ctx.measureText(rateText).width; }
        if(colW-rateW-nameW>56){
          ctx.save(); ctx.strokeStyle='#D8D8DE'; ctx.lineWidth=1; ctx.setLineDash([1.5,4]);
          ctx.beginPath(); ctx.moveTo(x+nameW+12, cy+19); ctx.lineTo(x+colW-rateW-12, cy+19); ctx.stroke(); ctx.restore();
        }
        ctx.fillStyle='#1D1D1F'; ctx.font='500 25px -apple-system,"PingFang SC",sans-serif';
        ctx.fillText(name, x, cy+26);
        ctx.textAlign='right';
        if(r.value===REJECT){ ctx.fillStyle='#86868B'; ctx.font='600 23px -apple-system,"PingFang SC",sans-serif'; ctx.fillText('拒绝', x+colW, cy+26); }
        else{ ctx.fillStyle='#FA243C'; ctx.font='400 26px -apple-system,"PingFang SC",sans-serif'; ctx.fillText(rateText, x+colW, cy+26); }
        ctx.textAlign='left'; ctx.font='500 25px -apple-system,"PingFang SC",sans-serif';
        cy+=40;
      }else{
        ctx.fillStyle='#1D1D1F';
        ctx.font='600 25px -apple-system,"PingFang SC",sans-serif';
        var ansW=Math.min(ctx.measureText(r.value).width, 300);
        ctx.font='500 25px -apple-system,"PingFang SC",sans-serif';
        var ls=wrapText(ctx, r.name, colW-ansW-48);
        if(ls.length===1){
          var firstW=ctx.measureText(ls[0]).width;
          if(colW-ansW-firstW>56){
            ctx.save(); ctx.strokeStyle='#D8D8DE'; ctx.lineWidth=1; ctx.setLineDash([1.5,4]);
            ctx.beginPath(); ctx.moveTo(x+firstW+12, cy+19); ctx.lineTo(x+colW-ansW-12, cy+19); ctx.stroke(); ctx.restore();
          }
        }
        ls.forEach(function(ln,li){ ctx.fillText(ln, x, cy+26+li*34); });
        ctx.textAlign='right'; ctx.fillStyle= (r.value==='是') ? '#FA243C' : '#48484A';
        ctx.font='600 25px -apple-system,"PingFang SC",sans-serif';
        var ans=r.value; while(ctx.measureText(ans).width>300 && ans.length>1) ans=ans.slice(0,-1);
        if(ans!==r.value) ans=ans.slice(0,-1)+'…';
        ctx.fillText(ans, x+colW, cy+26);
        ctx.textAlign='left'; ctx.font='500 25px -apple-system,"PingFang SC",sans-serif';
        cy+=Math.max(40, ls.length*34+10);
      }
    });
    return cy+30;
  }
  cols.forEach(function(gs,ci){
    var x=PAD+ci*(colW+COLGAP), y=300;
    gs.forEach(function(g){ y=drawGroup(g,x,y); });
  });
  ctx.fillStyle='#AEAEB2'; ctx.font='400 20px -apple-system,"PingFang SC",sans-serif';
  ctx.textAlign='center';
  FORM_FOOTER.split('\n').forEach(function(line,li){ ctx.fillText(line, W/2, H-118+li*30); });
  var siteText='';
  if(/^https?:$/.test(location.protocol)){
    siteText=location.host+location.pathname.replace(/\/index\.html?$/,'').replace(/\/+$/,'');
  }
  if(siteText) ctx.fillText(siteText, W/2, H-118+3*30);
  ctx.textAlign='left';
  return canvas.toDataURL('image/png');
}
$('exportBtn').addEventListener('click',function(){
  var isB=state.tab==='bdsm';
  var done=isB?bdsmAnswered():lewdAnswered();
  var total=isB?BDSM_ITEM_COUNT:LEWD_QUESTION_COUNT;
  if(done<total){
    toast('还差 '+(total-done)+' 项未填，填完才能生成图片');
    var el=firstIncompleteEl();
    if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
    return;
  }
  try{
    var url=drawExport();
    $('exportImg').src=url;
    var dl=$('downloadBtn'); dl.href=url; dl.setAttribute('download',(isB?'喜好自评表':'淫荡指数')+'.png');
    $('exportMask').classList.add('show');
  }catch(e){ toast('生成图片失败，请换个浏览器再试'); }
});
function closeExport(){ $('exportMask').classList.remove('show'); }
$('exportClose').addEventListener('click',closeExport);
$('exportClose2').addEventListener('click',closeExport);
$('exportMask').addEventListener('click',function(e){ if(e.target===$('exportMask')) closeExport(); });

render();
checkResume();
window.__sm={ state:state, calcBdsm:calcBdsm, calcLewd:calcLewd, bdsmAnswered:bdsmAnswered, lewdAnswered:lewdAnswered, buildExportModel:buildExportModel, setR:setR, getR:getR, key:key, checkResume:checkResume, partialForms:partialForms };
})();
</script>
